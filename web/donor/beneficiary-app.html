<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="تكافل — بوابة المستفيدين | تقديم ومتابعة الطلبات الإنسانية">
  <title>تكافل — بوابة المستفيدين</title>
  <link rel="icon" type="image/webp" href="../app-icon.webp">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="donor-style.css">
  <style>
    .beneficiary-bottom-nav{display:none}
    .case-details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .case-detail-item{padding:12px;border-radius:var(--radius-md);background:var(--bg-glass);border:1px solid var(--border)}
    .notification-menu{position:absolute;top:120%;inset-inline-end:0;width:min(320px,calc(100vw - 24px));max-height:380px;overflow:auto;z-index:50;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,.4);padding:0}
    .notification-row{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
    .notification-row:last-child{border-bottom:0}
    .notification-row.unread{background:rgba(232,80,10,.05)}
    @media(max-width:768px){
      .beneficiary-bottom-nav{position:fixed;inset-inline:0;bottom:0;z-index:80;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:var(--bg-sidebar);border-top:1px solid var(--border);box-shadow:0 -8px 24px rgba(0,0,0,.16);backdrop-filter:blur(18px)}
      .beneficiary-bottom-nav button{min-width:0;border:0;background:transparent;color:var(--text-muted);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px 2px;font-size:10px;cursor:pointer}
      .beneficiary-bottom-nav button i{font-size:19px}
      .beneficiary-bottom-nav button.active{color:var(--brand-500);font-weight:800}
      .case-details-grid{grid-template-columns:1fr}
      .page-content{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
    }
    @media(max-width:576px){
      .topbar{display:flex;gap:8px;padding:8px 10px}
      .mobile-menu-toggle{width:36px;height:36px;flex:0 0 36px}
      .topbar-heading{flex:1;min-width:0;padding:0;text-align:start}
      .topbar-actions,html[dir="ltr"] .topbar-actions{position:static;display:flex!important;align-items:center;gap:4px;flex:0 0 auto;min-width:0;margin:0}
      .topbar-actions .notification-control{position:relative!important}
      .notification-control>button{width:38px;height:38px;padding:0!important;justify-content:center}
      .topbar-actions .language-toggle{width:62px;min-width:62px;height:38px;padding-inline:4px;gap:2px}
      .topbar-actions .language-toggle-icon.flag-sudan,.topbar-actions .language-toggle-icon.flag-uk{width:22px;height:22px}
      .topbar-actions .theme-toggle{width:56px;min-width:56px!important;height:38px;min-height:38px;padding:3px!important}
      .notification-menu{top:calc(var(--topbar-h) + env(safe-area-inset-top) + 8px)!important;right:10px!important;left:10px!important;z-index:100}
    }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script type="importmap">
  {
    "imports": {
      "firebase-config": "../firebase-config.js",
      "donor-auth": "./donor-auth.js",
      "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18/jsx-dev-runtime"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07090f">
    <div style="text-align:center">
      <div class="spinner" style="width:2.5rem;height:2.5rem;margin:0 auto"></div>
      <p style="margin-top:16px;color:rgba(255,255,255,0.5);font-family:Tajawal,sans-serif">تحميل بوابة المستفيدين...</p>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script type="text/babel" data-type="module">
import { auth, db } from 'firebase-config';
import { uploadMultipleToSupabase } from '../supabase-config.js';
import {
  collection, query, where, orderBy, onSnapshot,
  doc, setDoc, updateDoc, deleteDoc, writeBatch, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';
import { requireDonorAuth, getDonorProfile, logoutDonor } from 'donor-auth';

const { useState, useEffect, useRef } = React;

// ─── HELPERS ───
const ini = (n='') => (n||'م').trim().split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'م';
const fmtNum = n => Number(n||0).toLocaleString('ar');
const fmtDate = (ts,isAr=true) => {
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(typeof ts === 'number' ? (ts > 1e12 ? ts : ts*1000) : ts);
  return new Intl.DateTimeFormat(isAr?'ar':'en',{year:'numeric',month:'short',day:'numeric'}).format(d);
};
const timestampMillis = ts => {
  if(!ts) return 0;
  if(typeof ts.toMillis==='function') return ts.toMillis();
  if(typeof ts.toDate==='function') return ts.toDate().getTime();
  const value=typeof ts==='number'&&ts<1e12?ts*1000:new Date(ts).getTime();
  return Number.isFinite(value)?value:0;
};
const formatDateTime = (ts,isAr) => {
  const value=timestampMillis(ts);
  return value?new Intl.DateTimeFormat(isAr?'ar':'en',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)):'';
};

function showToast(type, msg) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.innerHTML = `<i class="bi ${type==='success'?'bi-check-circle-fill':'bi-exclamation-circle-fill'}"></i><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},3000);
}

const Av = ({name, size=36}) => (
  <div className="avatar" style={{width:size,height:size,fontSize:`${size*.38}px`}}>{ini(name)}</div>
);

// ═══════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════
function App() {
  const [page, setPage] = useState('home');
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState({name:'...',email:''});
  const [systemSettings, setSystemSettings] = useState({});
  const [myCases, setMyCases] = useState([]);
  const [notifications, setNotifications] = useState([]);
  const [chat, setChat] = useState(null);
  const [chatMessages, setChatMessages] = useState([]);
  const [selectedCase, setSelectedCase] = useState(null);
  const [showNotifications, setShowNotifications] = useState(false);
  const [chatLoading, setChatLoading] = useState(false);
  const [sendingMessage, setSendingMessage] = useState(false);
  const [messageText, setMessageText] = useState('');
  const [loading, setLoading] = useState(true);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const chatCreationAttempted = useRef('');
  const [chatRetryCount, setChatRetryCount] = useState(0);

  const [lang, setLang] = useState(() => localStorage.getItem('takaful-lang') || 'ar');
  const isAr = lang === 'ar';
  const toggleLang = () => {
    const nl = isAr ? 'en' : 'ar';
    setLang(nl);
    requestAnimationFrame(() => { const button = document.querySelector('.language-toggle'); if (button) { button.classList.remove('is-changing'); void button.offsetWidth; button.classList.add('is-changing'); } });
  };

  useEffect(() => {
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    localStorage.setItem('takaful-lang', lang);
  }, [lang]);

  const [dark, setDark] = useState(() => {
    const mode = localStorage.getItem('takaful-theme-mode');
    if (mode === 'light') return false;
    if (mode === 'dark') return true;
    const hour = new Date().getHours();
    return !(hour >= 6 && hour < 18);
  });

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    localStorage.setItem('takaful-theme-mode',dark?'dark':'light');
  },[dark]);

  useEffect(()=>{
    const unsub = requireDonorAuth(async u => {
      setUser(u);
      const p = await getDonorProfile(u.uid);
      setProfile(p);
      setLoading(false);
    });
    return ()=>unsub&&unsub();
  },[]);

  useEffect(()=>{
    if(loading||!user) return;
    const settingsUnsub = onSnapshot(doc(db,'settings','general'), s => setSystemSettings(s.exists() ? s.data() : {}));
    const q = query(collection(db,'cases'), where('beneficiaryId','==',user.uid));
    const unsub = onSnapshot(q, s => {
      const docs = s.docs.map(d=>({id:d.id,...d.data()}));
      docs.sort((a,b)=>{
        const tA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
        const tB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
        return tB - tA;
      });
      setMyCases(docs);
      setSelectedCase(current=>current?docs.find(c=>c.id===current.id)||current:null);
    });
    const notificationsQuery = query(collection(db,'notifications'), where('userId','==',user.uid));
    const notificationsUnsub = onSnapshot(notificationsQuery, s => {
      const docs = s.docs.map(d=>({id:d.id,...d.data()}));
      docs.sort((a,b)=>timestampMillis(b.timestamp)-timestampMillis(a.timestamp));
      setNotifications(docs);
    }, err => console.error('Unable to listen for beneficiary notifications:',err));
    return ()=>{ settingsUnsub(); unsub(); notificationsUnsub(); };
  },[loading, user]);

  useEffect(()=>{
    if(loading || !user || page!=='support') return;
    setChatLoading(true);
    const chatsQuery = query(collection(db,'chats'),where('userId','==',user.uid));
    const unsubscribe = onSnapshot(chatsQuery, snapshot => {
      if(snapshot.empty) {
        if(chatCreationAttempted.current===user.uid) return;
        chatCreationAttempted.current=user.uid;
        const chatRef=doc(collection(db,'chats'));
        const chatData={
          userId:user.uid,
          userName:profile.name||user.displayName||user.email||'مستفيد',
          createdAt:serverTimestamp(),
          lastMessage:'',
          lastMessageTime:serverTimestamp()
        };
        setDoc(chatRef,chatData).then(()=>{
          setChat({id:chatRef.id,...chatData,lastMessageTime:Date.now()});
          setChatLoading(false);
        }).catch(error=>{
          console.error('Unable to create support chat:',error);
          chatCreationAttempted.current='';
          setChatLoading(false);
          showToast('error',isAr?'تعذر بدء محادثة الدعم. يرجى المحاولة لاحقاً.':'Could not start support chat. Please try again.');
        });
        return;
      }
      const docs=snapshot.docs.slice().sort((a,b)=>timestampMillis(b.data().lastMessageTime)-timestampMillis(a.data().lastMessageTime));
      const latest=docs[0];
      chatCreationAttempted.current='';
      setChat({id:latest.id,...latest.data()});
      setChatLoading(false);
    },error=>{
      console.error('Unable to listen for beneficiary support chat:',error);
      setChatLoading(false);
      showToast('error',isAr?'تعذر تحميل محادثة الدعم.':'Unable to load support chat.');
    });
    return ()=>unsubscribe();
  },[loading,user,page,profile.name,isAr,chatRetryCount]);

  useEffect(()=>{
    if(!chat?.id || page!=='support') { setChatMessages([]); return; }
    const messagesQuery=query(collection(db,'chats',chat.id,'messages'),orderBy('createdAt','asc'));
    return onSnapshot(messagesQuery,snapshot=>{
      setChatMessages(snapshot.docs.map(d=>({id:d.id,...d.data()})));
      setChatLoading(false);
    },error=>{
      console.error('Unable to listen for support messages:',error);
      setChatLoading(false);
      showToast('error',isAr?'تعذر تحميل الرسائل.':'Unable to load messages.');
    });
  },[chat?.id,page,isAr]);

  const openPage = id => { setPage(id); setSidebarOpen(false); setShowNotifications(false); };
  const markNotificationRead = async notification => {
    if(notification.isRead) return;
    try { await updateDoc(doc(db,'notifications',notification.id),{isRead:true}); }
    catch(error) { showToast('error',isAr?'تعذر تحديث الإشعار.':'Could not update notification.'); }
  };
  const sendSupportMessage = async event => {
    event.preventDefault();
    const text=messageText.trim();
    if(!text || !chat?.id || sendingMessage) return;
    setSendingMessage(true);
    try {
      const messageRef=doc(collection(db,'chats',chat.id,'messages'));
      const batch=writeBatch(db);
      batch.set(messageRef,{
        sender:'user',
        senderId:user.uid,
        senderName:profile.name||user.displayName||'مستفيد',
        senderPhotoUrl:profile.photoURL||'',
        text,
        createdAt:serverTimestamp(),
        timestamp:Date.now(),
        isRead:false
      });
      batch.update(doc(db,'chats',chat.id),{lastMessage:text,lastMessageTime:serverTimestamp()});
      await batch.commit();
      setMessageText('');
    } catch(error) {
      showToast('error',(isAr?'تعذر إرسال الرسالة: ':'Could not send message: ')+error.message);
    } finally { setSendingMessage(false); }
  };
  const editSupportMessage = async (messageId,text) => {
    const updatedText=text.trim();
    if(!chat?.id||!messageId||!updatedText) return false;
    try {
      await updateDoc(doc(db,'chats',chat.id,'messages',messageId),{text:updatedText,updatedAt:serverTimestamp()});
      return true;
    } catch(error) {
      console.error('Unable to edit beneficiary support message:',error);
      showToast('error',(isAr?'تعذر تعديل الرسالة: ':'Could not edit message: ')+error.message);
      return false;
    }
  };
  const deleteSupportMessage = async messageId => {
    if(!chat?.id||!messageId||!window.confirm(isAr?'حذف هذه الرسالة نهائياً؟':'Delete this message permanently?')) return;
    try {
      await deleteDoc(doc(db,'chats',chat.id,'messages',messageId));
    } catch(error) {
      console.error('Unable to delete beneficiary support message:',error);
      showToast('error',(isAr?'تعذر حذف الرسالة: ':'Could not delete message: ')+error.message);
    }
  };

  if(loading) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div className="spinner"></div>
    </div>
  );

  const NAV = isAr ? [
    {id:'home',l:'الرئيسية',icon:'bi-house-fill'},
    {id:'cases',l:'طلباتي',icon:'bi-card-list'},
    {id:'submit',l:'تقديم طلب',icon:'bi-plus-circle-fill'},
    {id:'support',l:'الدعم',icon:'bi-chat-dots-fill'},
    {id:'profile',l:'حسابي',icon:'bi-person-fill'},
  ] : [
    {id:'home',l:'Home',icon:'bi-house-fill'},
    {id:'cases',l:'My Requests',icon:'bi-card-list'},
    {id:'submit',l:'Submit Request',icon:'bi-plus-circle-fill'},
    {id:'support',l:'Support',icon:'bi-chat-dots-fill'},
    {id:'profile',l:'My Account',icon:'bi-person-fill'},
  ];
  const unreadNotifications=notifications.filter(n=>!n.isRead).length;

  return (
    <div className="app-layout">
      {sidebarOpen && <div className="sidebar-backdrop" onClick={()=>setSidebarOpen(false)}></div>}
      <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
        <div className="sidebar-header">
          <div className="sidebar-logo">
            <img src="../app-icon.webp" alt="تكافل" />
          </div>
          <div className="sidebar-brand">
            <h2>{isAr ? 'تـكـافـل' : 'Takaful'}</h2>
            <p style={{color:'var(--gold-500)'}}>{isAr ? 'بوابة المستفيدين' : 'Beneficiary Portal'}</p>
            {systemSettings.apk_url || systemSettings.play_store_link ? <a href={systemSettings.apk_url || systemSettings.play_store_link} target="_blank" rel="noreferrer" className="btn btn-primary btn-sm" style={{marginTop:8,width:'100%'}}><i className="bi bi-phone me-1"></i>{isAr ? 'تحميل تطبيق Android' : 'Download Android App'}</a> : null}
          </div>
        </div>
        <nav className="sidebar-nav">
          {NAV.map(n=>(
            <div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>openPage(n.id)} role="button" tabIndex={0} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPage(n.id);}}}>
              <i className={`bi ${n.icon} nav-icon`}></i>
              <span style={{flex:1}}>{n.l}</span>
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="user-card" style={{flexDirection:'column',gap:10,padding:'14px 16px',alignItems:'flex-start'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,width:'100%'}}>
              {profile.photoURL
                ? <img src={profile.photoURL} alt={profile.name} style={{width:40,height:40,borderRadius:'50%',objectFit:'cover',border:'none',flexShrink:0, background:'#FFFFFF'}} />
                : <div className="avatar" style={{width:40,height:40,fontSize:'15px'}}>{ini(profile.name)}</div>
              }
              <div style={{flex:1,minWidth:0}}>
                <div className="user-name truncate" style={{fontSize:13}}>{profile.name}</div>
                <div className="user-role truncate" style={{fontSize:11,color:'var(--gold-500)'}}>{isAr ? 'بوابة المستفيدين' : 'Beneficiary Portal'}</div>
              </div>
            </div>
            <button
              onClick={logoutDonor}
              style={{width:'100%',padding:'9px 14px',borderRadius:'var(--radius-sm)',background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.2)',color:'#F87171',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:8,transition:'all 0.2s ease'}}
              onMouseEnter={e=>{e.currentTarget.style.background='rgba(239,68,68,0.2)'}}
              onMouseLeave={e=>{e.currentTarget.style.background='rgba(239,68,68,0.1)'}}
            >
              <i className="bi bi-box-arrow-right"></i> {isAr ? 'تسجيل الخروج' : 'Sign Out'}
            </button>
            <SocialLinks settings={systemSettings} isAr={isAr} />
          </div>
        </div>
      </aside>

      <div className="main-content">
        <header className="topbar">
          <button className="mobile-menu-toggle" type="button" aria-label="Open menu" onClick={()=>setSidebarOpen(true)}><i className="bi bi-list"></i></button>
          <div className="topbar-heading" style={{flex:1}}>
            <div className="topbar-title">{NAV.find(n=>n.id===page)?.l || (isAr ? 'تكافل' : 'Takaful')}</div>
          </div>
          <div className="topbar-actions" style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{position:'relative'}}>
              <button type="button" className="btn btn-icon" aria-label={isAr?'الإشعارات':'Notifications'} aria-expanded={showNotifications} onClick={()=>setShowNotifications(v=>!v)} style={{position:'relative'}}>
                <i className="bi bi-bell-fill"></i>
                {unreadNotifications>0&&<span style={{position:'absolute',top:-4,insetInlineEnd:-4,minWidth:17,height:17,borderRadius:20,background:'var(--red)',color:'#fff',fontSize:10,fontWeight:800,display:'grid',placeItems:'center',padding:'0 3px'}}>{unreadNotifications>9?'9+':unreadNotifications}</span>}
              </button>
              {showNotifications&&<>
                <div onClick={()=>setShowNotifications(false)} style={{position:'fixed',inset:0,zIndex:40}}></div>
                <div className="card notification-menu">
                  <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',fontWeight:800,display:'flex',justifyContent:'space-between',alignItems:'center',background:'linear-gradient(135deg,rgba(232,80,10,.08),transparent)',borderRadius:'var(--radius-lg) var(--radius-lg) 0 0'}}>
                    <span style={{display:'flex',alignItems:'center',gap:8}}><i className="bi bi-bell-fill" style={{color:'var(--brand-400)'}}></i>{isAr?'الإشعارات':'Notifications'}</span>
                    {unreadNotifications>0&&<button type="button" className="btn btn-ghost" style={{fontSize:11,padding:'4px 10px',borderRadius:20,border:'1px solid var(--border)'}} onClick={async()=>{await Promise.all(notifications.filter(n=>!n.isRead).map(markNotificationRead));}}>{isAr?'تحديد كمقروء':'Mark all read'}</button>}
                  </div>
                  {notifications.length===0
                    ? <div style={{padding:28,textAlign:'center',color:'var(--text-muted)'}}><i className="bi bi-bell-slash" style={{fontSize:32,display:'block',marginBottom:10,opacity:.4}}></i>{isAr?'لا توجد إشعارات':'No notifications'}</div>
                    : notifications.slice(0,8).map(n=><div key={n.id} className={`notification-row ${n.isRead?'':'unread'}`} onClick={()=>markNotificationRead(n)} role="button" tabIndex={0} onKeyDown={e=>{if(e.key==='Enter')markNotificationRead(n);}}>
                      <div className="text-sm bold" style={{color:n.isRead?'var(--text-primary)':'var(--brand-400)'}}>{n.title||(isAr?'تحديث جديد':'New update')}</div>
                      <div className="text-xs" style={{marginTop:4,color:'var(--text-secondary)'}}>{n.message||''}</div>
                      <div className="text-xs text-muted" style={{marginTop:4}}>{formatDateTime(n.timestamp,isAr)}</div>
                    </div>)}
                </div>
              </>}
            </div>
            {/* Language Toggle */}
            <button onClick={toggleLang} className={`language-toggle ${isAr ? 'is-ar' : 'is-en'}`} title={isAr ? 'Switch to English' : 'التبديل للعربية'}>
              <span className={`language-toggle-icon ${isAr ? 'flag-uk' : 'flag-sudan'}`} aria-hidden="true">{isAr ? '🇬🇧' : '🇸🇩'}</span>
              <span className="language-toggle-label">{isAr ? 'EN' : 'Ar'}</span>
            </button>
            {/* Day/Night pill toggle */}
            <button
              onClick={()=>{setDark(d=>!d); requestAnimationFrame(()=>{const b=document.querySelector('.theme-toggle'); if(b){b.classList.remove('is-changing'); void b.offsetWidth; b.classList.add('is-changing');}})}}
              className="theme-toggle"
              title={dark?(isAr?'تفعيل الوضع النهاري':'Switch to Light Mode'):(isAr?'تفعيل الوضع الليلي':'Switch to Dark Mode')}
              style={{display:'flex',alignItems:'center',padding:'5px 6px',borderRadius:'50px',background:dark?'rgba(30,30,60,0.9)':'rgba(255,200,50,0.15)',border:'1px solid',borderColor:dark?'rgba(100,100,255,0.2)':'rgba(249,168,37,0.35)',cursor:'pointer',transition:'all 0.35s ease',backdropFilter:'blur(10px)',gap:2,minWidth:70}}
            >
              <span className={`theme-toggle-icon ${!dark ? 'is-active' : ''}`} aria-hidden="true"><i className="bi bi-sun-fill" /></span>
              <span className={`theme-toggle-icon moon ${dark ? 'is-active' : ''}`} aria-hidden="true"><i className="bi bi-moon-stars-fill" /></span>
            </button>
          </div>
        </header>
        <main className="page-content">
          {profile.status === 'pending_verification' ? (
            <div className="card" style={{textAlign:'center', padding:'40px 20px', marginTop:'20px'}}>
              <i className="bi bi-shield-lock-fill" style={{fontSize:48, color:'var(--gold-500)', marginBottom:16, display:'block'}}></i>
              <h3>{isAr ? 'حسابك قيد المراجعة' : 'Account Under Review'}</h3>
              <p style={{color:'var(--text-secondary)', marginTop:8}}>
                {isAr ? (
                  <>لقد استلمنا طلب تسجيلك والمرفقات الخاصة بإثبات الهوية.<br/>سيقوم مدير النظام بمراجعة الطلب والموافقة عليه قريباً. يرجى التحلي بالصبر.</>
                ) : (
                  <>We received your registration request and identity proof.<br/>System admin will review and approve your account soon. Please be patient.</>
                )}
              </p>
            </div>
          ) : (
            <>
              {page==='home' && <HomePage cases={myCases} profile={profile} onGoSubmit={()=>openPage('submit')} onGoCases={()=>openPage('cases')} onSelectCase={setSelectedCase} isAr={isAr} />}
              {page==='cases' && <MyCasesPage cases={myCases} onSelectCase={setSelectedCase} isAr={isAr} />}
              {page==='submit' && <SubmitCasePage user={user} onSuccess={()=>openPage('cases')} isAr={isAr} />}
              {page==='support' && <SupportPage chat={chat} messages={chatMessages} loading={chatLoading} text={messageText} setText={setMessageText} sending={sendingMessage} onSend={sendSupportMessage} onEditMessage={editSupportMessage} onDeleteMessage={deleteSupportMessage} onRetry={()=>{chatCreationAttempted.current='';setChat(null);setChatLoading(true);setChatRetryCount(count=>count+1);}} profile={profile} user={user} isAr={isAr} />}
              {page==='profile' && <ProfilePage profile={profile} cases={myCases} dark={dark} setDark={setDark} user={user} setProfile={setProfile} isAr={isAr} />}
            </>
          )}
        </main>
      </div>
      <nav className="beneficiary-bottom-nav" aria-label={isAr?'التنقل الرئيسي':'Main navigation'}>
        {NAV.map(n=><button key={n.id} type="button" className={page===n.id?'active':''} aria-current={page===n.id?'page':undefined} onClick={()=>openPage(n.id)}><i className={`bi ${n.icon}`}></i><span>{n.l}</span></button>)}
      </nav>
      {selectedCase&&<CaseDetailsModal c={selectedCase} isAr={isAr} onClose={()=>setSelectedCase(null)} />}
    </div>
  );
}

function SocialLinks({settings, isAr}) {
  const links = [['facebook_url','bi-facebook',isAr?'فيسبوك':'Facebook'],['twitter_url','bi-twitter-x',isAr?'إكس':'X'],['instagram_url','bi-instagram',isAr?'إنستغرام':'Instagram'],['contact_phone','bi-whatsapp',isAr?'واتساب':'WhatsApp']].filter(([key])=>settings[key]);
  if (!links.length) return null;
  return <div style={{display:'flex',gap:10,flexWrap:'wrap',paddingTop:8,borderTop:'1px solid var(--border)',width:'100%'}}>{links.map(([key,icon,label])=>{const href=key==='contact_phone'?`https://wa.me/${String(settings[key]).replace(/[^0-9]/g,'')}`:settings[key];return <a key={key} href={href} target="_blank" rel="noreferrer" title={label} style={{color:'var(--text-secondary)',fontSize:18}}><i className={`bi ${icon}`}></i></a>})}</div>;
}

function HomePage({cases, profile, onGoSubmit, onGoCases, onSelectCase, isAr}) {

  const active = cases.filter(c=>c.status==='active'||c.status==='approved').length;
  const completed = cases.filter(c=>c.status==='completed').length;
  
  const hour = new Date().getHours();
  const greeting = hour>=5&&hour<12 ? (isAr?'صباح الخير':'Good morning') : hour>=12&&hour<18 ? (isAr?'مساء الخير':'Good afternoon') : (isAr?'طابت مساؤك':'Good evening');

  return (
    <div>
      <div className="hero-header" style={{background:'linear-gradient(135deg,var(--brand-800),var(--gold-700))'}}>
        <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:16}}>
          <div style={{position:'relative'}}>
            {profile.photoURL
              ? <img src={profile.photoURL} alt={profile.name} style={{width:56,height:56,borderRadius:'50%',objectFit:'cover',border:'none',boxShadow:'0 4px 16px rgba(0,0,0,0.3)', background:'#FFFFFF'}} />
              : <div style={{width:56,height:56,borderRadius:'50%',background:'rgba(255,255,255,0.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,fontWeight:900,color:'#fff',border:'none'}}>{ini(profile.name)}</div>
            }
          </div>
          <div>
            <div className="hero-greeting" style={{fontSize:13}}>{greeting}،</div>
            <div className="hero-name" style={{fontSize:20}}>{(profile.name||'').split(' ').slice(0,2).join(' ')||(isAr?'مستفيد':'Beneficiary')}</div>
          </div>
        </div>
        <div className="hero-stats">
          <div className="hero-stat" onClick={onGoCases} style={{cursor:'pointer'}}>
            <div className="hero-stat-label"><i className="bi bi-folder2-open"></i> {isAr?'طلبات نشطة':'Active Requests'}</div>
            <div className="hero-stat-value">{active} {isAr?'طلب':'req'}</div>
          </div>
          <div className="hero-stat">
            <div className="hero-stat-label"><i className="bi bi-clock-history"></i> {isAr?'قيد المراجعة':'Under Review'}</div>
            <div className="hero-stat-value">{pending} {isAr?'طلب':'req'}</div>
          </div>
        </div>
      </div>

      <div style={{display:'flex',gap:16,marginBottom:24,flexWrap:'wrap'}}>
        <button className="btn btn-primary" onClick={onGoSubmit} style={{flex:1,minWidth:200,height:56,fontSize:16}}>
          <i className="bi bi-plus-circle-fill"></i> {isAr?'تقديم طلب مساعدة جديد':'Submit New Request'}
        </button>
      </div>

      <div className="section-header">
        <div className="section-title"><div className="section-bar"></div>{isAr?'أحدث طلباتي':'My Recent Requests'}</div>
        <div className="section-action" onClick={onGoCases}>{isAr?'عرض الكل ':'View All '}<i className={`bi ${isAr?'bi-chevron-left':'bi-chevron-right'}`}></i></div>
      </div>

      {cases.length === 0 ? (
        <div className="card"><div className="empty-state"><i className="bi bi-folder"></i><h3>{isAr?'لا توجد طلبات سابقة':'No Previous Requests'}</h3><p>{isAr?'يمكنك رفع طلب مساعدة جديد ليتم مراجعته':'You can submit a new aid request for review'}</p></div></div>
      ) : (
        <div className="cases-grid">
          {cases.slice(0,2).map(c=><CaseCard key={c.id} c={c} onSelect={()=>onSelectCase(c)} isAr={isAr} />)}
        </div>
      )}
    </div>
  );
}

// CASE CARD
// ═══════════════════════════════════════
function CaseCard({c, onSelect, isAr}) {
  const target = c.targetAmount||c.amountRequired||0;
  const raised = c.raisedAmount||c.amountRaised||0;
  const pct = target > 0 ? Math.min(Math.round(raised/target*100),100) : 0;
  const firstImg = (c.imageUrls && c.imageUrls.length > 0) ? c.imageUrls[0] : c.imageUrl || c.documentUrl || '';

  const getStatus = (status) => {
    switch(status) {
      case 'pending': return <span className="badge badge-medium">{isAr?'قيد المراجعة':'Under Review'}</span>;
      case 'approved': 
      case 'active': return <span className="badge badge-urgent" style={{background:'rgba(16,185,129,0.1)',color:'var(--brand-500)'}}>{isAr?'نشط ويتم الجمع':'Active & Collecting'}</span>;
      case 'rejected': return <span className="badge badge-urgent">{isAr?'مرفوض':'Rejected'}</span>;
      case 'completed': return <span className="badge badge-status-distributed">{isAr?'مكتمل':'Completed'}</span>;
      default: return <span className="badge badge-cat">{status}</span>;
    }
  };

  return (
    <div className="case-card">
      <div className="case-card-image" style={{position:'relative', height:140}}>
        {firstImg ? <img src={firstImg} alt={c.title} /> : (
          <div className="case-card-image-placeholder"><i className="bi bi-image"></i></div>
        )}
        <div className="case-card-overlay"></div>
        <div className="case-card-badges">
          <span className="badge badge-cat">{c.category||'عام'}</span>
        </div>
      </div>
      <div className="case-card-body">
        <div className="case-card-title">{c.title||(isAr?'بدون عنوان':'Untitled')}</div>
        <div className="case-card-desc" style={{marginBottom:12}}>{getStatus(c.status)}</div>
        {onSelect&&<button type="button" className="btn btn-outline btn-sm" onClick={()=>onSelect(c)}>{isAr?'تفاصيل الطلب':'Case details'} <i className="bi bi-arrow-up-left"></i></button>}
        
        {c.category==='مالي' && target > 0 && (
          <div className="case-card-progress">
            <div className="case-card-progress-labels">
              <span className="text-brand bold">{isAr?'تم جمع:':'Raised:'} {fmtNum(raised)} {isAr?'ج.س':'SDG'}</span>
              <span className="text-muted">{pct}%</span>
            </div>
            <div className="progress-bar"><div className="progress-fill animated" style={{width:`${pct}%`}}></div></div>
            <div className="text-xs text-muted" style={{marginTop:4}}>{isAr?'المطلوب:':'Target:'} {fmtNum(target)} {isAr?'ج.س':'SDG'}</div>
          </div>
        )}
      </div>
    </div>
  );
}

// MY CASES PAGE
// ═══════════════════════════════════════
function MyCasesPage({cases, onSelectCase, isAr}) {
  const [search,setSearch]=useState('');
  const [status,setStatus]=useState('all');
  const [category,setCategory]=useState('all');
  const normalizedSearch=search.trim().toLocaleLowerCase(isAr?'ar':'en');
  const filteredCases=cases.filter(c=>{
    const text=[c.title,c.description,c.story,c.location,c.category].filter(Boolean).join(' ').toLocaleLowerCase(isAr?'ar':'en');
    return (!normalizedSearch||text.includes(normalizedSearch))
      &&(status==='all'||c.status===status)
      &&(category==='all'||c.category===category);
  });
  return (
    <div>
      <div className="section-header" style={{marginBottom:20}}>
        <div className="section-title"><div className="section-bar"></div>{isAr?'سجل طلباتي':'My Requests History'}</div>
      </div>
      <div className="card" style={{padding:16,marginBottom:18}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12}}>
          <label style={{position:'relative'}}>
            <i className="bi bi-search" style={{position:'absolute',insetInlineStart:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)'}}></i>
            <input className="form-input" type="search" value={search} onChange={e=>setSearch(e.target.value)} placeholder={isAr?'ابحث بالعنوان أو الوصف أو الموقع':'Search title, description or location'} aria-label={isAr?'بحث في طلباتي':'Search my requests'} style={{paddingInlineStart:38}} />
          </label>
          <select className="form-input" value={status} onChange={e=>setStatus(e.target.value)} aria-label={isAr?'تصفية حسب الحالة':'Filter by status'}>
            <option value="all">{isAr?'كل الحالات':'All statuses'}</option>
            <option value="pending">{isAr?'قيد المراجعة':'Under review'}</option>
            <option value="approved">{isAr?'معتمد':'Approved'}</option>
            <option value="active">{isAr?'نشط':'Active'}</option>
            <option value="rejected">{isAr?'مرفوض':'Rejected'}</option>
            <option value="completed">{isAr?'مكتمل':'Completed'}</option>
          </select>
          <select className="form-input" value={category} onChange={e=>setCategory(e.target.value)} aria-label={isAr?'تصفية حسب التصنيف':'Filter by category'}>
            <option value="all">{isAr?'كل التصنيفات':'All categories'}</option>
            <option value="مالي">{isAr?'مالي':'Financial'}</option>
            <option value="طبي">{isAr?'طبي':'Medical'}</option>
            <option value="عيني">{isAr?'عيني':'In-kind'}</option>
          </select>
        </div>
        <div className="text-xs text-muted" style={{marginTop:10}}>{isAr?`عرض ${fmtNum(filteredCases.length)} من ${fmtNum(cases.length)} طلب`:`Showing ${filteredCases.length} of ${cases.length} requests`}</div>
      </div>
      {cases.length === 0 ? (
        <div className="card"><div className="empty-state"><i className="bi bi-folder-x"></i><h3>{isAr?'لا توجد طلبات سابقة':'No Previous Requests'}</h3></div></div>
      ) : filteredCases.length===0 ? (
        <div className="card"><div className="empty-state"><i className="bi bi-search"></i><h3>{isAr?'لا توجد طلبات مطابقة':'No matching requests'}</h3><p>{isAr?'جرّب تغيير كلمات البحث أو عوامل التصفية':'Try changing your search or filters'}</p></div></div>
      ) : (
        <div className="cases-grid">
          {filteredCases.map(c=><CaseCard key={c.id} c={c} onSelect={()=>onSelectCase(c)} isAr={isAr} />)}
        </div>
      )}
    </div>
  );
}

function CaseDetailsModal({c,isAr,onClose}) {
  const statusLabels=isAr
    ? {pending:'قيد المراجعة',approved:'معتمد',active:'نشط ويتم الجمع',rejected:'مرفوض',completed:'مكتمل'}
    : {pending:'Under review',approved:'Approved',active:'Active & collecting',rejected:'Rejected',completed:'Completed'};
  const categoryLabels=isAr?{مالي:'مالي',طبي:'طبي',عيني:'عيني'}:{مالي:'Financial',طبي:'Medical',عيني:'In-kind'};
  const urgencyLabels=isAr?{عادي:'عادي',متوسط:'متوسط',عاجل:'عاجل'}:{عادي:'Normal',متوسط:'Medium',عاجل:'Urgent'};
  const target=Number(c.targetAmount||c.amountRequired||0);
  const raised=Number(c.raisedAmount||c.amountRaised||0);
  const statusDescription=c.status==='rejected'?(c.rejectionReason||c.adminNote||c.statusReason)
    :c.status==='completed'?(isAr?'تم إكمال الطلب.':'This request has been completed.')
    :c.status==='active'||c.status==='approved'?(isAr?'تم اعتماد طلبك وهو متاح للدعم.':'Your request has been approved and is open for support.')
    :(isAr?'طلبك قيد المراجعة وسيتم إشعارك عند تحديث حالته.':'Your request is under review. You will be notified when its status changes.');
  return <div className="modal-overlay" role="presentation" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal" role="dialog" aria-modal="true" aria-labelledby="case-details-title">
      <div className="modal-header">
        <div className="modal-title" id="case-details-title"><i className="bi bi-file-earmark-text-fill" style={{color:'var(--brand-500)'}}></i>{isAr?'تفاصيل الطلب':'Request details'}</div>
        <button type="button" className="modal-close" onClick={onClose} aria-label={isAr?'إغلاق':'Close'}><i className="bi bi-x-lg"></i></button>
      </div>
      <div className="modal-body">
        {(c.imageUrls?.[0]||c.imageUrl||c.documentUrl)&&<img src={c.imageUrls?.[0]||c.imageUrl||c.documentUrl} alt={isAr?'مرفق الطلب':'Request attachment'} style={{width:'100%',maxHeight:230,objectFit:'cover',borderRadius:'var(--radius-md)',marginBottom:16}} />}
        <h3 style={{fontSize:20,marginBottom:8}}>{c.title||(isAr?'طلب مساعدة':'Aid request')}</h3>
        <div style={{marginBottom:14}}><span className="badge badge-cat">{categoryLabels[c.category]||c.category|| (isAr?'عام':'General')}</span> <span className="badge badge-medium">{statusLabels[c.status]||c.status||'—'}</span></div>
        <p style={{color:'var(--text-secondary)',lineHeight:1.8,whiteSpace:'pre-wrap'}}>{c.description||c.story|| (isAr?'لا يوجد وصف إضافي.':'No additional description.')}</p>
        <div className="case-details-grid" style={{marginTop:16}}>
          <div className="case-detail-item"><div className="text-xs text-muted">{isAr?'الموقع':'Location'}</div><strong>{c.location||'—'}</strong></div>
          <div className="case-detail-item"><div className="text-xs text-muted">{isAr?'الأهمية':'Priority'}</div><strong>{urgencyLabels[c.urgencyLevel]||c.urgencyLevel||'—'}</strong></div>
          <div className="case-detail-item"><div className="text-xs text-muted">{isAr?'تاريخ التقديم':'Submitted'}</div><strong>{fmtDate(c.createdAt,isAr)}</strong></div>
          <div className="case-detail-item"><div className="text-xs text-muted">{isAr?'آخر تحديث':'Last updated'}</div><strong>{fmtDate(c.updatedAt||c.reviewedAt||c.createdAt,isAr)}</strong></div>
        </div>
        {target>0&&<div className="card" style={{padding:14,marginTop:14}}>
          <div style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:13}}><strong>{isAr?'المبلغ المطلوب':'Requested amount'}: {fmtNum(target)} {isAr?'ج.س':'SDG'}</strong><span>{isAr?'تم جمع':'Raised'}: {fmtNum(raised)} {isAr?'ج.س':'SDG'}</span></div>
          <div className="progress-bar" style={{marginTop:10}}><div className="progress-fill animated" style={{width:`${Math.min(Math.round(raised/target*100),100)}%`}}></div></div>
        </div>}
        <div className="case-detail-item" style={{marginTop:14}}><strong>{isAr?'تحديث الحالة':'Status update'}</strong><div style={{color:'var(--text-secondary)',marginTop:6,lineHeight:1.7}}>{statusDescription}</div></div>
        {c.documentUrl&&<a href={c.documentUrl} target="_blank" rel="noreferrer" className="btn btn-outline btn-sm" style={{marginTop:12}}><i className="bi bi-paperclip"></i>{isAr?'فتح المرفق':'Open attachment'}</a>}
      </div>
      <div className="modal-footer"><button type="button" className="btn btn-primary" onClick={onClose}>{isAr?'إغلاق':'Close'}</button></div>
    </div>
  </div>;
}

function SupportPage({chat,messages,loading,text,setText,sending,onSend,onEditMessage,onDeleteMessage,onRetry,profile,user,isAr}) {
  const messagesEndRef=useRef(null);
  const [editingMessage,setEditingMessage]=useState(null);
  useEffect(()=>{messagesEndRef.current?.scrollIntoView({behavior:'smooth',block:'end'});},[messages]);
  const messageTime=m=>formatDateTime(m.createdAt||m.timestamp,isAr);
  const saveEdit=async messageId=>{
    if(!editingMessage||editingMessage.id!==messageId) return;
    if(await onEditMessage(messageId,editingMessage.text)) setEditingMessage(null);
  };
  return <div>
    <div className="section-header" style={{marginBottom:20}}>
      <div className="section-title"><div className="section-bar"></div>{isAr?'الدعم والمحادثات':'Support chat'}</div>
    </div>
    <div className="chat-container">
      <div className="chat-messages">
        <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',fontWeight:700,display:'flex',alignItems:'center',gap:10}}>
          <i className="bi bi-headset" style={{color:'var(--brand-500)'}}></i>
          {isAr?'محادثة الدعم':'Support chat'}
          {chat&&<span className="text-xs text-muted" style={{marginInlineStart:'auto',fontWeight:400}}>{isAr?'متصل':'Online'}</span>}
        </div>
        <div className="chat-messages-body" aria-live="polite">
        {loading&&!chat
          ? <div className="empty-state"><i className="bi bi-chat-heart"></i><h3>{isAr?'جارٍ فتح المحادثة...':'Opening chat...'}</h3><div className="spinner" style={{width:'2.5rem',height:'2.5rem',margin:'16px auto'}}></div></div>
          : !chat
            ? <div className="empty-state" style={{padding:40}}>
                <i className="bi bi-chat-heart" style={{fontSize:48}}></i>
                <p>{isAr?'تعذر فتح المحادثة. تحقق من اتصالك ثم أعد المحاولة.':'Could not open the chat. Check your connection and try again.'}</p>
                <button type="button" className="btn btn-outline" style={{width:'auto',margin:'12px auto'}} onClick={onRetry}>{isAr?'إعادة المحاولة':'Try again'}</button>
              </div>
            : messages.length===0
              ? <div className="empty-state" style={{padding:40}}><i className="bi bi-chat-heart" style={{fontSize:48}}></i><h3>{isAr?'ابدأ محادثة جديدة':'Start a new conversation'}</h3><p>{isAr?'فريق الدعم جاهز لمساعدتك':'Support team is ready to help you'}</p></div>
              : messages.map(m=>{
          const mine=m.senderId===user?.uid;
          const senderName=m.senderName||(mine?profile.name:(isAr?'الدعم':'Support'));
          const photoUrl=m.senderPhotoUrl||m.photoUrl||(mine?profile.photoURL:'');
          return <div className={`chat-bubble ${mine?'mine':'theirs'}`} key={m.id} style={{position:'relative'}}>
            <div className={`chat-message-header ${mine?'mine':''}`} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
              {photoUrl
                ? <img src={photoUrl} alt={senderName} style={{width:28,height:28,borderRadius:'50%',objectFit:'cover',flexShrink:0,border:'2px solid rgba(255,255,255,.2)',background:'#fff'}} />
                : <div style={{width:28,height:28,borderRadius:'50%',background:mine?'rgba(255,255,255,.2)':'rgba(232,80,10,.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:mine?'rgba(255,255,255,.8)':'var(--brand-500)',flexShrink:0}}>
                    {mine?ini(profile.name):<i className="bi bi-headset" style={{fontSize:13}}></i>}
                  </div>}
              <span className="text-xs" style={{opacity:.7,fontWeight:600}}>{senderName}</span>
              {(m.createdAt||m.timestamp)&&<span className="text-xs" style={{opacity:.45,marginInlineStart:'auto'}}>{messageTime(m)}</span>}
            </div>
            {editingMessage?.id===m.id
              ? <div style={{marginTop:8}}>
                  <input className="form-input mb-2" autoFocus maxLength={2000} style={{fontSize:13,padding:6,color:'#000'}} value={editingMessage.text} onChange={event=>setEditingMessage({...editingMessage,text:event.target.value})} onKeyDown={event=>{if(event.key==='Enter'){event.preventDefault();saveEdit(m.id);}}} />
                  <div className="d-flex gap-2 justify-content-end">
                    <button type="button" className="btn btn-sm" style={{padding:'2px 8px',fontSize:11}} onClick={()=>setEditingMessage(null)}>{isAr?'إلغاء':'Cancel'}</button>
                    <button type="button" className="btn btn-sm btn-primary" style={{padding:'2px 8px',fontSize:11}} disabled={!editingMessage.text.trim()} onClick={()=>saveEdit(m.id)}>{isAr?'حفظ':'Save'}</button>
                  </div>
                </div>
              : <div style={{paddingInlineEnd:mine?36:0,paddingInlineStart:mine?0:36,whiteSpace:'pre-wrap'}}>{m.text} {m.updatedAt&&<span style={{fontSize:10,opacity:.6}}>{isAr?'(معدل)':'(edited)'}</span>}</div>}
            {mine&&!editingMessage&&<div className="chat-message-actions">
              <button type="button" onClick={()=>setEditingMessage({id:m.id,text:m.text||''})} title={isAr?'تعديل':'Edit'} aria-label={isAr?'تعديل الرسالة':'Edit message'}><i className="bi bi-pencil"></i></button>
              <button type="button" onClick={()=>onDeleteMessage(m.id)} title={isAr?'حذف':'Delete'} aria-label={isAr?'حذف الرسالة':'Delete message'}><i className="bi bi-trash"></i></button>
            </div>}
          </div>;
        })}
        <div ref={messagesEndRef}></div>
      </div>
      <form className="chat-input-bar" onSubmit={onSend}>
        <input className="chat-input" value={text} onChange={event=>setText(event.target.value)} maxLength={2000} placeholder={isAr?'اكتب رسالتك...':'Type your message...'} aria-label={isAr?'رسالة الدعم':'Support message'} disabled={!chat||sending} />
        <button type="submit" className="chat-send-btn" disabled={!text.trim()||!chat||sending} aria-label={isAr?'إرسال':'Send'}><i className="bi bi-send-fill"></i></button>
      </form>
    </div>
    </div>
  </div>;
}

// ═══════════════════════════════════════
// SUBMIT CASE PAGE
// ═══════════════════════════════════════
function SubmitCasePage({user, onSuccess, isAr}) {
  const [saving, setSaving] = useState(false);
  const [data, setData] = useState({
    title: '', category: 'مالي', targetAmount: '', location: '', urgencyLevel: 'عادي', description: ''
  });
  const [file, setFile] = useState(null);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if(!data.title || !data.description || !data.location) { showToast('error', isAr?'يرجى إكمال الحقول المطلوبة':'Please complete all required fields'); return; }
    if(data.category === 'مالي' && (!data.targetAmount || isNaN(data.targetAmount))) { showToast('error', isAr?'يرجى إدخال مبلغ صحيح':'Please enter a valid amount'); return; }
    
    setSaving(true);
    try {
      let imageUrl = '';
      if(file) {
        const urls = await uploadMultipleToSupabase([file], 'case_documents');
        if (urls && urls.length > 0) {
          imageUrl = urls[0];
        }
      }

      const caseData = {
        beneficiaryId: user.uid,
        createdBy: user.uid,
        title: data.title,
        category: data.category,
        targetAmount: parseFloat(data.targetAmount)||0,
        amountRequired: parseFloat(data.targetAmount)||0, // compatibility
        raisedAmount: 0,
        amountRaised: 0,
        progress: 0,
        location: data.location,
        urgencyLevel: data.urgencyLevel,
        description: data.description,
        story: data.description, // compatibility
        imageUrl: imageUrl,
        documentUrl: imageUrl,           // backward compat
        imageUrls: imageUrl ? [imageUrl] : [], // array form for dashboard & app
        status: 'pending',
        createdAt: serverTimestamp()
      };
      
      const docRef = doc(collection(db,'cases'));
      await setDoc(docRef, { ...caseData, id: docRef.id, caseId: docRef.id });
      
      showToast('success', isAr?'تم رفع طلبك بنجاح، وهو قيد المراجعة الآن.':'Request submitted! It is now under review.');
      onSuccess();
    } catch(err) {
      showToast('error', (isAr?'خطأ: ':'Error: ') + err.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="card" style={{padding:24, maxWidth:600, margin:'0 auto'}}>
      <h2 style={{fontSize:20,fontWeight:800,marginBottom:20}}><i className="bi bi-file-earmark-plus-fill text-brand"></i> {isAr?'رفع طلب مساعدة جديد':'Submit New Aid Request'}</h2>
      <form onSubmit={handleSubmit}>
        <div className="form-group">
          <label className="form-label">{isAr?'عنوان الطلب *':'Request Title *'}</label>
          <input className="form-input" required value={data.title} onChange={e=>setData({...data,title:e.target.value})} placeholder={isAr?'مثال: مساعدة في رسوم علاجية':'e.g. Help with medical fees'} />
        </div>
        
        <div style={{display:'flex',gap:16,marginBottom:16}}>
          <div className="form-group" style={{flex:1,marginBottom:0}}>
            <label className="form-label">{isAr?'تصنيف الحالة':'Case Category'}</label>
            <select className="form-input" value={data.category} onChange={e=>setData({...data,category:e.target.value})}>
              <option value="مالي">{isAr?'مالي':'Financial'}</option>
              <option value="طبي">{isAr?'طبي':'Medical'}</option>
              <option value="عيني">{isAr?'عيني':'In-Kind'}</option>
            </select>
          </div>
          <div className="form-group" style={{flex:1,marginBottom:0}}>
            <label className="form-label">{isAr?'مستوى الأهمية':'Priority Level'}</label>
            <select className="form-input" value={data.urgencyLevel} onChange={e=>setData({...data,urgencyLevel:e.target.value})}>
              <option value="عادي">{isAr?'عادي':'Normal'}</option>
              <option value="متوسط">{isAr?'متوسط':'Medium'}</option>
              <option value="عاجل">{isAr?'عاجل':'Urgent'}</option>
            </select>
          </div>
        </div>

        {data.category === 'مالي' && (
          <div className="form-group">
            <label className="form-label">{isAr?'المبلغ المطلوب (ج.س) *':'Required Amount (SDG) *'}</label>
            <input type="number" className="form-input" required value={data.targetAmount} onChange={e=>setData({...data,targetAmount:e.target.value})} placeholder={isAr?'مثال: 50000':'e.g. 50000'} />
          </div>
        )}

        <div className="form-group">
          <label className="form-label">{isAr?'الموقع / السكن *':'Location / Residence *'}</label>
          <input className="form-input" required value={data.location} onChange={e=>setData({...data,location:e.target.value})} placeholder={isAr?'مثال: الخرطوم، جبرة':'e.g. Khartoum, Jabra'} />
        </div>

        <div className="form-group">
          <label className="form-label">{isAr?'وصف الحالة (القصة) *':'Case Description (Story) *'}</label>
          <textarea className="form-input" required rows="4" value={data.description} onChange={e=>setData({...data,description:e.target.value})} placeholder={isAr?'اشرح حالة الاحتياج بالتفصيل...':'Describe the need in detail...'}></textarea>
        </div>

        <div className="form-group">
          <label className="form-label">{isAr?'مستند إثبات / صورة للحالة (اختياري)':'Proof Document / Photo (Optional)'}</label>
          <input type="file" className="form-input" accept="image/*" onChange={e=>setFile(e.target.files[0])} />
        </div>

        <button type="submit" className="btn btn-primary" style={{width:'100%'}} disabled={saving}>
          {saving ? <div className="spinner"></div> : (isAr?'إرسال الطلب للمراجعة':'Submit Request for Review')}
        </button>
      </form>
    </div>
  );
}

// ═══════════════════════════════════════
// PROFILE PAGE
// ═══════════════════════════════════════
function ProfilePage({profile, cases, dark, setDark, user, setProfile, isAr}) {
  const [editing, setEditing] = useState(false);
  const [name, setName] = useState(profile.name);
  const [phone, setPhone] = useState(profile.phone || '');
  const [photoFile, setPhotoFile] = useState(null);
  const [saving, setSaving] = useState(false);

  useEffect(()=>{ setName(profile.name); setPhone(profile.phone||''); setPhotoFile(null); },[profile, editing]);

  const saveProfile = async () => {
    setSaving(true);
    try {
      let photoURL = profile.photoURL || '';
      if (photoFile) {
        const urls = await uploadMultipleToSupabase([photoFile], 'profile_images');
        if (urls && urls.length > 0) {
          photoURL = urls[0];
        }
      }
      await updateDoc(doc(db,'users',user.uid),{ name: name.trim(), phone: phone.trim(), photoURL, updatedAt: serverTimestamp() });
      setProfile(p=>({...p, name: name.trim(), phone: phone.trim(), photoURL}));
      setEditing(false);
      showToast('success', isAr?'تم حفظ التعديلات بنجاح':'Profile saved successfully');
    } catch(e) { showToast('error', (isAr?'خطأ: ':'Error: ')+e.message); }
    finally { setSaving(false); setPhotoFile(null); }
  };

  const activeCases = cases ? cases.filter(c => c.status === 'active' || c.status === 'approved' || c.status === 'pending').length : 0;
  const completedCases = cases ? cases.filter(c => c.status === 'completed' || c.status === 'تم الاستلام' || c.status === 'تم التوزيع').length : 0;

  return (
    <div>
      {/* Header Card */}
      <div className="profile-header-card">
        <div style={{display:'flex',alignItems:'center',gap:16,position:'relative',zIndex:1}}>
          <div className="profile-avatar">
            {profile.photoURL ? <img src={profile.photoURL} alt="Profile" style={{width:'100%',height:'100%',borderRadius:'50%',objectFit:'cover'}} /> : ini(profile.name)}
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:20,fontWeight:900,color:'#fff'}}>{profile.name||(isAr?'مستفيد':'Beneficiary')}</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.7)',marginTop:2}}>{profile.email}</div>
            {profile.phone && <div style={{fontSize:13,color:'rgba(255,255,255,0.7)'}}>{profile.phone}</div>}
          </div>
          <button className="btn btn-icon" onClick={()=>setEditing(true)} style={{background:'rgba(255,255,255,0.15)',color:'#fff',borderRadius:'50%'}}>
            <i className="bi bi-pencil-fill"></i>
          </button>
        </div>
        <div className="profile-stats">
          <div className="profile-stat">
            <div className="profile-stat-label"><i className="bi bi-folder2-open"></i> {isAr?'طلبات قيد المراجعة أو نشطة':'Active or Under Review'}</div>
            <div className="profile-stat-value">{activeCases}</div>
          </div>
          <div className="profile-stat">
            <div className="profile-stat-label"><i className="bi bi-check-circle-fill"></i> {isAr?'طلبات مكتملة':'Completed Requests'}</div>
            <div className="profile-stat-value">{completedCases}</div>
          </div>
        </div>
      </div>

      {/* Settings */}
      <div style={{fontSize:18,fontWeight:800,marginBottom:12,paddingRight:4}}>{isAr?'الإعدادات العامة':'General Settings'}</div>
      <div className="settings-group">
        <div className="settings-item" onClick={()=>setDark(!dark)}>
          <div className="settings-icon"><i className={`bi ${dark?'bi-moon-fill':'bi-sun-fill'}`}></i></div>
          <span style={{flex:1,fontWeight:500}}>{isAr?'الوضع الليلي':'Dark Mode'}</span>
          <div className={`toggle ${dark?'active':''}`}></div>
        </div>
      </div>

      <div style={{fontSize:18,fontWeight:800,marginBottom:12,marginTop:24,paddingRight:4}}>{isAr?'خيارات أخرى':'Other Options'}</div>
      <div className="settings-group">
        <div className="settings-item" onClick={()=>setEditing(true)}>
          <div className="settings-icon"><i className="bi bi-pencil-fill"></i></div>
          <span style={{flex:1,fontWeight:500}}>{isAr?'تعديل الملف الشخصي':'Edit Profile'}</span>
          <i className={`bi ${isAr?'bi-chevron-left':'bi-chevron-right'}`} style={{color:'var(--text-muted)'}}></i>
        </div>
        <div className="settings-item" onClick={logoutDonor}>
          <div className="settings-icon" style={{background:'rgba(239,68,68,0.1)'}}><i className="bi bi-box-arrow-right" style={{color:'var(--red)'}}></i></div>
          <span style={{flex:1,fontWeight:500,color:'var(--red)'}}>{isAr?'تسجيل الخروج':'Sign Out'}</span>
        </div>
      </div>

      {/* Edit Modal */}
      {editing && (
        <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setEditing(false)}}>
          <div className="modal">
            <div className="modal-header">
              <div className="modal-title"><i className="bi bi-pencil-fill" style={{color:'var(--brand-500)'}}></i>{isAr?'تعديل الملف الشخصي':'Edit Profile'}</div>
              <button className="modal-close" onClick={()=>setEditing(false)}><i className="bi bi-x-lg"></i></button>
            </div>
            <div className="modal-body">
              <div className="form-group"><label className="form-label">{isAr?'تغيير الصورة الشخصية':'Change Profile Photo'}</label><input className="form-input" type="file" accept="image/*" onChange={e=>setPhotoFile(e.target.files[0])} style={{padding: '8px 12px'}} /></div>
              <div className="form-group"><label className="form-label">{isAr?'الاسم الكامل':'Full Name'}</label><input className="form-input" value={name} onChange={e=>setName(e.target.value)} /></div>
              <div className="form-group"><label className="form-label">{isAr?'رقم الهاتف':'Phone Number'}</label><input className="form-input" value={phone} onChange={e=>setPhone(e.target.value)} /></div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-outline" onClick={()=>setEditing(false)}>{isAr?'إلغاء':'Cancel'}</button>
              <button className="btn btn-primary" style={{width:'auto'}} onClick={saveProfile} disabled={saving}>
                {saving ? <><div className="spinner"></div>{isAr?'حفظ...':'Saving...'}</> : (isAr?'حفظ التعديلات':'Save Changes')}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
