<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="لوحة تحكم تكافل — بوابة المشرفين لإدارة الحالات الإنسانية والتبرعات">
  <title>تكافل — بوابة المشرفين</title>
  <link rel="icon" type="image/webp" href="app-icon.webp">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="login-page" style="min-height:100vh; background: var(--bg-dark);">

    <!-- Theme Toggle Button -->
    <button id="theme-toggle" aria-label="تبديل الوضع" style="display:flex;align-items:center;padding:5px 6px;border-radius:50px;background:rgba(255,200,50,0.15);border:1px solid rgba(249,168,37,0.35);cursor:pointer;transition:all 0.35s ease;gap:2;min-width:70px;position:absolute;top:20px;left:20px;z-index:10;backdrop-filter:blur(10px)">
      <span id="theme-icon-sun" style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F9A825;transition:all 0.35s ease;font-size:14px;box-shadow:0 2px 8px rgba(249,168,37,0.5)">☀️</span>
      <span id="theme-icon-moon" style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;transition:all 0.35s ease;font-size:14px;box-shadow:none">🌙</span>
    </button>

    <!-- Animated background circles -->
    <div class="login-bg-circles">
      <span></span><span></span><span></span>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      
      <!-- Right Panel (Form) -->
      <div class="login-right-panel" style="width: 100%;">
        <div class="login-logo" style="margin-bottom:24px;">
          <div class="login-logo-icon" style="background:#FFFFFF; padding:0; box-shadow:none; border:none;">
            <img src="app-icon.webp" alt="Takaful Logo" class="logo-image" style="filter: drop-shadow(0px 4px 12px rgba(232, 80, 10, 0.4));">
          </div>
          <h1 style="font-size: 24px;">تـكـافـل</h1>
          <p style="font-size: 13px;">نبض العطاء وإشراقة الأمل</p>
        </div>

        <!-- Error Message -->
        <div id="error-box" class="error-box hidden">
          <span>⚠️</span>
          <span id="error-text"></span>
        </div>

        <!-- Login Form -->
        <form id="login-form" novalidate>

          <div class="form-group">
            <label class="form-label" for="email-input">البريد الإلكتروني</label>
            <div class="input-group">
              <span class="input-icon"><i class="bi bi-envelope-fill"></i></span>
              <input
                id="email-input"
                type="email"
                class="form-input"
                placeholder="examble@takaful.org"
                autocomplete="email"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password-input">كلمة المرور</label>
            <div class="input-group">
              <span class="input-icon" style="right: 14px;"><i class="bi bi-lock-fill"></i></span>
              <input
                id="password-input"
                type="password"
                class="form-input"
                placeholder="••••••••"
                autocomplete="current-password"
                style="padding-left: 40px;"
                required
              >
              <span class="password-toggle" onclick="togglePassword('password-input', this)" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; z-index: 10;"><i class="bi bi-eye"></i></span>
            </div>
          </div>
          
          <div class="form-group" style="display:flex; justify-content:center; align-items:center; margin-top:-10px; margin-bottom:20px;">
            <div style="display:flex; align-items:center; gap:8px; background:rgba(232,80,10,0.08); border:1px solid rgba(232,80,10,0.2); padding:10px 16px; border-radius:12px; width:100%; justify-content:center; box-shadow:0 4px 12px rgba(232,80,10,0.05);">
              <i class="bi bi-shield-lock-fill" style="color:var(--primary); font-size:16px;"></i>
              <span style="font-size:13px; font-weight:700; color:var(--text-primary);">دخول آمن — لوحة التحكم الإدارية</span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="login-btn" style="border-radius:50px;">
            <span id="login-btn-text">تسجيل الدخول</span>
          </button>


        </form>

        <!-- Footer Note -->
        <div style="margin-top:24px;text-align:center">
          <p class="text-sm text-muted" style="font-weight: 700; letter-spacing: 1px;">
            NRC Admin
          </p>
        </div>
      </div> <!-- End Right Panel -->
    </div> <!-- End Login Card -->
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    // ── Day/Night: Auto + Manual (both) ──

    (function () {
      const hour = new Date().getHours();
      // 06:00 - 18:00 => light, otherwise dark
      const autoIsDay = hour >= 6 && hour < 18;

      // Manual preference: 'light' | 'dark' | 'auto'
      const saved = localStorage.getItem('takaful-theme-mode');
      const mode = saved || 'auto';

      const isDay = (mode === 'auto') ? autoIsDay : (mode === 'light');

      // style.css uses :root[data-bs-theme]
      document.documentElement.setAttribute('data-bs-theme', isDay ? 'light' : 'dark');
    })();

    // ── Theme Toggle Logic ──
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIconSun = document.getElementById('theme-icon-sun');
    const themeIconMoon = document.getElementById('theme-icon-moon');

    function updateThemeIcon() {
      const isLight = document.documentElement.getAttribute('data-bs-theme') === 'light';
      
      themeToggleBtn.style.background = isLight ? 'rgba(255,200,50,0.15)' : 'rgba(30,30,60,0.9)';
      themeToggleBtn.style.borderColor = isLight ? 'rgba(249,168,37,0.35)' : 'rgba(100,100,255,0.2)';
      
      themeIconSun.style.background = isLight ? '#F9A825' : 'transparent';
      themeIconSun.style.boxShadow = isLight ? '0 2px 8px rgba(249,168,37,0.5)' : 'none';
      themeIconSun.style.color = isLight ? '#fff' : 'rgba(255,200,50,0.4)';
      
      themeIconMoon.style.background = isLight ? 'transparent' : 'rgba(99,102,241,0.8)';
      themeIconMoon.style.boxShadow = isLight ? 'none' : '0 2px 8px rgba(99,102,241,0.5)';
      themeIconMoon.style.color = isLight ? 'rgba(99,102,241,0.3)' : '#fff';
    }
    updateThemeIcon();

    themeToggleBtn.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-bs-theme') === 'light';
      const newTheme = isLight ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', newTheme);
      localStorage.setItem('takaful-theme-mode', newTheme);
      updateThemeIcon();
    });    // ── Password Toggle ──
    window.togglePassword = function(inputId, iconSpan) {
      const input = document.getElementById(inputId);
      const icon = iconSpan.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
        icon.style.color = 'var(--primary)';
      } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
        icon.style.color = 'var(--text-muted)';
      }
    };


import { loginWithEmail } from './auth.js';
    import { showToast } from './utils.js';
    import { auth } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';

    // If already logged in, redirect
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Verify supervisor role before redirect
        try {
          const { checkAdminRole } = await import('./auth.js');
          const isSup = await checkAdminRole(user.uid);
          if (isSup) window.location.href = 'dashboard.html';
        } catch (e) {}
      }
    });

    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-btn');
    const btnText = document.getElementById('login-btn-text');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.classList.remove('hidden');
    }
    function hideError() {
      errorBox.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;

      if (!email || !password) {
        showError('يرجى إدخال البريد الإلكتروني وكلمة المرور');
        return;
      }

      // Loading state
      btn.classList.add('loading');
      btn.disabled = true;
      btnText.textContent = 'جارٍ التحقق...';

      try {
        await loginWithEmail(email, password);
        showToast('success', 'مرحباً بك!', 'سيتم تحويلك للوحة التحكم...');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      } catch (err) {
        let msg = 'حدث خطأ أثناء تسجيل الدخول';
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
          msg = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
        } else if (err.code === 'auth/user-not-found') {
          msg = 'لا يوجد حساب بهذا البريد الإلكتروني';
        } else if (err.code === 'auth/too-many-requests') {
          msg = 'تم تجاوز عدد المحاولات. حاول لاحقاً';
        } else if (err.code === 'auth/network-request-failed' || (err.message && err.message.includes('network-request-failed'))) {
          msg = 'فشل الاتصال بالشبكة. إذا كنت في السودان، يرجى تشغيل VPN وإعادة المحاولة.';
        } else if (err.message) {
          msg = err.message;
        }
        showError(msg);
        btn.classList.remove('loading');
        btn.disabled = false;
        btnText.textContent = 'تسجيل الدخول';
      }
    });

    // Enter key support
    document.getElementById('password-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
    });


  </script>
</body>
</html>
