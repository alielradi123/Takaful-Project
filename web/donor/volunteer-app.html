<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="تكافل — بوابة المتطوعين | المهام الميدانية والمساعدة">
  <title>تكافل — بوابة المتطوعين</title>
  <link rel="icon" type="image/webp" href="../app-icon.webp">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="donor-style.css">
  <style>
    .volunteer-notification-menu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;width:min(360px,calc(100vw - 24px));max-height:420px;overflow:auto;z-index:120;background:var(--bg-sidebar);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:10px}
    .volunteer-notification-row{padding:12px;border-radius:var(--radius-sm);border-bottom:1px solid var(--border);cursor:pointer}
    .volunteer-notification-row:last-child{border-bottom:0}
    .volunteer-notification-row.unread{background:rgba(232,80,10,.08)}
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script type="importmap">
  {
    "imports": {
      "firebase-config": "../firebase-config.js",
      "donor-auth": "./donor-auth.js",
      "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18/jsx-dev-runtime"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07090f">
    <div style="text-align:center">
      <div class="spinner" style="width:2.5rem;height:2.5rem;margin:0 auto"></div>
      <p style="margin-top:16px;color:rgba(255,255,255,0.5);font-family:Tajawal,sans-serif">تحميل بوابة المتطوعين...</p>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script type="text/babel" data-type="module">
import { auth, db } from 'firebase-config';
import { uploadMultipleToSupabase } from '../supabase-config.js';
import {
  collection, query, where, orderBy, onSnapshot,
  doc, updateDoc, addDoc, serverTimestamp, getDocs, deleteDoc
  , setDoc
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';
import { requireDonorAuth, getDonorProfile, logoutDonor } from 'donor-auth';

const { useState, useEffect, useRef } = React;

// ─── HELPERS ───
const ini = (n='') => (n||'م').trim().split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'م';
const timeAgo = ts => {
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(typeof ts === 'number' ? (ts > 1e12 ? ts : ts*1000) : ts);
  const s = Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return 'الآن';
  if(s<3600) return `منذ ${Math.floor(s/60)} دقيقة`;
  if(s<86400) return `منذ ${Math.floor(s/3600)} ساعة`;
  return `منذ ${Math.floor(s/86400)} يوم`;
};
const fmtDate = ts => {
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(typeof ts === 'number' ? (ts > 1e12 ? ts : ts*1000) : ts);
  return new Intl.DateTimeFormat('ar',{year:'numeric',month:'short',day:'numeric'}).format(d);
};
const formatNotificationTime = (ts, isAr) => {
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(typeof ts === 'number' ? (ts > 1e12 ? ts : ts*1000) : ts);
  return new Intl.DateTimeFormat(isAr ? 'ar' : 'en',{dateStyle:'medium',timeStyle:'short'}).format(d);
};
const notificationTimestamp = ts => ts?.toMillis ? ts.toMillis() : ts?.toDate ? ts.toDate().getTime() : typeof ts === 'number' ? (ts > 1e12 ? ts : ts*1000) : new Date(ts||0).getTime();

function showToast(type, msg) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.innerHTML = `<i class="bi ${type==='success'?'bi-check-circle-fill':'bi-exclamation-circle-fill'}"></i><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},3000);
}

// ═══════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════
function App() {
  const [page, setPage] = useState('tasks');
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState({name:'...',email:''});
  const [systemSettings, setSystemSettings] = useState({});
  const [myTasks, setMyTasks] = useState([]);
  const [notifications, setNotifications] = useState([]);
  const [showNotifications, setShowNotifications] = useState(false);
  const [loading, setLoading] = useState(true);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  
  const [chats, setChats] = useState([]);
  const [activeChatId, setActiveChatId] = useState(null);
  const [msgs, setMsgs] = useState([]);
  const [msgIn, setMsgIn] = useState('');
  
  const [lang, setLang] = useState(() => localStorage.getItem('takaful-lang') || 'ar');
  const isAr = lang === 'ar';
  const toggleLang = () => {
    const nl = isAr ? 'en' : 'ar';
    setLang(nl);
    requestAnimationFrame(() => { const button = document.querySelector('.language-toggle'); if (button) { button.classList.remove('is-changing'); void button.offsetWidth; button.classList.add('is-changing'); } });
  };

  useEffect(() => {
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    localStorage.setItem('takaful-lang', lang);
  }, [lang]);

  const [dark, setDark] = useState(() => {
    const mode = localStorage.getItem('takaful-theme-mode');
    return mode === 'light' ? false : true;
  });

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    localStorage.setItem('takaful-theme-mode',dark?'dark':'light');
  },[dark]);

  useEffect(()=>{
    const unsub = requireDonorAuth(async (u, role) => {
      setUser(u);
      const p = await getDonorProfile(u.uid);
      setProfile(p);
      setLoading(false);
    });
    return ()=>unsub&&unsub();
  },[]);

  // Load only tasks assigned to the signed-in volunteer.
  useEffect(()=>{
    if(loading||!user) return;
    const settingsUnsub = onSnapshot(doc(db,'settings','general'), s => setSystemSettings(s.exists() ? s.data() : {}));
    const assignedTasksByField = new Map();
    const publishAssignedTasks = () => {
      const tasksById = new Map();
      assignedTasksByField.forEach(tasks => tasks.forEach(task => tasksById.set(task.id, task)));
      setMyTasks([...tasksById.values()]);
    };
    const myTasksUnsubs = ['volunteerId','assignedVolunteerId'].map(field =>
      onSnapshot(
        query(collection(db,'cases'), where(field,'==',user.uid)),
        s=>{
          assignedTasksByField.set(field, s.docs.map(d=>({id:d.id,...d.data()})));
          publishAssignedTasks();
        },
        err=>{
          console.error(`Assigned volunteer tasks listener error (${field}):`, err);
          assignedTasksByField.delete(field);
          publishAssignedTasks();
          showToast('error', isAr ? 'تعذر تحميل مهامك المسندة' : 'Unable to load your assigned tasks');
        }
      )
    );

    const notificationsUnsub = onSnapshot(
      query(collection(db,'notifications'),where('userId','==',user.uid)),
      s=>setNotifications(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>notificationTimestamp(b.timestamp)-notificationTimestamp(a.timestamp))),
      err=>{
        console.error('Volunteer notifications listener error:', err);
        setNotifications([]);
        showToast('error', isAr ? 'تعذر تحميل الإشعارات' : 'Unable to load notifications');
      }
    );

    const unsubChats = onSnapshot(query(collection(db,'chats'), where('userId','==',user.uid)), async s => {
      if(s.empty) {
        // Auto-create a support chat (matching Android behavior)
        try {
          const chatDoc = await addDoc(collection(db,'chats'),{
            userId: user.uid,
            userName: profile.name || 'مستخدم',
            lastMessage: 'مرحباً بك في تكافل! كيف يمكننا مساعدتك؟',
            lastMessageTime: serverTimestamp(),
            createdAt: serverTimestamp()
          });
          await addDoc(collection(db,'chats',chatDoc.id,'messages'),{
            sender: 'admin',
            senderId: 'support',
            senderName: 'الدعم والمحادثات',
            text: 'مرحباً بك في تكافل! كيف يمكننا مساعدتك؟',
            createdAt: serverTimestamp(),
            isRead: false
          });
        } catch(e) { console.error('Error creating support chat:', e); }
        return;
      }
      const docs = s.docs.map(d=>({id:d.id,...d.data()}));
      docs.sort((a,b)=>{
        const tA = a.lastMessageTime?.toMillis ? a.lastMessageTime.toMillis() : 0;
        const tB = b.lastMessageTime?.toMillis ? b.lastMessageTime.toMillis() : 0;
        return tB - tA;
      });
      setChats(docs);
      // Auto-select the first (latest) chat if none selected
      setActiveChatId(prev => prev || docs[0]?.id || null);
    }, err => {
      console.error('Support chat listener error:', err);
      showToast('error', 'تعذر تحميل محادثة الدعم: ' + err.message);
    });

    return () => { settingsUnsub(); myTasksUnsubs.forEach(unsubTask=>unsubTask()); notificationsUnsub(); unsubChats(); };
  },[loading, user]);

  const markNotificationRead = async notification => {
    if(!notification || notification.isRead) return;
    try {
      await updateDoc(doc(db,'notifications',notification.id),{isRead:true});
    } catch(err) {
      showToast('error', (isAr ? 'تعذر تحديث الإشعار: ' : 'Unable to update notification: ') + err.message);
    }
  };
  const markAllNotificationsRead = async () => {
    try {
      await Promise.all(notifications.filter(n=>!n.isRead).map(n=>updateDoc(doc(db,'notifications',n.id),{isRead:true})));
    } catch(err) {
      showToast('error', (isAr ? 'تعذر تحديث الإشعارات: ' : 'Unable to update notifications: ') + err.message);
    }
  };

  // Share browser location while the volunteer has active field tasks.
  useEffect(()=>{
    if(loading || !user || !navigator.geolocation) return;
    const activeTaskIds = myTasks.filter(t=>t.status!=='completed').map(t=>t.id);
    if(!activeTaskIds.length) return;

    const writeLocation = position => setDoc(doc(db,'volunteerLocations',user.uid), {
      latitude: position.coords.latitude,
      longitude: position.coords.longitude,
      accuracy: position.coords.accuracy || 0,
      speed: position.coords.speed || 0,
      activeTaskIds,
      isOnline: true,
      timestamp: Date.now(),
      updatedAt: serverTimestamp()
    }, {merge:true}).catch(err=>console.warn('Location update failed:', err));
    const watchId = navigator.geolocation.watchPosition(writeLocation, err=>console.warn('Location permission:', err.message), {
      enableHighAccuracy: true,
      maximumAge: 10000,
      timeout: 15000
    });
    return ()=>{
      navigator.geolocation.clearWatch(watchId);
      setDoc(doc(db,'volunteerLocations',user.uid), {isOnline:false, offlineAt:serverTimestamp()}, {merge:true}).catch(()=>{});
    };
  },[loading, user, myTasks]);



  useEffect(()=>{
    if(!activeChatId) return;
    const u = onSnapshot(
      query(collection(db,'chats',activeChatId,'messages'),orderBy('createdAt','asc')),
      s=>setMsgs(s.docs.map(d=>({id:d.id,...d.data()}))),
      err => {
        console.error('Messages listener error:', err);
        setMsgs([]);
        showToast('error', 'تعذر تحميل رسائل الدعم: ' + err.message);
      }
    );
    return ()=>u();
  },[activeChatId]);

  const sendMsg = async (e) => {
    e.preventDefault();
    if(!msgIn.trim()) return;
    const text = msgIn.trim();
    setMsgIn('');
    try {
      const messageData = {
        text,
        sender: 'user',
        senderId: user.uid,
        senderName: profile.name || 'مستخدم',
        senderPhotoUrl: profile.photoURL || '',
        createdAt: serverTimestamp(),
        timestamp: Date.now(),
        isRead: false
      };

      let chatId = activeChatId;
      if(!chatId) {
        const chatDoc = await addDoc(collection(db,'chats'),{
          userId: user.uid,
          userName: profile.name || 'مستخدم',
          lastMessage: text,
          lastMessageTime: serverTimestamp(),
          createdAt: serverTimestamp()
        });
        chatId = chatDoc.id;
        await addDoc(collection(db,'chats',chatId,'messages'), messageData);
        setActiveChatId(chatId);
      } else {
        await addDoc(collection(db,'chats',chatId,'messages'), messageData);
        await updateDoc(doc(db,'chats',chatId),{ lastMessage: text, lastMessageTime: serverTimestamp() });
      }
    } catch(err) { showToast('error', err.message); }
  };

  const doDelMsg = async (chatIdArg, msgId) => {
    const cid = chatIdArg || activeChatId;
    if(!cid || !msgId) return;
    if(!confirm(isAr ? 'حذف هذه الرسالة نهائياً؟' : 'Delete message permanently?'))return;
    try {
      await deleteDoc(doc(db,'chats',cid,'messages',msgId));
      showToast('success', isAr ? 'تم حذف الرسالة بنجاح' : 'Message deleted');
    } catch(e) { showToast('error', e.message); }
  };
  const doEditMsg = async (chatIdArg, msgId, newText) => {
    const cid = chatIdArg || activeChatId;
    if(!cid || !msgId || !newText || !newText.trim()) return;
    try {
      await updateDoc(doc(db,'chats',cid,'messages',msgId),{text:newText.trim(), updatedAt:serverTimestamp()});
      showToast('success', isAr ? 'تم تعديل الرسالة بنجاح' : 'Message edited');
    } catch(e) { showToast('error', e.message); }
  };

  if(loading) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div className="spinner"></div>
    </div>
  );

  const NAV = isAr ? [
    {id:'tasks',l:'المهام الميدانية',icon:'bi-list-task'},
    {id:'chat',l:'الدعم والمحادثات',icon:'bi-chat-dots-fill'},
    {id:'profile',l:'حسابي',icon:'bi-person-fill'},
  ] : [
    {id:'tasks',l:'Field Tasks',icon:'bi-list-task'},
    {id:'chat',l:'Support & Chat',icon:'bi-chat-dots-fill'},
    {id:'profile',l:'My Profile',icon:'bi-person-fill'},
  ];

  return (
    <div className="app-layout">
      {sidebarOpen && <div className="sidebar-backdrop" onClick={()=>setSidebarOpen(false)}></div>}
      <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
        <div className="sidebar-header">
          <div className="sidebar-logo">
            <img src="../app-icon.webp" alt="تكافل" />
          </div>
          <div className="sidebar-brand">
            <h2>{isAr ? 'تـكـافـل' : 'Takaful'}</h2>
            <p style={{color:'var(--brand-500)'}}>{isAr ? 'بوابة المتطوعين' : 'Volunteer Portal'}</p>
            {systemSettings.apk_url || systemSettings.play_store_link ? <a href={systemSettings.apk_url || systemSettings.play_store_link} target="_blank" rel="noreferrer" className="btn btn-primary btn-sm" style={{marginTop:8,width:'100%'}}><i className="bi bi-phone me-1"></i>{isAr ? 'تحميل تطبيق Android' : 'Download Android App'}</a> : null}
          </div>
        </div>
        <nav className="sidebar-nav">
          {NAV.map(n=>(
            <div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)} role="button">
              <i className={`bi ${n.icon} nav-icon`}></i>
              <span style={{flex:1}}>{n.l}</span>
              {n.id==='tasks' && myTasks.filter(t=>t.status!=='completed').length>0 && <span className="nav-badge" style={{background:'var(--brand-500)'}}>{myTasks.filter(t=>t.status!=='completed').length}</span>}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="user-card" style={{flexDirection:'column',gap:10,padding:'14px 16px',alignItems:'flex-start'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,width:'100%'}}>
              {profile.photoURL
                ? <img src={profile.photoURL} alt={profile.name} style={{width:40,height:40,borderRadius:'50%',objectFit:'cover',border:'none',flexShrink:0, background:'#FFFFFF'}} />
                : <div className="avatar" style={{width:40,height:40,fontSize:'15px'}}>{ini(profile.name)}</div>
              }
              <div style={{flex:1,minWidth:0}}>
                <div className="user-name truncate" style={{fontSize:13}}>{profile.name}</div>
                <div className="user-role truncate" style={{fontSize:11,color:'var(--brand-500)'}}>{isAr ? 'متطوع ميداني' : 'Field Volunteer'}</div>
              </div>
            </div>
            <button onClick={logoutDonor} className="btn btn-outline" style={{width:'100%',padding:'9px 14px',borderRadius:'var(--radius-sm)',fontSize:13,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <i className="bi bi-box-arrow-right"></i> {isAr ? 'تسجيل الخروج' : 'Sign Out'}
            </button>
            <SocialLinks settings={systemSettings} isAr={isAr} />
          </div>
        </div>
      </aside>

      <div className="main-content">
        <header className="topbar">
          <button className="mobile-menu-toggle" type="button" aria-label="Open menu" onClick={()=>setSidebarOpen(true)}><i className="bi bi-list"></i></button>
          <div className="topbar-heading" style={{flex:1}}>
            <div className="topbar-title">{NAV.find(n=>n.id===page)?.l || (isAr ? 'تكافل' : 'Takaful')}</div>
          </div>
          <div className="topbar-actions" style={{display:'flex',alignItems:'center',gap:10}}>
            <div className="notification-control" style={{position:'relative'}}>
              <button type="button" className="btn btn-icon" aria-label={isAr?'الإشعارات':'Notifications'} aria-expanded={showNotifications} onClick={()=>setShowNotifications(v=>!v)} style={{position:'relative'}}>
                <i className="bi bi-bell-fill"></i>
                {notifications.filter(n=>!n.isRead).length>0&&<span style={{position:'absolute',top:-4,insetInlineEnd:-4,minWidth:17,height:17,borderRadius:20,background:'var(--red)',color:'#fff',fontSize:10,fontWeight:800,display:'grid',placeItems:'center',padding:'0 3px'}}>{notifications.filter(n=>!n.isRead).length>9?'9+':notifications.filter(n=>!n.isRead).length}</span>}
              </button>
              {showNotifications&&<div className="volunteer-notification-menu">
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,padding:'6px 8px 10px'}}>
                  <strong>{isAr?'الإشعارات':'Notifications'}</strong>
                  {notifications.some(n=>!n.isRead)&&<button type="button" className="btn btn-outline btn-sm" onClick={markAllNotificationsRead}>{isAr?'تحديد الكل كمقروء':'Mark all read'}</button>}
                </div>
                {notifications.length===0
                  ? <div style={{padding:14,textAlign:'center',color:'var(--text-muted)'}}>{isAr?'لا توجد إشعارات حتى الآن':'No notifications yet'}</div>
                  : notifications.slice(0,8).map(n=><div key={n.id} className={`volunteer-notification-row ${n.isRead?'':'unread'}`} onClick={()=>markNotificationRead(n)} role="button" tabIndex={0} onKeyDown={e=>{if(e.key==='Enter'||e.key===' ')markNotificationRead(n);}}>
                      <div style={{fontWeight:800,fontSize:13}}>{n.title||(isAr?'تحديث جديد':'New update')}</div>
                      <div style={{fontSize:12,color:'var(--text-secondary)',marginTop:4}}>{n.message||''}</div>
                      <div style={{fontSize:11,color:'var(--text-muted)',marginTop:6}}>{formatNotificationTime(n.timestamp,isAr)}</div>
                    </div>)}
              </div>}
            </div>
            {/* Language Toggle */}
            <button onClick={toggleLang} className={`language-toggle ${isAr ? 'is-ar' : 'is-en'}`} title={isAr ? 'Switch to English' : 'التبديل للعربية'}>
              <span className={`language-toggle-icon ${isAr ? 'flag-uk' : 'flag-sudan'}`} aria-hidden="true">{isAr ? '🇬🇧' : '🇸🇩'}</span>
              <span className="language-toggle-label">{isAr ? 'EN' : 'Ar'}</span>
            </button>

            <button
              onClick={()=>{setDark(d=>!d); requestAnimationFrame(()=>{const b=document.querySelector('.theme-toggle'); if(b){b.classList.remove('is-changing'); void b.offsetWidth; b.classList.add('is-changing');}})}}
              className="theme-toggle"
              title={dark?(isAr?'تفعيل الوضع النهاري':'Switch to Light Mode'):(isAr?'تفعيل الوضع الليلي':'Switch to Dark Mode')}
              style={{display:'flex',alignItems:'center',padding:'5px 6px',borderRadius:'50px',background:dark?'rgba(30,30,60,0.9)':'rgba(255,200,50,0.15)',border:'1px solid',borderColor:dark?'rgba(100,100,255,0.2)':'rgba(249,168,37,0.35)',cursor:'pointer',transition:'all 0.35s ease',gap:2,minWidth:70}}
            >
              <span className={`theme-toggle-icon ${!dark ? 'is-active' : ''}`} aria-hidden="true"><i className="bi bi-sun-fill" /></span>
              <span className={`theme-toggle-icon moon ${dark ? 'is-active' : ''}`} aria-hidden="true"><i className="bi bi-moon-stars-fill" /></span>
            </button>
          </div>
        </header>
        <main className="page-content">
          {profile.status === 'pending_verification' ? (
            <div className="card" style={{textAlign:'center', padding:'40px 20px', marginTop:'20px'}}>
              <i className="bi bi-shield-lock-fill" style={{fontSize:48, color:'var(--brand-500)', marginBottom:16, display:'block'}}></i>
              <h3>{isAr ? 'حسابك قيد المراجعة' : 'Account Under Review'}</h3>
              <p style={{color:'var(--text-secondary)', marginTop:8}}>
                {isAr ? (
                  <>لقد استلمنا طلب تسجيلك والمرفقات الخاصة بإثبات الهوية.<br/>سيقوم مدير النظام بمراجعة الطلب والموافقة عليه قريباً. يرجى التحلي بالصبر.</>
                ) : (
                  <>We received your registration request and identity proof.<br/>System admin will review and approve your account soon. Please be patient.</>
                )}
              </p>
            </div>
          ) : (
            <>
              {page==='tasks' && <TasksPage myTasks={myTasks} notifications={notifications} onReadNotification={markNotificationRead} isAr={isAr} />}
              {page==='chat' && <ChatPage chats={chats} msgs={msgs} activeChatId={activeChatId} setActiveChatId={setActiveChatId} msgIn={msgIn} setMsgIn={setMsgIn} sendMsg={sendMsg} profile={profile} doDelMsg={doDelMsg} doEditMsg={doEditMsg} user={user} isAr={isAr} />}
              {page==='profile' && <ProfilePage profile={profile} dark={dark} setDark={setDark} user={user} setProfile={setProfile} isAr={isAr} />}
            </>
          )}
        </main>
      </div>
    </div>
  );
}

function SocialLinks({settings, isAr}) {
  const links = [['facebook_url','bi-facebook',isAr?'فيسبوك':'Facebook'],['twitter_url','bi-twitter-x',isAr?'إكس':'X'],['instagram_url','bi-instagram',isAr?'إنستغرام':'Instagram'],['contact_phone','bi-whatsapp',isAr?'واتساب':'WhatsApp']].filter(([key])=>settings[key]);
  if (!links.length) return null;
  return <div style={{display:'flex',gap:10,flexWrap:'wrap',paddingTop:8,borderTop:'1px solid var(--border)',width:'100%'}}>{links.map(([key,icon,label])=>{const href=key==='contact_phone'?`https://wa.me/${String(settings[key]).replace(/[^0-9]/g,'')}`:settings[key];return <a key={key} href={href} target="_blank" rel="noreferrer" title={label} style={{color:'var(--text-secondary)',fontSize:18}}><i className={`bi ${icon}`}></i></a>})}</div>;
}

function TasksPage({myTasks, notifications, onReadNotification, isAr}) {

  const tabs = isAr
    ? [{label:'الحالية',icon:'bi-person-workspace',count:activeTasks.length},{label:'المنجزة',icon:'bi-check-circle-fill',count:completedTasks.length}]
    : [{label:'Current',icon:'bi-person-workspace',count:activeTasks.length},{label:'Completed',icon:'bi-check-circle-fill',count:completedTasks.length}];

  return (
    <div>
      {completingTask && <CompleteTaskModal task={completingTask} onClose={()=>setCompletingTask(null)} isAr={isAr} />}

        <span>
          <strong style={{display:'block',marginBottom:4}}>{latestAssignedNotification.title}</strong>
          <span style={{fontSize:13,color:'var(--text-secondary)'}}>{latestAssignedNotification.message}</span>
        </span>
      </button>}
      <div className="profile-stats task-stats" style={{marginBottom:20}}>
        {tabs.map((tab,index)=>(
          <div className="profile-stat" key={tab.label}>
            <div className="profile-stat-label"><i className={`bi ${tab.icon}`}></i> {isAr ? `المهام ${tab.label}` : `${tab.label} Tasks`}</div>
            <div className="profile-stat-value">{tab.count}</div>

      </div>
      <div role="tablist" aria-label={isAr ? 'تصنيف المهام' : 'Task categories'} style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(0,1fr))',gap:8,marginBottom:20,padding:5,borderRadius:14,background:'var(--bg-sidebar)',border:'1px solid var(--border)'}}>
        {tabs.map((tab,index)=>(
          <button

      </div>
      <div className="section-header" style={{marginBottom:20}}>
        <div className="section-title"><div className="section-bar"></div>{isAr ? `المهام ${tabs[selectedTab].label}` : `${tabs[selectedTab].label} Tasks`}</div>
      </div>
      {visibleTasks.length === 0 ? (
        <div className="card"><div className="empty-state">
          <i className={`bi ${selectedTab===1?'bi-check-all':'bi-inbox'} text-brand`}></i>
          <h3>{selectedTab===0
            ? (isAr ? 'لا توجد مهام مسندة إليك حالياً' : 'No tasks are currently assigned to you')

        </div></div>
      ) : selectedTab===1 ? (
        <div className="cases-grid">
          {completedTasks.map(t=>(
            <div key={t.id} className="case-card" style={{opacity:0.85}}>
              <div className="case-card-body">

                <div className="case-card-title">{t.title}</div>

                  <div><i className="bi bi-geo-alt-fill text-brand"></i> {isAr ? 'الموقع:' : 'Location:'} {t.location}</div>
                  <div><i className="bi bi-calendar-check text-brand"></i> {isAr ? 'أُنجزت في:' : 'Completed:'} {fmtDate(t.completedAt)}</div>

      )}
    </div>
  );
}

// ═══════════════════════════════════════
// COMPLETE TASK MODAL
// ═══════════════════════════════════════
function CompleteTaskModal({task, onClose, isAr}) {
  const [file, setFile] = useState(null);
  const [notes, setNotes] = useState('');
  const [saving, setSaving] = useState(false);

  const handleComplete = async (e) => {
    e.preventDefault();
    if(!file) {
      showToast('error', isAr ? 'يرجى إرفاق صورة كإثبات لإنجاز المهمة (مثل صورة التسليم).' : 'Please attach a proof photo (e.g. delivery photo).');
      return;
    }
    setSaving(true);
    try {
      const urls = await uploadMultipleToSupabase([file], 'task_proofs');
      const proofUrl = (urls && urls.length > 0) ? urls[0] : '';
      
      await updateDoc(doc(db,'cases',task.id), {
        status: 'completed',
        completedAt: serverTimestamp(),
        proofUrl: proofUrl,
        volunteerReportImage: proofUrl,
        volunteerReport: notes,
        volunteerNotes: notes,
        updatedAt: serverTimestamp()
      });
      showToast('success', isAr ? 'شكراً لجهودك! تم إكمال المهمة بنجاح.' : 'Thank you! Task completed successfully.');
      onClose();
    } catch(err) {
      showToast('error', (isAr ? 'خطأ: ' : 'Error: ') + err.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}} style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.5)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16,backdropFilter:'blur(4px)'}}>
      <div className="card" style={{width:'100%',maxWidth:450,padding:24,position:'relative'}}>
        <button onClick={onClose} style={{position:'absolute',top:16,left:16,background:'transparent',border:'none',color:'var(--text-muted)',fontSize:20,cursor:'pointer'}}><i className="bi bi-x-lg"></i></button>
        <h3 style={{fontSize:18,fontWeight:800,marginBottom:20}}><i className="bi bi-check-circle-fill text-brand me-2"></i> {isAr ? 'إكمال المهمة' : 'Complete Task'}</h3>
        
        <div style={{marginBottom:16,padding:12,background:'var(--bg-glass)',borderRadius:8,border:'1px solid var(--border)'}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{task.title}</div>
          <div style={{fontSize:12,color:'var(--text-secondary)'}}><i className="bi bi-geo-alt-fill text-brand"></i> {task.location}</div>
        </div>

        <form onSubmit={handleComplete}>
          <div className="form-group">
            <label className="form-label">{isAr ? 'صورة إثبات الإنجاز (التسليم) *' : 'Proof Photo (Delivery) *'}</label>
            <input type="file" className="form-input" required accept="image/*" onChange={e=>setFile(e.target.files[0])} />
          </div>
          <div className="form-group">
            <label className="form-label">{isAr ? 'ملاحظات (اختياري)' : 'Notes (Optional)'}</label>
            <textarea className="form-input" rows="3" value={notes} onChange={e=>setNotes(e.target.value)} placeholder={isAr ? 'أي ملاحظات حول تنفيذ المهمة...' : 'Any notes about the task execution...'}></textarea>
          </div>
          <button type="submit" className="btn btn-primary" style={{width:'100%',borderRadius:'50px'}} disabled={saving}>
            {saving ? <div className="spinner" style={{width:20,height:20,margin:'0 auto'}}></div> : (isAr ? 'تأكيد الإنجاز' : 'Confirm Completion')}
          </button>
        </form>
      </div>
    </div>
  );
}

function ChatPage({chats, msgs, activeChatId, setActiveChatId, msgIn, setMsgIn, sendMsg, profile, doDelMsg, doEditMsg, user, isAr}) {
  const msgsEnd = useRef(null);
  const [editingMsg, setEditingMsg] = useState(null);
  useEffect(()=>{ msgsEnd.current?.scrollIntoView({behavior:'smooth'}); },[msgs]);

  const currentUid = user?.uid || '';

  return (
    <div>
      <div className="section-header" style={{marginBottom:20}}>
        <div className="section-title"><div className="section-bar"></div>{isAr ? 'الدعم والمحادثات' : 'Support & Chat'}</div>
      </div>
      <div className="chat-container">
        <div className="chat-messages">
          <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',fontWeight:700,display:'flex',alignItems:'center',gap:10}}>
            <i className="bi bi-headset" style={{color:'var(--brand-500)'}}></i>
            {isAr ? 'محادثة الدعم والإدارة' : 'Support & Admin Chat'}
            {activeChatId && <span className="text-xs text-muted" style={{marginRight:'auto',fontWeight:400}}>{isAr ? 'متصل' : 'Connected'}</span>}
          </div>
          <div className="chat-messages-body">
            {!activeChatId && msgs.length === 0 && (
              <div className="empty-state" style={{padding:40}}>
                <i className="bi bi-chat-heart" style={{fontSize:48}}></i>
                <h3>{isAr ? 'جارٍ تحميل المحادثة...' : 'Loading chat...'}</h3>
                <p>{isAr ? 'يتم إنشاء محادثة الدعم الخاصة بك' : 'Setting up your support chat'}</p>
                <div className="spinner" style={{width:'2rem',height:'2rem',margin:'16px auto'}}></div>
              </div>
            )}
            {activeChatId && msgs.length === 0 && (
              <div className="empty-state" style={{padding:40}}>
                <i className="bi bi-chat-heart" style={{fontSize:48}}></i>
                <h3>{isAr ? 'ابدأ محادثة جديدة' : 'Start a Conversation'}</h3>
                <p>{isAr ? 'الإدارة جاهزة للرد على استفساراتك' : 'Admin is ready to answer your questions'}</p>
              </div>
            )}
            {msgs.map(m=>{
              const isMine = m.sender==='user' || m.senderId === currentUid;
              const photoUrl = m.senderPhotoUrl || m.photoUrl || '';
              const senderDisplayName = m.senderName || (isMine ? profile.name : (isAr ? 'الدعم' : 'Support'));
              return (
              <div key={m.id} className={`chat-bubble ${isMine?'mine':'theirs'}`} style={{position:'relative'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                  {photoUrl ? (
                    <img src={photoUrl} alt={senderDisplayName} style={{width:28,height:28,borderRadius:'50%',objectFit:'cover',flexShrink:0,border:'2px solid rgba(255,255,255,0.2)',background:'#fff'}} />
                  ) : (
                    <div style={{width:28,height:28,borderRadius:'50%',background:isMine?'rgba(255,255,255,0.2)':'rgba(232,80,10,0.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:isMine?'rgba(255,255,255,0.8)':'var(--brand-500)',flexShrink:0}}>
                      {isMine ? ini(profile.name) : <i className="bi bi-headset" style={{fontSize:13}}></i>}
                    </div>
                  )}
                  <span className="text-xs" style={{opacity:.7,fontWeight:600}}>{senderDisplayName}</span>
                  {m.createdAt && <span className="text-xs" style={{opacity:.4,marginRight:'auto'}}>{timeAgo(m.createdAt)}</span>}
                </div>
                {editingMsg?.id === m.id ? (
                  <div style={{marginTop:8}}>
                    <input className="form-input mb-2" autoFocus style={{fontSize:'13px', padding:'6px', color:'#000'}} value={editingMsg.text} onChange={e=>setEditingMsg({...editingMsg, text:e.target.value})} onKeyDown={e=>{if(e.key==='Enter'){doEditMsg(activeChatId, m.id, editingMsg.text); setEditingMsg(null);}}} />
                    <div className="d-flex gap-2 justify-content-end">
                      <button type="button" className="btn btn-sm" style={{padding:'2px 8px', fontSize:'11px'}} onClick={()=>setEditingMsg(null)}>{isAr ? 'إلغاء' : 'Cancel'}</button>
                      <button type="button" className="btn btn-sm btn-primary" style={{padding:'2px 8px', fontSize:'11px'}} onClick={()=>{doEditMsg(activeChatId, m.id, editingMsg.text); setEditingMsg(null);}}>{isAr ? 'حفظ' : 'Save'}</button>
                    </div>
                  </div>
                ) : (
                  <div style={{paddingRight:36}}>{m.text} {m.updatedAt && <span style={{fontSize:'10px',opacity:0.6}}>{isAr ? '(معدل)' : '(edited)'}</span>}</div>
                )}
                
                {isMine && !editingMsg && (
                  <div style={{position:'absolute', top:8, left: 8, display:'flex', gap:6, opacity:0.6, transition:'opacity 0.2s'}}>
                    <button type="button" onClick={()=>setEditingMsg({id: m.id, text: m.text})} style={{background:'transparent',border:'none',color:'inherit',padding:2,cursor:'pointer',fontSize:'12px',borderRadius:4}} title={isAr ? 'تعديل' : 'Edit'}><i className="bi bi-pencil"></i></button>
                    <button type="button" onClick={()=>doDelMsg(activeChatId, m.id)} style={{background:'transparent',border:'none',color:'inherit',padding:2,cursor:'pointer',fontSize:'12px',borderRadius:4}} title={isAr ? 'حذف' : 'Delete'}><i className="bi bi-trash"></i></button>
                  </div>
                )}
              </div>
            )})}
            <div ref={msgsEnd}></div>
          </div>
          <form className="chat-input-bar" onSubmit={sendMsg}>
            <input className="chat-input" value={msgIn} onChange={e=>setMsgIn(e.target.value)} placeholder={isAr ? 'اكتب رسالتك للإدارة...' : 'Type your message...'} disabled={!activeChatId} />
            <button type="submit" className="chat-send-btn" disabled={!activeChatId}><i className="bi bi-send-fill"></i></button>
          </form>
        </div>
      </div>
    </div>
  );
}

  const saveProfile = async () => {
    setSaving(true);
    try {
      let photoURL = profile.photoURL || '';

              <div className="form-group">
                <label className="form-label">{isAr ? 'الاسم الكامل *' : 'Full Name *'}</label>
                <input type="text" className="form-input" value={name} onChange={e=>setName(e.target.value)} placeholder={isAr ? 'الاسم الكامل' : 'Full Name'} />
              </div>
              <div className="form-group">
                <label className="form-label">{isAr ? 'رقم الهاتف' : 'Phone Number'}</label>
                <input type="tel" className="form-input" value={phone} onChange={e=>setPhone(e.target.value)} placeholder={isAr ? 'رقم الهاتف' : 'Phone number'} dir="ltr" style={{textAlign: isAr ? 'right' : 'left'}} />
              </div>
            </div>
            <div className="modal-footer" style={{borderTop:'1px solid var(--border)',padding:16,display:'flex',gap:12}}>
              <button className="btn btn-outline" style={{flex:1}} onClick={()=>setEditing(false)}>{isAr ? 'إلغاء' : 'Cancel'}</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={saveProfile} disabled={saving}>
                {saving ? <div className="spinner" style={{width:20,height:20}}></div> : (isAr ? 'حفظ' : 'Save')}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
  <script src="maintenance-check.js?v=2"></script>
</body>
</html>
