                   {ch.unreadCount>0&&<span className="nav-badge" style={{marginRight:'auto',marginLeft:0}}>{ch.unreadCount}</span>}
                 </button>
                 {/* Delete chat button */}
                 <button
                   title="حذف المحادثة"
                   onClick={(e)=>{e.stopPropagation(); doDelChat(ch.id, ch.userName);}}
                   style={{position:'absolute',top:'50%',left:8,transform:'translateY(-50%)',background:'transparent',border:'none',cursor:'pointer',color:'var(--red,#ef4444)',fontSize:14,opacity:0.5,padding:'4px',borderRadius:4,transition:'opacity 0.2s'}}
                   onMouseEnter={e=>e.currentTarget.style.opacity='1'}
                   onMouseLeave={e=>e.currentTarget.style.opacity='0.5'}
                 ><i className="bi bi-trash3"></i></button>
               </div>
             );
           })}
        </div>
        
        {/* Messaging window */}
        <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
          {!activeChatId
            ?<div className="h-100 d-flex align-items-center justify-content-center"><Empty icon="bi-chat-square-dots" title="اختر محادثة" sub="من القائمة على اليمين للبدء بالدردشة" /></div>
            :<>
              <div className="card-header" style={{borderBottom:'1px solid var(--border)'}}>
                <div className="d-flex align-items-center gap-2">
                  {chatPhoto ? <img src={chatPhoto} alt="صورة" style={{width:32,height:32,borderRadius:'50%',objectFit:'cover',border:'1px solid var(--border)'}} /> : <Av name={currentChat?.userName||'م'} size={32} />}
                  <div style={{display:'flex', flexDirection:'column'}}>
                    <span className="bold">{currentChat?.userName||'مستخدم'}</span>
                    <span style={{fontSize:'11px', color:'var(--primary-light)'}}>{roleLabel}</span>
                  </div>
                </div>
              </div>
              <div style={{flex:1,overflowY:'auto',padding:16,display:'flex',flexDirection:'column',gap:9}}>
                {msgs.map(m=>{
                  const isAdmin = m.sender==='admin';
                  return (
                    <div key={m.id} className={`d-flex gap-2 mb-2 align-items-end ${isAdmin?'justify-content-start':'justify-content-end'}`} style={{flexDirection: isAdmin?'row':'row-reverse'}}>
                      {/* Avatar */}
                      {m.senderPhotoUrl 
                        ? <img src={m.senderPhotoUrl} alt="صورة" style={{width:28,height:28,borderRadius:'50%',objectFit:'cover',border:'1px solid var(--border)'}} /> 
                        : <Av name={isAdmin?userInfo.fullName:(m.senderName||currentChat?.userName||'م')} size={28} />
                      }
                      
                      <div className="p-3" style={{
                        maxWidth:'70%',
                        background: isAdmin?'var(--primary-glow)':'var(--bg-glass)',
                        border: isAdmin?'1px solid var(--primary-light)':'1px solid var(--border)',
                        borderRadius: isAdmin?'14px 14px 0 14px':'14px 14px 14px 0',
                        color:'var(--text-primary)',
                        position:'relative'
                      }}>
                        <div style={{fontSize:'.62rem',fontWeight:700,color:'var(--text-muted)',marginBottom:3}}>{isAdmin?userInfo.fullName:(m.senderName||currentChat?.userName||'المستخدم')}</div>
                        
                        {editingMsg?.id === m.id ? (
                          <div className="d-flex flex-column gap-2 mt-2">
                            <input className="form-input" style={{fontSize:'.85rem', padding:'4px 8px'}} autoFocus value={editingMsg.text} onChange={e=>setEditingMsg({...editingMsg, text:e.target.value})} onKeyDown={e=>{if(e.key==='Enter') { doEditMsg(activeChatId, m.id, editingMsg.text); setEditingMsg(null); }}} />
                            <div className="d-flex gap-2 justify-content-end">
                              <button type="button" className="btn btn-sm" style={{padding:'2px 8px', fontSize:'11px'}} onClick={()=>setEditingMsg(null)}>إلغاء</button>
                              <button type="button" className="btn btn-sm btn-primary" style={{padding:'2px 8px', fontSize:'11px'}} onClick={()=>{doEditMsg(activeChatId, m.id, editingMsg.text); setEditingMsg(null);}}>حفظ</button>
                            </div>
                          </div>
                        ) : (
                          <div style={{fontSize:'.85rem',lineHeight:1.5}}>{m.text} {m.updatedAt && <span style={{fontSize:'10px',opacity:0.6}}>(معدل)</span>}</div>
                        )}
                        
                        {isAdmin && !editingMsg && (
                          <div style={{position:'absolute', top:5, left: isAdmin?5:'auto', right: !isAdmin?5:'auto', display:'flex', gap:6, opacity:0.6}}>
                            <button type="button" onClick={()=>setEditingMsg({id: m.id, text: m.text})} style={{background:'transparent',border:'none',color:'var(--text-muted)',padding:0,cursor:'pointer',fontSize:'11px'}} title="تعديل"><i className="bi bi-pencil"></i></button>
                            <button type="button" onClick={()=>doDelMsg(activeChatId, m.id)} style={{background:'transparent',border:'none',color:'var(--red)',padding:0,cursor:'pointer',fontSize:'11px'}} title="حذف"><i className="bi bi-trash"></i></button>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
                <div ref={endRef}></div>
              </div>
              <form className="d-flex gap-2 p-3" style={{borderTop:'1px solid var(--border)',background:'rgba(255,255,255,0.01)'}} onSubmit={sendMsg}>
                <input className="form-input flex-fill" type="text" placeholder="اكتب رسالة..." value={msgIn} onChange={e=>setMsgIn(e.target.value)} />
                <button type="submit" className="btn btn-primary"><i className="bi bi-send-fill"></i><span className="d-none d-sm-inline ms-1">إرسال</span></button>
              </form>
            </>
          }
        </div>
      </div>
    </div>
  );
}

// REPORTS VIEW (Chart.js financial charts)
// ══════════════════════════════════════════
function ReportsView({donations, cases, users}) {
  const [dateRange, setDateRange] = useState('all'); // all, month, week
  const barRef   = React.useRef(null);
  const pieRef   = React.useRef(null);
  const barChart = React.useRef(null);
  const pieChart = React.useRef(null);

  // Filter Data
  const now = new Date();
  const filteredDonations = React.useMemo(() => {
    return donations.filter(d => {
      if (dateRange === 'all') return true;
      const ts = d.timestamp || d.createdAt;
      if (!ts) return false;
      const dDate = ts.toDate ? ts.toDate() : new Date(ts);
      const diffTime = Math.abs(now - dDate);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
      if (dateRange === 'week') return diffDays <= 7;
      if (dateRange === 'month') return diffDays <= 30;
      if (dateRange === 'year') return diffDays <= 365;
      return true;
    });
  }, [donations, dateRange]);

  // Compute monthly totals for the chart (Always based on all data or year data for a good chart)
  const monthlyData = React.useMemo(()=>{
    const map={};
    (dateRange==='all'?donations:filteredDonations).forEach(d=>{
      const ts=d.timestamp||d.createdAt;
      if(!ts)return;
      const date=ts.toDate?ts.toDate():new Date(ts);
      const key=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
      const amt = parseFloat(String(d.amount||d.amountOrItem||'0').replace(/[^0-9.]/g,'')) || 0;
      map[key]=(map[key]||0)+amt;
    });
    const sorted=Object.entries(map).sort(([a],[b])=>a.localeCompare(b)).slice(-12); // last 12 months
    return{labels:sorted.map(([k])=>k),data:sorted.map(([,v])=>v)};
  },[donations, filteredDonations, dateRange]);

  const catData = React.useMemo(()=>{
    const map={};
    filteredDonations.forEach(d=>{
      const k=d.category||'مالي';
      const amt = parseFloat(String(d.amount||d.amountOrItem||'0').replace(/[^0-9.]/g,'')) || 0;
      map[k]=(map[k]||0)+amt;
    });
    return{labels:Object.keys(map),data:Object.values(map)};
  },[filteredDonations]);

  React.useEffect(()=>{
    if(!barRef.current)return;
    if(barChart.current)barChart.current.destroy();
    const isDark=document.documentElement.getAttribute('data-bs-theme')==='dark';
    const gridColor=isDark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)';
    const textColor=isDark?'#6c7a9a':'#64748b';
    const ctx = barRef.current.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, 'rgba(16,185,129,0.9)');
    gradient.addColorStop(1, 'rgba(16,185,129,0.1)');

    barChart.current=new Chart(barRef.current,{
      type:'bar',
      data:{labels:monthlyData.labels,datasets:[{label:'إجمالي التبرعات (ج.س)',data:monthlyData.data,
        backgroundColor:gradient,borderColor:'#10b981',borderWidth:1,borderRadius:6,
        borderSkipped:false, barPercentage:0.6}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{rtl:true,backgroundColor:'rgba(15,23,42,0.9)',titleFont:{family:'Tajawal'},bodyFont:{family:'Tajawal'},padding:12,
        callbacks:{label:ctx=>`${ctx.parsed.y.toLocaleString('ar')} ج.س`}}},
        scales:{x:{ticks:{color:textColor,font:{family:'Tajawal'}},grid:{display:false}},
                y:{ticks:{color:textColor,font:{family:'Tajawal'},callback:v=>`${Number(v).toLocaleString('ar')}`},grid:{color:gridColor, borderDash:[5,5]}}}}
    });
    return()=>barChart.current?.destroy();
  },[monthlyData]);

  React.useEffect(()=>{
    if(!pieRef.current)return;
    if(pieChart.current)pieChart.current.destroy();
    pieChart.current=new Chart(pieRef.current,{
      type:'doughnut',
      data:{labels:catData.labels.length?catData.labels:['لا بيانات'],datasets:[{data:catData.data.length?catData.data:[1],
        backgroundColor:catData.data.length?['#10b981','#f59e0b','#8b5cf6','#ef4444','#3b82f6']:['rgba(100,100,100,0.2)'],
        borderColor:document.documentElement.getAttribute('data-bs-theme')==='dark'?'#1e293b':'#ffffff',borderWidth:2}]},
      options:{responsive:true, maintainAspectRatio:false, cutout:'70%',
        plugins:{legend:{position:'bottom',labels:{color:'#6c7a9a',padding:20,usePointStyle:true,font:{family:'Tajawal',size:12}}},
          tooltip:{rtl:true,backgroundColor:'rgba(15,23,42,0.9)',titleFont:{family:'Tajawal'},bodyFont:{family:'Tajawal'},padding:12,callbacks:{label:ctx=>catData.data.length?`${ctx.label}: ${ctx.parsed.toLocaleString('ar')} ج.س`:'لا توجد بيانات'}}}}
    });
    return()=>pieChart.current?.destroy();
  },[catData]);

  // Insights Calculations
  const totalAmt = filteredDonations.reduce((s,d)=>s+(parseFloat(String(d.amount||d.amountOrItem||'0').replace(/[^0-9.]/g,''))||0),0);
  const recurring = filteredDonations.filter(d=>d.isRecurring).length;
  const topDonors = filteredDonations.reduce((acc,d)=>{
    const n = d.donorName||'مجهول';
    const dUser = users && users.find(u => (d.uid && u.uid === d.uid) || (d.donorId && u.uid === d.donorId) || (d.userId && u.uid === d.userId) || (d.email && u.email === d.email) || (d.donorName && u.name === d.donorName));
    const pUrl = d.photoURL || d.donorPhotoURL || (dUser ? dUser.photoURL : null);
    if (!acc[n]) acc[n] = { amt: 0, photoURL: pUrl };
    if (!acc[n].photoURL && pUrl) acc[n].photoURL = pUrl;
    acc[n].amt += (parseFloat(String(d.amount||d.amountOrItem||'0').replace(/[^0-9.]/g,''))||0);
    return acc;
  },{});
  const topDonorsList = Object.entries(topDonors).sort(([,a],[,b])=>b.amt-a.amt).slice(0,5);
  
  // Smart Analysis
  const highestMonth = monthlyData.data.length ? monthlyData.labels[monthlyData.data.indexOf(Math.max(...monthlyData.data))] : '—';
  const highestCat = catData.data.length ? catData.labels[catData.data.indexOf(Math.max(...catData.data))] : '—';
  const avgDonation = filteredDonations.length ? (totalAmt / filteredDonations.length) : 0;
  
  const targetTotal = cases.reduce((s,c)=>s+(parseFloat(String(c.targetAmount||c.amountRequired||'0').replace(/[^0-9.]/g,''))||0),0);
  const raisedTotal = cases.reduce((s,c)=>s+(parseFloat(String(c.raisedAmount||c.amountRaised||'0').replace(/[^0-9.]/g,''))||0),0);
  const globalProgress = targetTotal > 0 ? (raisedTotal / targetTotal) * 100 : 0;

  // Export Functions
  const exportDonationsExcel = () => {
    if(!filteredDonations.length) { showToast('error', 'تنبيه', 'لا توجد بيانات للتصدير'); return; }
    const ws_data = filteredDonations.map(d => {
      const ts = d.timestamp || d.createdAt;
      const dDate = ts?.toDate ? ts.toDate() : new Date(ts);
      return {
        'رقم التبرع': d.id,
        'اسم المتبرع': d.donorName || 'مجهول',
        'قيمة التبرع': parseFloat(String(d.amount||d.amountOrItem||'0').replace(/[^0-9.]/g,'')) || 0,
        'نوع التبرع': d.category || 'مالي',
        'الحالة': d.status || 'معلق',
        'التاريخ': dDate.toLocaleDateString('ar-SA'),
        'وقت التبرع': dDate.toLocaleTimeString('ar-SA'),
        'طريقة الدفع': d.paymentMethod || '—',
        'عنوان الحالة المرتبطة': d.caseTitle || '—',
        'رقم المرجع': d.referenceNumber || '—'
      };
    });
    const ws = XLSX.utils.json_to_sheet(ws_data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "التبرعات");
    XLSX.writeFile(wb, `Donations_Report_${dateRange}_${new Date().toISOString().split('T')[0]}.xlsx`);
  };

  const exportCasesExcel = () => {
    if(!cases.length) { showToast('error', 'تنبيه', 'لا توجد بيانات للتصدير'); return; }
    const ws_data = cases.map(c => {
      const ts = c.createdAt;
      const cDate = ts?.toDate ? ts.toDate() : new Date(ts);
      return {
        'رقم الحالة': c.id,
        'عنوان الحالة': c.title || '—',
        'مقدم الطلب': c.applicantName || '—',
        'المبلغ المطلوب': parseFloat(String(c.amountRequired||c.targetAmount||'0').replace(/[^0-9.]/g,'')) || 0,
        'المبلغ المُجمّع': parseFloat(String(c.amountRaised||c.raisedAmount||'0').replace(/[^0-9.]/g,'')) || 0,
        'التصنيف': c.category || '—',
        'الحالة': c.status === 'pending' ? 'معلق' : c.status === 'approved' ? 'معتمد' : c.status === 'rejected' ? 'مرفوض' : 'مكتمل',
        'المدينة': c.location || '—',
        'الأولوية': c.urgencyLevel || 'عادي',
        'تاريخ الإضافة': cDate.toLocaleDateString('ar-SA')
      };
    });
    const ws = XLSX.utils.json_to_sheet(ws_data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "الحالات");
    XLSX.writeFile(wb, `Cases_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
  };

  return(
    <div className="page active pb-5" style={{animation:'fadeIn 0.5s ease-out'}}>
      <div className="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4 p-3 rounded-4" style={{background:'linear-gradient(90deg, var(--bg-card) 0%, transparent 100%)', borderRight:'4px solid var(--primary)'}}>
        <div>
          <div className="bold d-flex align-items-center gap-2" style={{fontSize:'1.3rem'}}>
            <div style={{width:35, height:35, borderRadius:'10px', background:'linear-gradient(135deg, var(--primary), var(--primary-light))', display:'flex', alignItems:'center', justifyContent:'center', color:'white', boxShadow:'0 4px 15px rgba(16,185,129,0.3)'}}>
              <i className="bi bi-bar-chart-fill"></i>
            </div>
            التقارير والتحليلات المالية
          </div>
          <div style={{fontSize:'.85rem',color:'var(--text-secondary)', marginTop:4}}>لوحة ذكية لتحليل الأداء المالي والتبرعات واستخراج التقارير</div>
        </div>
        <div className="d-flex flex-wrap gap-3 align-items-center">
          <div className="btn-group" dir="ltr" style={{boxShadow:'0 4px 15px rgba(0,0,0,0.08)', borderRadius:'8px', overflow:'hidden'}}>
            {[{v:'all',l:'الكل'},{v:'year',l:'سنة'},{v:'month',l:'30 يوم'},{v:'week',l:'7 أيام'}].map(opt=>(
              <button key={opt.v} className={`btn btn-sm px-3 py-2 ${dateRange===opt.v?'btn-primary':'btn-light'}`} style={{fontWeight:dateRange===opt.v?'bold':'normal', transition:'all 0.3s'}} onClick={()=>setDateRange(opt.v)}>{opt.l}</button>
            ))}
          </div>
          <div className="d-flex gap-2">
            <button className="btn btn-sm text-white px-3 py-2 d-flex align-items-center gap-2" style={{background:'linear-gradient(135deg, #10b981, #059669)', borderRadius:'8px', border:'none', boxShadow:'0 4px 12px rgba(16,185,129,0.3)', transition:'all 0.3s'}} onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 6px 15px rgba(16,185,129,0.4)'}} onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 4px 12px rgba(16,185,129,0.3)'}} onClick={exportDonationsExcel} title="تصدير التبرعات بصيغة Excel">
              <i className="bi bi-file-earmark-excel-fill fs-6"></i> تقرير التبرعات
            </button>
            <button className="btn btn-sm text-white px-3 py-2 d-flex align-items-center gap-2" style={{background:'linear-gradient(135deg, #3b82f6, #2563eb)', borderRadius:'8px', border:'none', boxShadow:'0 4px 12px rgba(59,130,246,0.3)', transition:'all 0.3s'}} onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 6px 15px rgba(59,130,246,0.4)'}} onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 4px 12px rgba(59,130,246,0.3)'}} onClick={exportCasesExcel} title="تصدير الحالات بصيغة Excel">
              <i className="bi bi-file-earmark-spreadsheet-fill fs-6"></i> تقرير الحالات
            </button>
          </div>
        </div>
      </div>

      {/* Performance Indicators Banner */}
      <div className="mb-4 p-4 rounded-4 position-relative overflow-hidden" style={{background:'linear-gradient(135deg, rgba(16,185,129,0.03), rgba(59,130,246,0.03))', border:'1px solid rgba(16,185,129,0.15)', boxShadow:'0 10px 30px rgba(0,0,0,0.02)'}}>
        <div style={{position:'absolute', top:'-50%', right:'-10%', width:'300px', height:'300px', background:'radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 70%)', borderRadius:'50%', zIndex:0}}></div>
        <div style={{position:'absolute', bottom:'-50%', left:'-10%', width:'300px', height:'300px', background:'radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%)', borderRadius:'50%', zIndex:0}}></div>
        
        <div style={{position:'relative', zIndex:1}}>
          <div className="d-flex align-items-center gap-2 mb-4">
            <div style={{background:'linear-gradient(135deg, #10b981, #059669)', color:'white', width:36, height:36, borderRadius:'10px', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 4px 12px rgba(16,185,129,0.3)'}}>
              <i className="bi bi-lightning-charge-fill fs-5"></i>
            </div>
            <span className="bold text-success fs-5" style={{textShadow:'0 2px 5px rgba(0,0,0,0.05)'}}>مؤشرات الأداء المالي</span>
          </div>
          <div className="row g-4">
            <div className="col-md-4">
              <div className="d-flex align-items-start gap-3 p-3 rounded-4" style={{background:'var(--bg-card)', border:'1px solid rgba(16,185,129,0.1)', transition:'all 0.3s', boxShadow:'0 4px 15px rgba(0,0,0,0.03)'}} onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-3px)';e.currentTarget.style.boxShadow='0 8px 25px rgba(16,185,129,0.1)'}} onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 4px 15px rgba(0,0,0,0.03)'}}>
                <div style={{background:'rgba(16,185,129,0.1)', color:'#10b981', width:44, height:44, borderRadius:'12px', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>
                  <i className="bi bi-cash-coin fs-4"></i>
                </div>

// VOLUNTEER ASSIGNMENT MODAL
// ══════════════════════════════════════════
function AssignVolunteerModal({caseItem, users, onClose}) {
  const volunteers = users.filter(u => u.role === 'volunteer' && u.status !== 'suspended');
  const [selectedVolId, setSelectedVolId] = useState(caseItem.volunteerId || '');
  const [saving, setSaving] = useState(false);

  const save = async () => {
    setSaving(true);
    try {
      await updateDoc(doc(db, 'cases', caseItem.id), {
        assignedVolunteerId: selectedVolId || null,
        volunteerId: selectedVolId || null,
        status: selectedVolId ? 'assigned' : (caseItem.status === 'assigned' ? 'approved' : caseItem.status),
        assignedAt: selectedVolId ? serverTimestamp() : null,
        updatedAt: serverTimestamp()
      });
      showToast('success', 'تم التعيين', 'تم تحديث المتطوع المعين للحالة');
      onClose();
    } catch(e) {
      showToast('error', 'خطأ', e.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <Modal title="تعيين متطوع للحالة" icon="bi-person-check-fill" onClose={onClose}
      footer={<>
        <button className="btn btn-outline" onClick={onClose}>إلغاء</button>
        <button className="btn btn-primary" onClick={save} disabled={saving}>
          {saving ? 'جاري الحفظ...' : 'حفظ التعيين'}
        </button>
      </>}>
      <div className="mb-3">
        <label className="form-label">الحالة المستهدفة</label>
        <div className="form-input" style={{background:'rgba(255,255,255,0.03)'}}>{caseItem.title}</div>
      </div>
      <div className="mb-3">
        <label className="form-label">اختر متطوعاً</label>
        <select className="form-input" value={selectedVolId} onChange={e => setSelectedVolId(e.target.value)}>
          <option value="">-- إلغاء تعيين المتطوع --</option>
          {volunteers.map(v => (
            <option key={v.id} value={v.id || v.uid}>{v.name} ({v.email})</option>
          ))}
        </select>
      </div>
      {volunteers.length === 0 && (
        <div style={{color:'var(--gold)', fontSize:'0.8rem', marginTop:'8px'}}>
          <i className="bi bi-exclamation-triangle-fill me-1"></i>
          لا يوجد متطوعين نشطين مسجلين في النظام حالياً.
        </div>
      )}
    </Modal>
  );
}

// VERIFICATIONS VIEW — Admin: Review identity docs
// ══════════════════════════════════════════
function VerificationsView({verifications, doDelVerification}) {
  const [filter,setFilter] = useState('pending');
  const [selected,setSelected] = useState(null);
  const [adminNote,setAdminNote] = useState('');
  const [saving,setSaving] = useState(false);

  const DOC_LABELS = {
    national_id: 'بطاقة وطنية',
    passport: 'جواز سفر',
    driving_license: 'رخصة قيادة',
    birth_cert: 'شهادة ميلاد',
  };
  const ROLE_LABELS = { beneficiary: 'مستفيد', volunteer: 'متطوع' };

  const filtered = verifications.filter(v => filter === 'all' || v.verificationStatus === filter);
  const pendingCount = verifications.filter(v => v.verificationStatus === 'pending').length;

  const doVerify = async (v, decision) => {
    const label = decision === 'approved' ? 'قبول' : 'رفض';
    if (!await showConfirm(`${label} الهوية`, `${label} طلب التحقق من هوية "${v.name}"؟`, decision === 'approved' ? '✅' : '❌')) return;
    setSaving(true);
    try {
      // Update verification record
      await updateDoc(doc(db, 'identity_verifications', v.id), {
        verificationStatus: decision,
        adminNote: adminNote,
        reviewedAt: serverTimestamp(),
      });
      // Update user status
      const newUserStatus = decision === 'approved' ? 'active' : 'rejected';
      await updateDoc(doc(db, 'users', v.uid), {
        status: newUserStatus,
        verificationStatus: decision,
      });
      showToast('success', `تم ${label} طلب التحقق من هوية "${v.name}"`);
      setSelected(null);
      setAdminNote('');
    } catch(e) { showToast('error', 'خطأ', e.message); }
    finally { setSaving(false); }
  };

  return (
    <div>
      {/* Stats */}
      <div className="stats-grid" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
        {[
          {l:'في الانتظار', v:verifications.filter(v=>v.verificationStatus==='pending').length, c:'stat-gold', i:'bi-hourglass-split'},
          {l:'مقبولة',      v:verifications.filter(v=>v.verificationStatus==='approved').length, c:'stat-green', i:'bi-shield-check'},
          {l:'مرفوضة',     v:verifications.filter(v=>v.verificationStatus==='rejected').length, c:'stat-red',  i:'bi-shield-x'},
        ].map((s,i) => (
          <div className={`stat-card ${s.c}`} key={i}>
            <div className="stat-icon"><i className={`bi ${s.i}`}></i></div>
            <div><div className="stat-value">{s.v}</div><div className="stat-label">{s.l}</div></div>
          </div>
        ))}
      </div>

      {/* Filter tabs */}
      <div className="d-flex gap-2 mb-4 flex-wrap">
        {[['all','الكل'],['pending','معلق'],['approved','مقبول'],['rejected','مرفوض']].map(([v,l])=>(
          <button key={v} className={`btn btn-sm ${filter===v?'btn-primary':'btn-outline'}`} onClick={()=>setFilter(v)}>{l}</button>
        ))}
      </div>

      {/* List */}
      {filtered.length === 0
        ? <div className="card"><Empty icon="bi-shield-check" title="لا توجد طلبات" sub="لا توجد طلبات تحقق بهذه الحالة" /></div>
        : <div className="row g-3">
            {filtered.map(v => {
              const statusMap = {
                pending:  {c:'badge-pending',  l:'معلق',   i:'bi-hourglass-split'},
                approved: {c:'badge-approved', l:'مقبول',  i:'bi-check-circle-fill'},
                rejected: {c:'badge-rejected', l:'مرفوض', i:'bi-x-circle-fill'},
              };
              const st = statusMap[v.verificationStatus] || statusMap.pending;
              return (
                <div className="col-lg-6" key={v.id}>
                  <div className="card" style={{cursor:'pointer'}} onClick={()=>{setSelected(v);setAdminNote(v.adminNote||'');}}>
                    <div className="card-body">
                      <div className="d-flex align-items-center gap-3 mb-3">
                        {v.docFrontURL
                          ? <img src={v.docFrontURL} alt="وثيقة" style={{width:48,height:48,borderRadius:10,objectFit:'cover',border:'1px solid var(--border)'}} />
                          : <div className="avatar" style={{width:48,height:48,borderRadius:10}}>{ini(v.name)}</div>
                        }
                        <div style={{flex:1}}>
                          <div className="bold">{v.name}</div>
                          <div className="text-sm text-muted">{v.email}</div>
                        </div>
                        <div className="d-flex flex-column align-items-end gap-1">
                          <span className={`badge badge-supervisor`}>{ROLE_LABELS[v.role]||v.role}</span>
                          <span className={`badge ${st.c}`}><i className={`bi ${st.i}`} style={{fontSize:'.6rem'}}></i> {st.l}</span>
                        </div>
                      </div>
                      <div className="d-flex gap-3 text-sm text-muted">
                        <span><i className="bi bi-credit-card me-1"></i>{DOC_LABELS[v.docType]||v.docType}</span>
                        <span><i className="bi bi-hash me-1"></i>{v.docNumber}</span>
                        {v.docCountry && <span><i className="bi bi-geo-alt me-1"></i>{v.docCountry}</span>}
                      </div>
                      {v.reason && <div className="mt-2 text-sm" style={{color:'var(--text-secondary)',fontStyle:'italic'}}>"{v.reason}"</div>}
                      <div className="d-flex align-items-center justify-content-between mt-3 pt-3" style={{borderTop:'1px solid var(--border)'}}>
                        <div className="text-xs text-muted">{timeAgo(v.submittedAt)}</div>
                        <div className="d-flex gap-2" onClick={e=>e.stopPropagation()}>
                          <button className="btn btn-outline btn-icon btn-sm" onClick={()=>{setSelected(v);setAdminNote(v.adminNote||'');}} title="معاينة وتعديل"><i className="bi bi-pencil"></i></button>
                          <button className="btn btn-outline btn-icon btn-sm" style={{color:'var(--red)',borderColor:'transparent'}} onClick={()=>doDelVerification(v.id, v.name)} title="حذف الطلب"><i className="bi bi-trash"></i></button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
      }

      {/* Detail Modal */}
      {selected && (
        <Modal title="تفاصيل طلب التحقق" icon="bi-shield-check" onClose={()=>{setSelected(null);setAdminNote('');}}
          footer={
            <>
              <button className="btn btn-outline" onClick={()=>{setSelected(null);setAdminNote('');}}>إغلاق</button>
              <button className="btn btn-reject" onClick={()=>doVerify(selected,'rejected')} disabled={saving || selected.verificationStatus==='rejected'}><i className="bi bi-x-lg"></i>رفض الطلب</button>
              <button className="btn btn-approve" onClick={()=>doVerify(selected,'approved')} disabled={saving || selected.verificationStatus==='approved'}><i className="bi bi-check-lg"></i>تأكيد وموافقة</button>
              <button className="btn btn-outline" style={{color:'var(--red)',borderColor:'var(--red)'}} onClick={()=>{doDelVerification(selected.id, selected.name);setSelected(null);setAdminNote('');}}><i className="bi bi-trash"></i>حذف الطلب</button>
            </>
          }
        >
          <div className="row g-3">
            <div className="col-md-6"><div className="modal-label">الاسم</div><div className="bold">{selected.name}</div></div>
            <div className="col-md-6"><div className="modal-label">البريد</div><div>{selected.email}</div></div>
            <div className="col-md-6"><div className="modal-label">الدور</div><span className="badge badge-supervisor">{ROLE_LABELS[selected.role]||selected.role}</span></div>
            <div className="col-md-6"><div className="modal-label">نوع الوثيقة</div><div>{DOC_LABELS[selected.docType]||selected.docType}</div></div>
            <div className="col-md-6"><div className="modal-label">رقم الوثيقة</div><div className="bold">{selected.docNumber}</div></div>
            <div className="col-md-6"><div className="modal-label">البلد</div><div>{selected.docCountry||'—'}</div></div>
            {selected.docExpiry && <div className="col-md-6"><div className="modal-label">تاريخ الانتهاء</div><div>{selected.docExpiry}</div></div>}
            {selected.reason && <div className="col-12"><div className="modal-label">السبب / المهارات</div><div style={{lineHeight:1.7}}>{selected.reason}</div></div>}

            {/* Document Images */}
            {selected.docFrontURL && (
              <div className="col-md-6">
                <div className="modal-label">صورة الوجه الأمامي</div>
                <a href={selected.docFrontURL} target="_blank" rel="noopener noreferrer">
                  <img src={selected.docFrontURL} alt="الوجه الأمامي" style={{width:'100%',borderRadius:8,border:'1px solid var(--border)',marginTop:4,cursor:'zoom-in'}} />
                </a>
              </div>
            )}
            {selected.docBackURL && (
              <div className="col-md-6">
                <div className="modal-label">صورة الوجه الخلفي</div>
                <a href={selected.docBackURL} target="_blank" rel="noopener noreferrer">
                  <img src={selected.docBackURL} alt="الوجه الخلفي" style={{width:'100%',borderRadius:8,border:'1px solid var(--border)',marginTop:4,cursor:'zoom-in'}} />
                </a>
              </div>
            )}

            {selected.verificationStatus === 'pending' || true ? (
              <div className="col-12">
                <div className="modal-label">ملاحظة المدير / سبب القبول أو الرفض (اختياري)</div>
                <textarea className="form-input" rows={2} value={adminNote} onChange={e=>setAdminNote(e.target.value)}
                  placeholder="سبب القبول أو الرفض..." style={{resize:'vertical'}} />
              </div>
            ) : null}
          </div>
        </Modal>
      )}
    </div>
  );
}

// ACTIVITY VIEW
// ══════════════════════════════════════════
function ActivityView({logs, doDelLog, doClearLogs}) {
  return (
    <div>
      <div className="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
        <div className="d-flex align-items-center gap-3">
          <div className="stat-icon" style={{background:'rgba(102,187,106,0.15)',color:'var(--primary)',width:40,height:40,borderRadius:12,fontSize:'1.1rem'}}><i className="bi bi-clock-history"></i></div>
          <div>
            <div className="bold" style={{fontSize:'.87rem'}}>سجل العمليات</div>
            <div style={{fontSize:'.65rem',color:'var(--text-secondary)'}}>تتبع حركات ومسؤوليات النظام</div>
          </div>
        </div>
        {logs.length > 0 && (
          <button className="btn btn-outline" style={{borderColor:'rgba(239,83,80,0.5)',color:'var(--red)'}} onClick={doClearLogs}>
            <i className="bi bi-trash-fill me-1"></i>مسح السجل بالكامل
          </button>
        )}
      </div>
      <div className="card p-0">
        <div className="card-body p-0">
          {logs.length===0 ? <Empty icon="bi-clock" title="لا توجد عمليات مسجلة" sub="لم يتم إجراء أي نشاطات بعد" /> : (
            <div className="table-responsive">
              <table className="table table-hover align-middle mb-0" style={{fontSize:'.8rem'}}>
                <thead>
                  <tr>
                    <th>المسؤول</th>
                    <th>العملية</th>
                    <th>التفاصيل</th>
                    <th>التاريخ والوقت</th>
                    <th style={{width:60}}>إجراء</th>
                  </tr>
                </thead>
                <tbody>
                  {logs.map(log => (
                    <tr key={log.id}>
                      <td><div className="d-flex align-items-center gap-2"><Av name={log.adminName} size={24} />{log.adminName}</div></td>
                      <td><span className="badge badge-approved">{log.action}</span></td>
                      <td style={{maxWidth:250,whiteSpace:'normal'}}>{log.details}</td>
                      <td className="text-muted" style={{minWidth:120}}>{log.timestamp ? formatDate(log.timestamp.toDate(),true) : '—'}</td>
                      <td>
                        <button className="btn btn-outline btn-icon btn-sm" style={{color:'var(--red)',borderColor:'transparent'}} onClick={()=>doDelLog(log.id)} title="حذف السجل">
                          <i className="bi bi-trash"></i>
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════
// SETTINGS VIEW
// ══════════════════════════════════════════
function SettingsView({sysSettings, logActivity, cases, users, donations, activityLogs}) {
  const [f,setF]=useState({
    force_app_update: sysSettings?.force_app_update || false,
    min_app_version: sysSettings?.min_app_version || '1.0.0',
    app_maintenance_mode: sysSettings?.app_maintenance_mode || false,
    play_store_link: sysSettings?.play_store_link || '',
    
    web_maintenance_mode: sysSettings?.web_maintenance_mode || false,
    contact_email: sysSettings?.contact_email || '',
    contact_phone: sysSettings?.contact_phone || '',
    
    facebook_url: sysSettings?.facebook_url || '',
    twitter_url: sysSettings?.twitter_url || '',
    instagram_url: sysSettings?.instagram_url || '',

    bank_name: sysSettings?.bank_name || 'بنك الخرطوم',
    bank_account: sysSettings?.bank_account || '',
    bank_holder: sysSettings?.bank_holder || '',

    about_us_text: sysSettings?.about_us_text || '',
    privacy_policy_url: sysSettings?.privacy_policy_url || '',
    terms_url: sysSettings?.terms_url || ''
  });
  const [saving,setSaving] = useState(false);

  useEffect(()=>{
    if(sysSettings) {
      setF({
        force_app_update: sysSettings.force_app_update || false,
        min_app_version: sysSettings.min_app_version || '1.0.0',
        app_maintenance_mode: sysSettings.app_maintenance_mode || false,
        play_store_link: sysSettings.play_store_link || '',
        
        web_maintenance_mode: sysSettings.web_maintenance_mode || false,
        contact_email: sysSettings.contact_email || '',
        contact_phone: sysSettings.contact_phone || '',
        
        facebook_url: sysSettings.facebook_url || '',
        twitter_url: sysSettings.twitter_url || '',
        instagram_url: sysSettings.instagram_url || '',
    
        bank_name: sysSettings.bank_name || 'بنك الخرطوم',
        bank_account: sysSettings.bank_account || '',
        bank_holder: sysSettings.bank_holder || '',
    
        about_us_text: sysSettings.about_us_text || '',
        privacy_policy_url: sysSettings.privacy_policy_url || '',
        terms_url: sysSettings.terms_url || ''
      });
    }
  },[sysSettings]);

  const save = async()=>{
    setSaving(true);
    try {
      await setDoc(doc(db,'settings','general'), f, {merge:true});
      if(logActivity) logActivity('تحديث الإعدادات', 'تم تحديث إعدادات النظام العامة والموقع');
      showToast('success','تم الحفظ','تم تحديث إعدادات النظام بنجاح');
    }catch(e){showToast('error','خطأ',e.message)}finally{setSaving(false)}
  };

  const up = k => e => setF(p=>({...p, [k]: e.target.type==='checkbox'?e.target.checked:e.target.value}));

  return (
    <div>
      <div className="d-flex align-items-center gap-3 mb-4">
        <div className="stat-icon" style={{background:'rgba(239,83,80,0.15)',color:'var(--red)',width:40,height:40,borderRadius:12,fontSize:'1.1rem'}}><i className="bi bi-gear-fill"></i></div>
        <div>
          <div className="bold" style={{fontSize:'.87rem'}}>إعدادات النظام الشاملة</div>
          <div style={{fontSize:'.65rem',color:'var(--text-secondary)'}}>التحكم الكامل في إعدادات التطبيق والموقع وحسابات الجمعية</div>
        </div>
      </div>
      
      <div className="row g-4">
        {/* التطبيق */}
        <div className="col-md-6">
          <div className="card h-100">
            <div className="card-header"><div className="bold"><i className="bi bi-phone me-2 text-primary"></i>تطبيق الأندرويد</div></div>
            <div className="card-body">
              <div className="form-check form-switch mb-3">
                <input className="form-check-input" type="checkbox" checked={f.app_maintenance_mode} onChange={up('app_maintenance_mode')} />
                <label className="form-check-label bold text-danger">تفعيل وضع الصيانة (إيقاف التطبيق)</label>
              </div>
              <div className="form-check form-switch mb-3">
                <input className="form-check-input" type="checkbox" checked={f.force_app_update} onChange={up('force_app_update')} />
                <label className="form-check-label bold text-warning">إجبار المستخدمين على التحديث</label>
              </div>
              <div className="form-group mb-3">
                <label className="form-label">رقم الإصدار الأدنى المقبول (مثل: 1.0.5)</label>
                <input className="form-input" value={f.min_app_version} onChange={up('min_app_version')} placeholder="1.0.0" />
              </div>
              <div className="form-group mb-0">
                <label className="form-label">رابط التطبيق على Google Play</label>
                <input className="form-input" value={f.play_store_link} onChange={up('play_store_link')} placeholder="https://play.google.com/store/apps/details?id=..." dir="ltr" style={{textAlign:'left'}} />
              </div>
            </div>
          </div>
        </div>

        {/* الموقع والتواصل */}
        <div className="col-md-6">
          <div className="card h-100">
            <div className="card-header"><div className="bold"><i className="bi bi-globe me-2 text-primary"></i>الموقع الإلكتروني والمنصة</div></div>
            <div className="card-body">
              <div className="form-check form-switch mb-3">
                <input className="form-check-input" type="checkbox" checked={f.web_maintenance_mode} onChange={up('web_maintenance_mode')} />
                <label className="form-check-label bold text-danger">تفعيل وضع الصيانة للموقع</label>
              </div>
              <div className="form-group mb-3">
                <label className="form-label">البريد الإلكتروني للتواصل</label>
                <input className="form-input" type="email" value={f.contact_email} onChange={up('contact_email')} placeholder="info@takaful.com" dir="ltr" style={{textAlign:'left'}} />
              </div>
              <div className="form-group mb-0">
                <label className="form-label">رقم هاتف التواصل (واتساب)</label>
                <input className="form-input" value={f.contact_phone} onChange={up('contact_phone')} placeholder="+249..." dir="ltr" style={{textAlign:'left'}} />
              </div>
            </div>
          </div>
        </div>

        {/* وسائل التواصل الاجتماعي */}
        <div className="col-md-6">
          <div className="card h-100">
            <div className="card-header"><div className="bold"><i className="bi bi-share me-2" style={{color:'#8b5cf6'}}></i>وسائل التواصل الاجتماعي</div></div>
            <div className="card-body">
              <div className="form-group mb-3">
                <label className="form-label"><i className="bi bi-facebook me-1 text-primary"></i> رابط فيسبوك</label>
                <input className="form-input" value={f.facebook_url} onChange={up('facebook_url')} placeholder="https://facebook.com/..." dir="ltr" style={{textAlign:'left'}} />
              </div>
              <div className="form-group mb-3">
                <label className="form-label"><i className="bi bi-twitter-x me-1"></i> رابط منصة X</label>
                <input className="form-input" value={f.twitter_url} onChange={up('twitter_url')} placeholder="https://x.com/..." dir="ltr" style={{textAlign:'left'}} />
              </div>
              <div className="form-group mb-0">
                <label className="form-label"><i className="bi bi-instagram me-1" style={{color:'#e1306c'}}></i> رابط إنستغرام</label>
                <input className="form-input" value={f.instagram_url} onChange={up('instagram_url')} placeholder="https://instagram.com/..." dir="ltr" style={{textAlign:'left'}} />
              </div>
            </div>
          </div>
        </div>

        {/* الحسابات البنكية للتبرع */}
        <div className="col-md-6">
          <div className="card h-100">
            <div className="card-header"><div className="bold"><i className="bi bi-bank me-2 text-success"></i>الحساب البنكي الرئيسي للتبرعات</div></div>
            <div className="card-body">
              <div className="form-group mb-3">
                <label className="form-label">اسم البنك / المحفظة</label>
                <input className="form-input" value={f.bank_name} onChange={up('bank_name')} placeholder="مثال: بنك الخرطوم (بنكك)" />
              </div>
              <div className="form-group mb-3">
                <label className="form-label">رقم الحساب أو رقم المحفظة</label>
                <input className="form-input" value={f.bank_account} onChange={up('bank_account')} placeholder="أدخل رقم الحساب هنا" dir="ltr" style={{textAlign:'left'}} />
              </div>
              <div className="form-group mb-0">
                <label className="form-label">اسم صاحب الحساب (المسجل)</label>
                <input className="form-input" value={f.bank_holder} onChange={up('bank_holder')} placeholder="اسم المستفيد أو الجمعية" />
              </div>
            </div>
          </div>
        </div>

        {/* معلومات الجمعية والروابط */}
        <div className="col-12">
          <div className="card">
            <div className="card-header"><div className="bold"><i className="bi bi-info-circle me-2 text-primary"></i>نبذة وروابط قانونية</div></div>
            <div className="card-body row g-3">
              <div className="col-md-12">
                <label className="form-label">نبذة عن الجمعية (About Us)</label>
                <textarea className="form-input" rows={4} value={f.about_us_text} onChange={up('about_us_text')} placeholder="أدخل النبذة التعريفية هنا لتظهر في التطبيق والموقع..."></textarea>
              </div>
              <div className="col-md-6">
                <label className="form-label">رابط سياسة الخصوصية (Privacy Policy)</label>
                <input className="form-input" value={f.privacy_policy_url} onChange={up('privacy_policy_url')} placeholder="https://..." dir="ltr" style={{textAlign:'left'}} />
              </div>
              <div className="col-md-6">
                <label className="form-label">رابط الشروط والأحكام (Terms of Service)</label>
                <input className="form-input" value={f.terms_url} onChange={up('terms_url')} placeholder="https://..." dir="ltr" style={{textAlign:'left'}} />
              </div>
            </div>
          </div>
        </div>
        
        {/* النسخ الاحتياطي وتصدير البيانات */}
        <div className="col-12">
          <div className="card">
            <div className="card-header"><div className="bold"><i className="bi bi-cloud-arrow-down me-2 text-primary"></i>النسخ الاحتياطي وتصدير البيانات</div></div>
            <div className="card-body">
              <p className="text-muted small mb-3">يمكنك أخذ نسخة احتياطية من جميع بيانات النظام (حالات، مستخدمين، تبرعات، سجلات) بصيغة JSON، أو تصدير بيانات المستخدمين بصيغة Excel.</p>
              <div className="d-flex flex-wrap gap-2">
                <button className="btn btn-outline-primary d-flex align-items-center gap-2" onClick={() => {
                  const data = { cases: cases||[], users: users||[], donations: donations||[], activityLogs: activityLogs||[] };
                  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = `Takaful_Backup_${new Date().toISOString().split('T')[0]}.json`;
                  a.click();
                  URL.revokeObjectURL(url);
                  showToast('success', 'نجاح', 'تم تجهيز النسخة الاحتياطية بنجاح');
                }}>
                  <i className="bi bi-database-down"></i> أخذ نسخة احتياطية كاملة (JSON)
                </button>
                <button className="btn btn-outline-success d-flex align-items-center gap-2" onClick={() => {
                  if(!users || !users.length) { showToast('error', 'تنبيه', 'لا توجد بيانات مستخدمين للتصدير'); return; }
                  const ws_data = users.map(u => ({
                    'رقم المستخدم': u.uid || u.id || '',
                    'الاسم': u.name || '—',
                    'البريد الإلكتروني': u.email || '—',
                    'رقم الهاتف': u.phone || '—',
                    'الدور': u.role === 'admin' ? 'مدير' : u.role === 'volunteer' ? 'متطوع' : u.role === 'donor' ? 'متبرع' : 'مستفيد',
                    'تاريخ التسجيل': u.createdAt?.toDate ? u.createdAt.toDate().toLocaleDateString('ar-SA') : '—'
                  }));
                  const ws = XLSX.utils.json_to_sheet(ws_data);
                  const wb = XLSX.utils.book_new();
                  XLSX.utils.book_append_sheet(wb, ws, "المستخدمين");
                  XLSX.writeFile(wb, `Users_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
                  showToast('success', 'نجاح', 'تم تصدير تقرير المستخدمين بنجاح');
                }}>
                  <i className="bi bi-file-earmark-person"></i> تصدير بيانات المستخدمين (Excel)
                </button>
              </div>
            </div>
          </div>
        </div>

        <div className="col-12 text-end">
          <button className="btn btn-primary px-4 py-2" onClick={save} disabled={saving} style={{fontSize:'1rem', borderRadius:'50px', boxShadow:'0 4px 15px rgba(16,185,129,0.3)'}}>
            {saving?<div className="spinner-border spinner-border-sm"></div>:<><i className="bi bi-check-lg me-2"></i>حفظ جميع إعدادات النظام</>}
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
