<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>توليد بيانات تحقق وهمية - تكافل</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; padding: 40px; text-align: center; background: #0f172a; color: #fff; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background: #10b981; color: white; font-weight: bold; }
    button:disabled { background: #64748b; cursor: not-allowed; }
    #log { margin-top: 30px; text-align: left; background: #1e293b; padding: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; direction: ltr; height: 300px; overflow-y: auto;}
  </style>
</head>
<body>
  <h1>توليد بيانات طلبات تحقق (Verifications) لاختبار لوحة التحكم</h1>
  <p>هذه الصفحة ستقوم بإنشاء مستفيدين ومتطوعين وهميين وطلبات تحقق لهم في قاعدة البيانات.</p>
  <button id="btn" onclick="generate()">إنشاء البيانات التجريبية</button>
  <div id="log"></div>

  <script type="module">
    import { db } from './web/firebase-config.js';
    import { doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';

    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    const DUMMY_DATA = [
      {
        uid: 'dummy-ben-1', name: 'أحمد محمود', email: 'ahmed.ben@example.com', role: 'beneficiary',
        docType: 'national_id', docNumber: '1122334455', docCountry: 'السودان', reason: 'أحتاج مساعدة مالية عاجلة للعملية',
        front: 'https://images.unsplash.com/photo-1633424619747-d5d1110091ba?auto=format&fit=crop&w=400&q=80'
      },
      {
        uid: 'dummy-vol-1', name: 'سارة خالد', email: 'sara.vol@example.com', role: 'volunteer',
        docType: 'passport', docNumber: 'P0987654', docCountry: 'السودان', reason: 'لدي خبرة في التمريض وأرغب في التطوع',
        front: 'https://images.unsplash.com/photo-1633424619747-d5d1110091ba?auto=format&fit=crop&w=400&q=80'
      },
      {
        uid: 'dummy-ben-2', name: 'عثمان علي', email: 'osman.ben@example.com', role: 'beneficiary',
        docType: 'driving_license', docNumber: 'DL123456', docCountry: 'الخرطوم', reason: 'مساعدة في ترميم المنزل بعد السيول',
        front: 'https://images.unsplash.com/photo-1633424619747-d5d1110091ba?auto=format&fit=crop&w=400&q=80'
      }
    ];

    window.generate = async () => {
      document.getElementById('btn').disabled = true;
      log('بدء إنشاء البيانات...');
      try {
        for (const d of DUMMY_DATA) {
          log(`\nإنشاء المستخدم: ${d.name} (${d.role})`);
          
          // 1. Create User
          await setDoc(doc(db, 'users', d.uid), {
            uid: d.uid,
            name: d.name,
            email: d.email,
            phone: '0900000000',
            role: d.role,
            status: 'pending_verification',
            isAvailable: false,
            createdAt: serverTimestamp()
          });
          log('✅ تم إنشاء سجل المستخدم');

          // 2. Create Verification Request
          await setDoc(doc(db, 'identity_verifications', d.uid), {
            uid: d.uid,
            name: d.name,
            email: d.email,
            role: d.role,
            docType: d.docType,
            docNumber: d.docNumber,
            docCountry: d.docCountry,
            reason: d.reason,
            docFrontURL: d.front,
            docBackURL: '',
            verificationStatus: 'pending',
            adminNote: '',
            submittedAt: serverTimestamp()
          });
          log('✅ تم إنشاء طلب التحقق');
        }
        log('\n🎉 تم الانتهاء بنجاح! يمكنك الآن فتح لوحة التحكم ورؤية الطلبات في قسم "التحقق من الهوية".');
      } catch (err) {
        log('\n❌ حدث خطأ: ' + err.message);
      }
      document.getElementById('btn').disabled = false;
    };
  </script>
</body>
</html>
