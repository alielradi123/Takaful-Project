<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="لوحة تحكم تكافل — إدارة الحالات الإنسانية والتبرعات">
  <title>تكافل — لوحة التحكم الذكية</title>
  <link rel="icon" type="image/webp" href="app-icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script type="importmap">
  {
    "imports": {
      "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18/jsx-dev-runtime"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root">
  <div class="d-flex align-items-center justify-content-center" style="min-height:100dvh;background:#07090f">
    <div class="text-center">
      <div class="spinner-border text-success" style="width:2.5rem;height:2.5rem" role="status"></div>
      <p class="mt-3 text-secondary" style="font-family:Tajawal,sans-serif">تحميل لوحة التحكم...</p>
    </div>
  </div>
</div>

<script type="text/babel" data-type="module">
import { auth, db } from './firebase-config.js';
import {
  collection, query, orderBy, onSnapshot,
  doc, updateDoc, deleteDoc, addDoc, setDoc, serverTimestamp, Timestamp,
  writeBatch, increment, getDocs
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';
import { requireAuth, getCurrentUserInfo, logout } from './auth.js';
import { showToast, showConfirm, formatDate, timeAgo } from './utils.js';
import { uploadMultipleToSupabase, deleteFromSupabase, getPathFromSupabaseUrl } from './supabase-config.js';

const { useState, useEffect, useRef, useCallback } = React;

// ─── HELPERS ───
const ini = (n='') => (n||'م').trim().split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'م';
const catBadge = cat => {
  if (cat === 'مالي' || cat === 'مالي قرض') return 'badge badge-beneficiary';
  if (cat === 'طبي' || cat === 'صحة') return 'badge badge-rejected';
  if (cat === 'عيني') return 'badge badge-completed';
  return 'badge badge-pending';
};
const STATUS = {
  pending:  {l:'معلق',   c:'badge badge-pending',dot:'#f9a825',i:'bi-clock-fill'},
  approved: {l:'معتمد',  c:'badge badge-approved',dot:'#66BB6A',i:'bi-check-circle-fill'},
  rejected: {l:'مرفوض', c:'badge badge-rejected',dot:'#ef5350',i:'bi-x-circle-fill'},
  completed:{l:'مكتمل', c:'badge badge-completed',dot:'#42a5f5',i:'bi-star-fill'},
};

// ─── AVATAR ───
const Av = ({name,size=34,r='50%',op=1}) => (
  <div className="avatar" style={{width:size,height:size,borderRadius:r,fontSize:`${size*.38}px`,opacity:op}}>{ini(name)}</div>
);

// ─── MODAL WRAPPER ───
function Modal({title, icon, onClose, children, footer}) {
  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="custom-modal">
        <div className="custom-modal-header">
          <h3 className="custom-modal-title"><i className={`bi ${icon} me-2`} style={{color:'var(--primary-light)'}}></i>{title}</h3>
          <button type="button" className="custom-modal-close" onClick={onClose}><i className="bi bi-x-lg"></i></button>
        </div>
        <div className="modal-body py-2">{children}</div>
        {footer && <div className="custom-modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

const Field = ({label, children}) => (
  <div className="form-group"><label className="form-label">{label}</label>{children}</div>
);

// ─── EMPTY STATE ───
const Empty = ({icon,title,sub}) => (
  <div className="empty-state">
    <i className={`bi ${icon} empty-state-icon`}></i>
    <h3>{title}</h3>
    {sub&&<p>{sub}</p>}
  </div>
);

// ══════════════════════════════════════════
// APP
// ══════════════════════════════════════════
function App() {
  const [page,setPage]     = useState('home');
  const [userInfo,setUserInfo] = useState({name:'تحميل...',email:''});
  const [cases,setCases]   = useState([]);
  const [donations,setDon] = useState([]);
  const [users,setUsers]   = useState([]);
  const [chats,setChats]   = useState([]);
  const [loading,setLoad]  = useState(true);
  const [shares,setShares] = useState([]);
  const [activeChatId,setChat] = useState(null);
  const [msgs,setMsgs]     = useState([]);
  const [msgIn,setMsgIn]   = useState('');
  const [clock,setClock]   = useState('');
  const [dark,setDark]     = useState(()=>(localStorage.getItem('tk-t')||'dark')==='dark');
  const [assignModal,setAssignModal] = useState(null);
  const [openNewCase,setOpenNewCase] = useState(false);
  const [verifications,setVerifications] = useState([]);
  const [activityLogs,setActivityLogs] = useState([]);
  const [sysSettings,setSysSettings] = useState(null);

  const logActivity = async (action, details) => {
    try {
      await addDoc(collection(db, 'activity_logs'), {
        action,
        details,
        adminName: userInfo.name || 'مجهول',
        adminUid: auth.currentUser?.uid || 'مجهول',
        timestamp: serverTimestamp()
      });
    } catch(err) { console.error('Failed to log activity:', err); }
  };

  useEffect(()=>{
    document.documentElement.setAttribute('data-bs-theme',dark?'dark':'light');
    localStorage.setItem('tk-t',dark?'dark':'light');
  },[dark]);

  useEffect(()=>{
    const unsub = requireAuth(async user=>{
      const info = await getCurrentUserInfo(user.uid);
      setUserInfo(info); setLoad(false);
    });
    const tick = setInterval(()=>setClock(
      new Intl.DateTimeFormat('ar-SA',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())
    ),1000);
    return ()=>{unsub&&unsub();clearInterval(tick)};
  },[]);

  useEffect(()=>{
    if(loading)return;
    const subs=[
      // cases: orderBy createdAt
      onSnapshot(query(collection(db,'cases'),orderBy('createdAt','desc')),s=>setCases(s.docs.map(d=>({id:d.id,...d.data()})))),
      // donations: try createdAt (actual field from donations.js)
onSnapshot(query(collection(db,'donations'),orderBy('createdAt','desc')),s=>setDon(s.docs.map(d=>({id:d.id, amountOrItem: d.data().amountOrItem ?? d.data().amount ?? d.data().amountOrItem, createdAt: d.data().createdAt, ...d.data()})))),
      onSnapshot(query(collection(db,'users'),orderBy('createdAt','desc')),s=>setUsers(s.docs.map(d=>({id:d.id,...d.data()})))),
      onSnapshot(query(collection(db,'chats'),orderBy('lastMessageTime','desc')),s=>{
        const all = s.docs.map(d=>({id:d.id,...d.data()}));
        // Deduplicate: keep only the latest chat per userId
        const seen = new Map();
        all.forEach(ch=>{
          if(!seen.has(ch.userId) || (ch.lastMessageTime?.seconds||0) > (seen.get(ch.userId).lastMessageTime?.seconds||0)){
            seen.set(ch.userId,ch);
          }
        });
        setChats([...seen.values()]);
      }),
      // shares listener
      onSnapshot(query(collection(db,'shares'),orderBy('timestamp','desc')),s=>setShares(s.docs.map(d=>({id:d.id,...d.data()})))),
      // identity verifications listener
      onSnapshot(query(collection(db,'identity_verifications'),orderBy('submittedAt','desc')),s=>setVerifications(s.docs.map(d=>({id:d.id,...d.data()})))),
      onSnapshot(query(collection(db,'activity_logs'),orderBy('timestamp','desc')),s=>setActivityLogs(s.docs.map(d=>({id:d.id,...d.data()})))),
      onSnapshot(doc(db,'settings','general'),d=>setSysSettings(d.exists()?d.data():{}))
    ];
    return ()=>subs.forEach(u=>u());
  },[loading]);

  useEffect(()=>{
    if(!activeChatId)return;
    const u=onSnapshot(query(collection(db,'chats',activeChatId,'messages'),orderBy('createdAt','asc')),s=>setMsgs(s.docs.map(d=>({id:d.id,...d.data()}))));
    return ()=>u();
  },[activeChatId]);

  const sendMsg = async e=>{
    e.preventDefault();
    if(!msgIn.trim()||!activeChatId)return;
    try{
      await addDoc(collection(db,'chats',activeChatId,'messages'),{text:msgIn.trim(),sender:'admin',senderName:userInfo.name,senderPhotoUrl:userInfo.photoURL||'',createdAt:serverTimestamp()});
      await updateDoc(doc(db,'chats',activeChatId),{lastMessage:msgIn.trim(),lastMessageTime:serverTimestamp()});
      setMsgIn('');
    }catch(e){showToast('error','خطأ',e.message)}
  };

  const doDelMsg = async (chatId, msgId) => {
    if(!await showConfirm('حذف رسالة','حذف هذه الرسالة نهائياً؟','🗑️'))return;
    try {
      await deleteDoc(doc(db,'chats',chatId,'messages',msgId));
      showToast('success','تم الحذف','تم حذف الرسالة بنجاح');
    } catch(e) { showToast('error','خطأ',e.message); }
  };
  const doEditMsg = async (chatId, msgId, newText) => {
    if(!newText || !newText.trim()) return;
    try {
      await updateDoc(doc(db,'chats',chatId,'messages',msgId),{text:newText.trim(), updatedAt:serverTimestamp()});
      showToast('success','تم التعديل','تم تعديل الرسالة بنجاح');
    } catch(e) { showToast('error','خطأ',e.message); }
  };

  const doDelChat = async (chatId, userName) => {
    if(!await showConfirm('حذف المحادثة',`حذف محادثة "${userName||'مستخدم'}" بالكامل؟ سيتم حذف جميع الرسائل نهائياً.`,'🗑️')) return;
    try {
      // Delete all messages first
      const msgsSnap = await getDocs(collection(db,'chats',chatId,'messages'));
      const delMsgs = msgsSnap.docs.map(d => deleteDoc(doc(db,'chats',chatId,'messages',d.id)));
      await Promise.all(delMsgs);
      // Delete the chat thread
      await deleteDoc(doc(db,'chats',chatId));
      if(activeChatId === chatId) setChat(null);
      logActivity('حذف محادثة', `تم حذف محادثة المستخدم: ${userName||'مستخدم'}`);
      showToast('success','تم الحذف','تم حذف المحادثة بنجاح');
    } catch(e) { showToast('error','خطأ',e.message); }
  };

  // ─ Case actions ─
  const doApprove = async(id,t)=>{if(!await showConfirm('موافقة',`الموافقة على "${t}"؟`,'✅'))return;try{await updateDoc(doc(db,'cases',id),{status:'approved',approvedAt:serverTimestamp()});logActivity('موافقة على حالة', `تمت الموافقة على حالة: ${t}`);showToast('success','تمت الموافقة',`"${t}" معتمدة`)}catch(e){showToast('error','خطأ',e.message)}};
  const doReject  = async(id,t)=>{if(!await showConfirm('رفض',`رفض "${t}"؟`,'❌'))return;try{await updateDoc(doc(db,'cases',id),{status:'rejected',rejectedAt:serverTimestamp()});logActivity('رفض حالة', `تم رفض حالة: ${t}`);showToast('warning','مرفوضة',`"${t}" مرفوضة`)}catch(e){showToast('error','خطأ',e.message)}};
  const doComplete= async(id,t)=>{if(!await showConfirm('إتمام',`تعيين "${t}" كمكتملة؟`,'🏁'))return;try{await updateDoc(doc(db,'cases',id),{status:'completed',completedAt:serverTimestamp()});logActivity('إكمال حالة', `تم اكتمال حالة: ${t}`);showToast('success','مكتملة',`"${t}" مكتملة`)}catch(e){showToast('error','خطأ',e.message)}};
  const doDelCase = async(id,t)=>{if(!await showConfirm('حذف الحالة',`حذف "${t}" نهائياً؟`,'🗑️'))return;try{await deleteDoc(doc(db,'cases',id));logActivity('حذف حالة', `تم حذف حالة: ${t}`);showToast('success','تم الحذف',`تم حذف "${t}"`)}catch(e){showToast('error','خطأ',e.message)}};
  const doUpdateRaisedAmount = async(id,t,curr)=>{
    const val = window.prompt(`تحديث المبلغ المُجمّع لحالة "${t}":`, curr);
    if (val === null) return;
    const parsed = parseFloat(val);
    if (isNaN(parsed) || parsed < 0) {
      showToast('error', 'خطأ', 'يرجى إدخال مبلغ صحيح');
      return;
    }
    try {
      const target = cases.find(c => c.id === id);
      const limit = target ? (target.targetAmount || target.amountRequired || 0) : 0;
      const progress = limit > 0 ? Math.min(parsed / limit, 1.0) : 0;
      await updateDoc(doc(db, 'cases', id), {
        raisedAmount: parsed,
        amountRaised: parsed,
        progress: progress,
        updatedAt: serverTimestamp()
      });
      logActivity('تحديث مبلغ مجمع', `تم تحديث المبلغ للحالة ${t} إلى ${parsed}`);
      showToast('success', 'تم التحديث', 'تم تحديث المبلغ المُجمّع بنجاح');
    } catch(e) { showToast('error', 'خطأ', e.message); }
  };
  // Donation actions
  const doDelDon = async(donation)=>{
    if(!await showConfirm('حذف التبرع',`حذف تبرع "${donation.donorName||donation.caseTitle||'مجهول'}" نهائياً؟`,'🗑️'))return;
    try {
      await deleteDoc(doc(db,'donations',donation.id));
      
      if(donation.status === 'تم التوزيع' && donation.caseId) {
        const amount = donation.amount || parseFloat((donation.amountOrItem||'').replace(/[^0-9.]/g,''))||0;
        if(amount > 0) {
          try {
            await updateDoc(doc(db,'cases',donation.caseId),{
              raisedAmount: increment(-amount),
              amountRaised: increment(-amount)
            });
          } catch(err) {
            console.warn('Could not update case amount:', err);
          }
        }
      }
      logActivity('حذف تبرع', `تم حذف تبرع يخص: ${donation.donorName||donation.caseTitle||'مجهول'}`);
      showToast('success','تم الحذف','تم حذف التبرع بنجاح');
    } catch(e) { showToast('error','خطأ',e.message); }
  };
  const doDonStat = async(id,status)=>{try{await updateDoc(doc(db,'donations',id),{status,updatedAt:serverTimestamp()});logActivity('تحديث تبرع', `تم تحديث حالة تبرع إلى: ${status}`);showToast('success','تحديث','تم تحديث حالة التبرع')}catch(e){showToast('error','خطأ',e.message)}};

  // تأكيد الاستلام — يكتب receivedAt حقيقي في Firebase
  const doConfirmReceived = async(id, donorName)=>{
    if(!await showConfirm('تأكيد الاستلام', `تأكيد استلام تبرع "${donorName||'مجهول'}"؟`, '💜'))return;
    try {
      await updateDoc(doc(db,'donations',id),{
        status: 'تم الاستلام',
        receivedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      logActivity('تأكيد استلام', `تم تأكيد استلام تبرع من: ${donorName||'مجهول'}`);
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#42A5F5', '#66BB6A', '#F9A825'] });
      showToast('success','تم الاستلام ✓', `تم تأكيد استلام تبرع "${donorName||'مجهول'}"`);
    } catch(e) { showToast('error','خطأ',e.message); }
  };

  // تأكيد التوزيع — يكتب distributedAt ويحدّث raisedAmount في الحالة
  const doConfirmDistributed = async(donation)=>{
    if(!await showConfirm('تأكيد التوزيع', `تأكيد توزيع تبرع "${donation.donorName||'مجهول'}" على المستفيد؟`, '✅'))return;
    try {
      const batch = writeBatch(db);
      batch.update(doc(db,'donations',donation.id),{
        status: 'تم التوزيع',
        distributedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      const amount = donation.amount || parseFloat((donation.amountOrItem||'').replace(/[^0-9.]/g,''))||0;
      if(donation.caseId && amount > 0) {
        batch.update(doc(db,'cases',donation.caseId),{
          raisedAmount: increment(amount),
          amountRaised: increment(amount),
          updatedAt: serverTimestamp()
        });
      }
      await batch.commit();
      logActivity('تأكيد توزيع', `تم توزيع تبرع من: ${donation.donorName||'مجهول'}`);
      confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: ['#66BB6A', '#FFF', '#2E7D32'] });
      showToast('success','تم التوزيع ✅', 'تم التوزيع وتحديث تقدم الحالة');
    } catch(e) { showToast('error','خطأ',e.message); }
  };

  // User actions
  const doDelLog = async(id) => {
    if(!await showConfirm('حذف السجل','هل أنت متأكد من حذف هذا السجل نهائياً؟','🗑️')) return;
    try {
      await deleteDoc(doc(db,'activity_logs',id));
      showToast('success','تم الحذف','تم حذف السجل بنجاح');
    } catch(e) { showToast('error','خطأ',e.message); }
  };
  const doClearLogs = async() => {
    if(activityLogs.length === 0) return;
    if(!await showConfirm('مسح السجل بالكامل','هل أنت متأكد من مسح جميع سجلات العمليات؟ لا يمكن التراجع عن هذا الإجراء!','⚠️')) return;
    try {
      const batch = writeBatch(db);
      activityLogs.forEach(log => {
        batch.delete(doc(db,'activity_logs',log.id));
      });
      await batch.commit();
      showToast('success','تم المسح','تم مسح السجل بالكامل بنجاح');
    } catch(e) { showToast('error','خطأ',e.message); }
  };

  const doToggle  = async(id,stat,name,role)=>{if(role==='admin'){showToast('error','غير مسموح','لا يمكن تعليق حساب مدير');return;}const ns=stat==='active'?'suspended':'active';if(!await showConfirm(ns==='suspended'?'تعليق':'تفعيل',`${ns==='suspended'?'تعليق':'تفعيل'} حساب "${name}"؟`,ns==='suspended'?'🔒':'🔓'))return;try{await updateDoc(doc(db,'users',id),{status:ns});logActivity('تحديث حالة مستخدم', `تم ${ns==='suspended'?'تعليق':'تفعيل'} حساب: ${name}`);showToast('success','تم',`${ns==='suspended'?'تم تعليق':'تم تفعيل'} "${name}"`)}catch(e){showToast('error','خطأ',e.message)}};
  const doDelUser = async(id,name,role)=>{if(role==='admin'){showToast('error','غير مسموح','لا يمكن حذف حساب مدير');return;}if(!await showConfirm('حذف المستخدم',`حذف "${name}" نهائياً؟`,'🗑️'))return;try{await deleteDoc(doc(db,'users',id));logActivity('حذف مستخدم', `تم حذف المستخدم: ${name}`);showToast('success','تم الحذف',`تم حذف "${name}"`)}catch(e){showToast('error','خطأ',e.message)}};
  const doChangeRole = async(id,name,newRole)=>{try{await updateDoc(doc(db,'users',id),{role:newRole, accountType:newRole, updatedAt:serverTimestamp()});logActivity('تحديث دور مستخدم', `تم تغيير دور ${name} إلى ${newRole}`);showToast('success','تم التحديث',`تم تغيير دور "${name}"`)}catch(e){showToast('error','خطأ',e.message)}};
  const doDelVerification = async(id,name)=>{if(!await showConfirm('حذف طلب التحقق',`حذف طلب تحقق "${name}" نهائياً؟`,'🗑️'))return;try{await deleteDoc(doc(db,'identity_verifications',id));logActivity('حذف طلب تحقق', `تم حذف طلب تحقق: ${name}`);showToast('success','تم الحذف',`تم حذف الطلب "${name}"`)}catch(e){showToast('error','خطأ',e.message)}};
  if(loading)return(
    <div className="d-flex align-items-center justify-content-center" style={{minHeight:'100dvh',background:'var(--bg-dark)'}}>
      <div className="text-center">
        <div className="spinner-border text-success mb-3" style={{width:'2.5rem',height:'2.5rem'}}></div>
        <p style={{color:'var(--text-secondary)',fontFamily:'inherit'}}>جارٍ التحقق...</p>
      </div>
    </div>
  );

  const pending  = cases.filter(c=>c.status==='pending');
  const approved = cases.filter(c=>c.status==='approved');
  const totalAmt = donations.reduce((s,d)=>s+(parseFloat((d.amountOrItem||'').replace(/[^0-9.]/g,''))||0),0);

  const NAV_GROUPS={'main':'الرئيسية','data':'إدارة البيانات','analytics':'التحليلات والتقارير','system':'إعدادات النظام'};
  const NAV=[
    {id:'home',l:'الرئيسية',icon:'bi-grid-1x2-fill',g:'main'},
    {id:'pending',l:'الحالات المعلقة',icon:'bi-hourglass-split',g:'main',badge:pending.length},
    {id:'cases',l:'جميع الحالات',icon:'bi-journal-medical',g:'main'},
    {id:'donations',l:'التبرعات',icon:'bi-heart-fill',g:'data'},
    {id:'users',l:'المستخدمون',icon:'bi-people-fill',g:'data'},
    {id:'verifications',l:'التحقق من الهوية',icon:'bi-shield-check',g:'data',badge:verifications.filter(v=>v.verificationStatus==='pending').length},
    {id:'chats',l:'الدعم',icon:'bi-chat-dots-fill',g:'data'},
    {id:'reports',l:'التقارير المالية',icon:'bi-bar-chart-fill',g:'analytics'},

            >
              <span style={{width:28,height:28,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:dark?'transparent':'#F9A825',transition:'all 0.35s ease',fontSize:14,boxShadow:dark?'none':'0 2px 8px rgba(249,168,37,0.5)'}}>☀️</span>
              <span style={{width:28,height:28,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:dark?'rgba(99,102,241,0.85)':'transparent',transition:'all 0.35s ease',fontSize:14,boxShadow:dark?'0 2px 8px rgba(99,102,241,0.5)':'none'}}>🌙</span>
            </button>
          </div>
        </header>
        <main className="page-content">
          {page==='home'      && <HomeView cases={cases} donations={donations} users={users} totalAmt={totalAmt} pending={pending} approved={approved} doApprove={doApprove} doReject={doReject} />}
          {page==='pending'   && <PendingView cases={pending} doApprove={doApprove} doReject={doReject} doDelCase={doDelCase} />}
          {page==='cases'     && <CasesView cases={cases} users={users} doApprove={doApprove} doReject={doReject} doComplete={doComplete} doDelCase={doDelCase} doUpdateRaisedAmount={doUpdateRaisedAmount} setAssignModal={setAssignModal} openNewCase={openNewCase} setOpenNewCase={setOpenNewCase} />}
          {page==='donations' && <DonationsView donations={donations} cases={cases} users={users} doDonStat={doDonStat} doDelDon={doDelDon} doConfirmReceived={doConfirmReceived} doConfirmDistributed={doConfirmDistributed} />}
          {page==='users'     && <UsersView users={users} doToggle={doToggle} doDelUser={doDelUser} doChangeRole={doChangeRole} />}
          {page==='verifications' && <VerificationsView verifications={verifications} doDelVerification={doDelVerification} />}
          {page==='chats'     && <ChatsView chats={chats} msgs={msgs} activeChatId={activeChatId} setChat={setChat} sendMsg={sendMsg} msgIn={msgIn} setMsgIn={setMsgIn} userInfo={userInfo} users={users} doDelMsg={doDelMsg} doEditMsg={doEditMsg} doDelChat={doDelChat} />}
          {page==='reports'   && <ReportsView donations={donations} cases={cases} users={users} />}
          {page==='shares'    && <SharesView shares={shares} cases={cases} />}
          {page==='activity'  && <ActivityView logs={activityLogs} doDelLog={doDelLog} doClearLogs={doClearLogs} />}
          {page==='settings'  && <SettingsView sysSettings={sysSettings} logActivity={logActivity} cases={cases} users={users} donations={donations} activityLogs={activityLogs} />}
        </main>
      </div>

      {/* VOLUNTEER ASSIGN MODAL */}
      {assignModal && <AssignVolunteerModal caseItem={assignModal} users={users} onClose={()=>setAssignModal(null)} />}
    </div>
  );
}

// HOME VIEW
// ══════════════════════════════════════════
function HomeView({cases,donations,pending,approved,totalAmt,users,doApprove,doReject}) {
  const completed=cases.filter(c=>c.status==='completed');
  const rejected =cases.filter(c=>c.status==='rejected');
  const STATS=[
    {l:'الحالات الكلية',v:cases.length,   sub:`${approved.length} معتمدة`,  icon:'bi-journal-medical',c:'stat-green'},
    {l:'حالات معلقة',   v:pending.length,  sub:'تحتاج مراجعة',              icon:'bi-hourglass-split', c:'stat-gold'},
    {l:'المستخدمون',    v:users.length,    sub:'مسجّل في النظام',           icon:'bi-people-fill',     c:'stat-blue'},
    {l:'إجمالي التبرعات',v:`${totalAmt.toLocaleString('ar')} ج.س`,sub:`${donations.length} عملية`,icon:'bi-heart-fill',c:'stat-red'},
  ];
  return (
    <div>
      <div className="stats-grid">
        {STATS.map((s,i)=>(
          <div className={`stat-card ${s.c}`} key={i}>
            <div className="stat-icon"><i className={`bi ${s.icon}`}></i></div>
            <div>
              <div className="stat-value">{s.v}</div>
              <div className="stat-label">{s.l}</div>
              <div className="stat-trend" style={{opacity:0.75}}>{s.sub}</div>
            </div>
          </div>
        ))}
      </div>
      <div className="row g-3">
        <div className="col-xl-7">
          <div className="card h-100">
            <div className="card-header">
              <div className="card-title">
                <i className="bi bi-hourglass-split card-title-icon" style={{color:'var(--gold)'}}></i>
                <div>
                  <div className="bold">أحدث الحالات المعلقة</div>
                  <div className="text-muted text-xs">في انتظار مراجعتك</div>
                </div>
              </div>
              <span className="badge badge-pending">{pending.length} حالة</span>
            </div>
            <div className="card-body p-0">
              {pending.length===0
                ? <Empty icon="bi-check-all" title="لا توجد حالات معلقة" sub="أُنجزت جميع المراجعات!" />
                : pending.slice(0,5).map(c=>(
                  <div key={c.id} className="d-flex align-items-center gap-3 px-4 py-3" style={{borderBottom:'1px solid var(--border)'}}>
                    <Av name={c.applicantName} size={32} />
                    <div style={{flex:1,minWidth:0}}>
                      <div className="bold truncate" style={{fontSize:'14px'}}>{c.applicantName||c.title||'غير محدد'}</div>
                      <div className="text-muted text-xs truncate">{c.title||'—'} • {c.location||c.city||''}</div>
                    </div>
                    <span className={catBadge(c.category)}>{c.category}</span>
                    <div className="d-flex gap-2">
                      <button className="btn btn-icon btn-approve btn-sm" onClick={()=>doApprove(c.id,c.title||c.applicantName)} title="موافقة"><i className="bi bi-check-lg"></i></button>
                      <button className="btn btn-icon btn-reject btn-sm" onClick={()=>doReject(c.id,c.title||c.applicantName)} title="رفض"><i className="bi bi-x-lg"></i></button>
                    </div>
                  </div>
                ))
              }
            </div>
          </div>
        </div>
        <div className="col-xl-5">
          <div className="card h-100">
            <div className="card-header">
              <div className="card-title">
                <i className="bi bi-pie-chart-fill card-title-icon" style={{color:'var(--primary)'}}></i>
                <div className="bold">ملخص الحالات</div>
              </div>
            </div>
            <div className="card-body">
              {[
                {l:'معلقة',  v:pending.length,   c:'var(--gold)',i:'bi-hourglass-split'},
                {l:'معتمدة', v:approved.length,  c:'var(--primary-light)',i:'bi-check-circle-fill'},
                {l:'مكتملة', v:completed.length, c:'var(--blue-light)',i:'bi-star-fill'},
                {l:'مرفوضة', v:rejected.length,  c:'var(--red-light)',i:'bi-x-circle-fill'},
              ].map((it,i)=>(
                <div key={i} className="mb-3">
                  <div className="d-flex justify-content-between align-items-center mb-1">
                    <div className="d-flex align-items-center gap-2 bold text-sm">
                      <i className={`bi ${it.i}`} style={{color:it.c}}></i>{it.l}
                    </div>
                    <span className="text-muted text-xs bold">{it.v}</span>
                  </div>
                  <div className="progress-bar">
                    <div className="progress-fill" style={{width:`${cases.length?Math.round(it.v/cases.length*100):0}%`,background:it.c}}></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// CASE FORM MODAL
// ══════════════════════════════════════════
function CaseModal({init, onClose}) {
  const isEdit=!!init?.id;
  const [f,setF]=useState({
    title:init?.title||'',applicantName:init?.applicantName||'',
    location:init?.location||'',category:init?.category||'مالي',
    urgencyLevel:init?.urgencyLevel||'عادي',amountRequired:init?.amountRequired||init?.targetAmount||'',
    description:init?.description||init?.story||'',status:init?.status||'pending',
    imageUrls:init?.imageUrls||init?.imageUrl?[init.imageUrl]:[]
  });
  const [saving,setSaving]=useState(false);
  const [files,setFiles]=useState([]);
  const [previews,setPreviews]=useState([]);
  const up=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  
  const upFile=e=>{
    const newFiles=Array.from(e.target.files);
    setFiles(p=>[...p,...newFiles]);
    newFiles.forEach(f=>{
      const r=new FileReader();
      r.onload=ev=>setPreviews(p=>[...p,{url:ev.target.result,name:f.name}]);
      r.readAsDataURL(f);
    });
  };
  
  const removeImage=(idx)=>{
    setF(p=>({...p,imageUrls:p.imageUrls.filter((_,i)=>i!==idx)}));
  };
  
  const removePreview=(idx)=>{
    setFiles(p=>p.filter((_,i)=>i!==idx));
    setPreviews(p=>p.filter((_,i)=>i!==idx));
  };
  
  const save=async()=>{
    if(!f.title.trim()||!f.applicantName.trim()){showToast('error','بيانات ناقصة','عنوان الحالة واسم مقدم الطلب مطلوبان');return}
    setSaving(true);
    try{
      let urls=[...f.imageUrls];
      
      // ─── رفع الصور الجديدة إلى Supabase Storage ───
      if (files.length > 0) {
        // نحتاج إلى معرف الوثيقة مسبقاً لبناء المسار
        const tmpId = isEdit ? init.id : doc(collection(db,'cases')).id;
        const uploadedUrls = await uploadMultipleToSupabase(files, 'case_documents', tmpId);
        urls = [...urls, ...uploadedUrls];
      }
      
      const amt = parseFloat(f.amountRequired)||0;
      
      if(isEdit){
        const data={
          title:f.title, applicantName:f.applicantName,
          location:f.location, category:f.category,
          urgencyLevel:f.urgencyLevel,
          amountRequired: amt,
          targetAmount: amt,
          description:f.description, status:f.status,
          imageUrls: urls,
          imageUrl: urls[0]||'',
          documentUrl: urls[0]||'',
          updatedAt:serverTimestamp()
        };
        await updateDoc(doc(db,'cases',init.id),data);
        showToast('success','تم التعديل','تم تحديث بيانات الحالة وصورها في Supabase ✓');
      } else {
        const newDocRef = doc(collection(db,'cases'));
        const newDocId = newDocRef.id;
        const data={
          id: newDocId,
          caseId: newDocId,
          beneficiaryId: auth.currentUser?.uid || '',
          createdBy: auth.currentUser?.uid || '',
          assignedVolunteerId: '',
          volunteerReport: '',
          title:f.title, applicantName:f.applicantName,
          location:f.location, category:f.category,
          urgencyLevel:f.urgencyLevel,
          amountRequired: amt,
          targetAmount: amt,
          description:f.description, status:f.status,
          imageUrls: urls,
          imageUrl: urls[0]||'',
          documentUrl: urls[0]||'',
          raisedAmount: 0,
          amountRaised: 0,
          progress: 0,
          createdAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        };
        await setDoc(newDocRef, data);
        showToast('success','تمت الإضافة','تم تسجيل الحالة وصورها في Supabase ✓');
      }
      onClose();
    }catch(e){showToast('error','خطأ في رفع الصور',e.message)}finally{setSaving(false)}
  };

  return (
    <Modal title={isEdit?'تعديل الحالة':'إضافة حالة جديدة'} icon={isEdit?'bi-pencil-fill':'bi-plus-circle-fill'} onClose={onClose}
      footer={<>
        <button type="button" className="btn btn-outline" onClick={onClose}>إلغاء</button>
        <button type="button" className="btn btn-primary" onClick={save} disabled={saving}>
          {saving?<><div className="spinner-border spinner-border-sm me-1"></div>جارٍ الحفظ...</>:<><i className="bi bi-check-lg"></i>{isEdit?'حفظ التعديلات':'إضافة الحالة'}</>}
        </button>
      </>}>
      <div className="row g-3">
        <div className="col-12"><Field label="عنوان الحالة *"><input className="form-input" value={f.title} onChange={up('title')} placeholder="عنوان وصفي للحالة" /></Field></div>
        <div className="col-md-6"><Field label="اسم مقدم الطلب *"><input className="form-input" value={f.applicantName} onChange={up('applicantName')} placeholder="الاسم الكامل" /></Field></div>
        <div className="col-md-6"><Field label="الموقع"><input className="form-input" value={f.location} onChange={up('location')} placeholder="المدينة / المنطقة" /></Field></div>
        <div className="col-md-4"><Field label="الفئة"><select className="form-input" value={f.category} onChange={up('category')}><option>مالي</option><option>عيني</option><option>طبي</option><option>صحة</option></select></Field></div>
        <div className="col-md-4"><Field label="درجة الإلحاح"><select className="form-input" value={f.urgencyLevel} onChange={up('urgencyLevel')}><option>عادي</option><option>متوسط</option><option>عاجل</option></select></Field></div>
        <div className="col-md-4"><Field label="المبلغ المطلوب"><input className="form-input" type="number" value={f.amountRequired} onChange={up('amountRequired')} placeholder="0" /></Field></div>
        {isEdit&&<div className="col-md-6"><Field label="الحالة"><select className="form-input" value={f.status} onChange={up('status')}><option value="pending">معلق</option><option value="approved">معتمد</option><option value="rejected">مرفوض</option><option value="completed">مكتمل</option></select></Field></div>}
        
        <div className="col-12">
          <Field label="صور الحالة (يمكن اختيار عدة صور)">
            <input className="form-input" type="file" accept="image/*" multiple onChange={upFile} />
            <small className="text-muted d-block mt-1">💡 يمكنك تحميل عدة صور لتأكيد الحالة</small>
          </Field>
        </div>
        
        {(f.imageUrls.length > 0 || previews.length > 0) && (
          <div className="col-12">
            <Field label={`الصور المرفقة (${f.imageUrls.length + previews.length})`}>
              <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(100px, 1fr))', gap:'10px'}}>
                {f.imageUrls.map((url, idx) => (
                  <div key={`old-${idx}`} style={{position:'relative', borderRadius:8, overflow:'hidden', border:'1px solid var(--border)'}}>
                    <img src={url} alt="صورة" style={{width:'100%', height:100, objectFit:'cover'}} />
                    <button type="button" className="btn btn-sm btn-reject" onClick={() => removeImage(idx)} style={{position:'absolute', top:0, left:0, borderRadius:0, width:'100%', height:'100%', opacity:0, transition:'opacity 0.2s'}} onMouseEnter={e=>e.target.style.opacity=1} onMouseLeave={e=>e.target.style.opacity=0}>
                      <i className="bi bi-trash3"></i>
                    </button>
                  </div>
                ))}
                {previews.map((prev, idx) => (
                  <div key={`new-${idx}`} style={{position:'relative', borderRadius:8, overflow:'hidden', border:'2px dashed var(--primary-light)'}}>
                    <img src={prev.url} alt="معاينة" style={{width:'100%', height:100, objectFit:'cover', opacity:0.8}} />
                    <button type="button" className="btn btn-sm btn-reject" onClick={() => removePreview(idx)} style={{position:'absolute', top:0, left:0, borderRadius:0, width:'100%', height:'100%', opacity:0, transition:'opacity 0.2s'}} onMouseEnter={e=>e.target.style.opacity=1} onMouseLeave={e=>e.target.style.opacity=0}>
                      <i className="bi bi-trash3"></i>
                    </button>
                  </div>
                ))}
              </div>
            </Field>
          </div>
        )}
        
        <div className="col-12"><Field label="وصف الحالة"><textarea className="form-input" rows={4} value={f.description} onChange={up('description')} placeholder="تفاصيل الحالة وقصة المستفيد..." style={{resize:'vertical'}} /></Field></div>
      </div>
    </Modal>
  );
}

function PendingView({cases, doApprove, doReject, doDelCase}) {
  const [modal,setModal] = useState(null);
  return (
    <div>
      {modal&&<CaseModal init={modal==='new'?null:modal} onClose={()=>setModal(null)} />}
      <div className="d-flex align-items-center justify-content-between mb-4">
        <div className="d-flex align-items-center gap-3">
          <div className="stat-icon" style={{background:'rgba(249,168,37,0.15)',color:'var(--gold)',width:40,height:40,borderRadius:12,fontSize:'1.1rem'}}><i className="bi bi-hourglass-split"></i></div>
          <div>
            <div className="bold" style={{fontSize:'.87rem'}}>الحالات المعلقة</div>
            <div style={{fontSize:'.65rem',color:'var(--text-secondary)'}}>{cases.length} حالة تنتظر المراجعة</div>
          </div>
        </div>
        <button className="btn btn-primary" onClick={()=>setModal('new')}><i className="bi bi-plus-lg"></i>إضافة حالة</button>
      </div>
      {cases.length===0
        ?<div className="card"><Empty icon="bi-check-all" title="لا توجد حالات معلقة" sub="تمت مراجعة جميع الحالات!" /></div>
        :<div className="cases-grid">
          {cases.map(c=>(
            <div className={`case-card ${c.status}`} key={c.id}>
              <div className="case-card-header">
                <div className="d-flex align-items-center gap-2">
                  <Av name={c.applicantName} size={32} />
                  <div>
                    <div className="bold" style={{fontSize:'.78rem'}}>{c.applicantName}</div>
                    <div style={{fontSize:'.61rem',color:'var(--text-secondary)'}}>{c.location||c.city||'غير محدد'}</div>
                  </div>
                </div>
                <span className={catBadge(c.category)}>{c.category}</span>
              </div>
              <h3 className="case-title">{c.title||'بدون عنوان'}</h3>
              <div className="case-story">{c.description||c.story}</div>
              {(c.imageUrls && c.imageUrls.length > 0) && (
                <div className="mb-3">
                  {c.imageUrls.length === 1 ? (
                    <img src={c.imageUrls[0]} alt="الحالة" style={{width:'100%', height:140, objectFit:'cover', borderRadius:'var(--radius-sm)', border:'1px solid var(--border)'}} />
                  ) : (
                    <div style={{display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:'8px'}}>
                      {c.imageUrls.slice(0,4).map((img, i) => (
                        <img key={i} src={img} alt="الحالة" style={{width:'100%', height:80, objectFit:'cover', borderRadius:'var(--radius-sm)', border:'1px solid var(--border)'}} />
                      ))}
                      {c.imageUrls.length > 4 && (
                        <div style={{gridColumn:'1 / -1', padding:'8px', background:'rgba(249,168,37,0.1)', borderRadius:'var(--radius-sm)', textAlign:'center', fontSize:'.75rem', color:'var(--gold)'}}>
                          +{c.imageUrls.length - 4} صور إضافية
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
              {(!c.imageUrls || c.imageUrls.length === 0) && (c.imageUrl||c.documentUrl) && (
                <div className="mb-3">
                  {String(c.imageUrl||c.documentUrl).match(/\.(jpeg|jpg|gif|png|webp|bmp)(?:\?.*)?$/i) ? (
                    <img src={c.imageUrl||c.documentUrl} alt="المرفق" style={{width:'100%', height:140, objectFit:'cover', borderRadius:'var(--radius-sm)', border:'1px solid var(--border)'}} />

                    <a href={c.imageUrl||c.documentUrl} target="_blank" className="btn btn-outline btn-sm w-100 justify-content-center" style={{padding:'6px'}}><i className="bi bi-file-earmark-text"></i> المستند المرفق</a>
                  )}
                </div>
              )}
              {c.amountRequired&&<div className="d-flex align-items-center gap-2 p-2 rounded-3 mb-3" style={{background:'rgba(249,168,37,0.06)',border:'1px solid rgba(249,168,37,0.12)'}}><i className="bi bi-cash-coin" style={{color:'var(--gold)'}}></i><span style={{fontSize:'.73rem',fontWeight:700,color:'var(--gold)'}}>{Number(c.amountRequired).toLocaleString('ar')} ج.س</span></div>}
              <div className="case-actions">
                <button className="btn btn-approve btn-sm flex-fill justify-content-center" onClick={()=>doApprove(c.id,c.title)}><i className="bi bi-check-lg"></i>موافقة</button>
                <button className="btn btn-reject btn-sm flex-fill justify-content-center" onClick={()=>doReject(c.id,c.title)}><i className="bi bi-x-lg"></i>رفض</button>
                <button className="btn btn-outline btn-icon btn-sm" onClick={()=>setModal(c)} title="تعديل"><i className="bi bi-pencil"></i></button>
                <button className="btn btn-reject btn-icon btn-sm" onClick={()=>doDelCase(c.id,c.title)} title="حذف"><i className="bi bi-trash3"></i></button>
              </div>
            </div>
          ))}
        </div>
      }
    </div>
  );
}

// CASES VIEW
// ══════════════════════════════════════════
function CasesView({cases, users, doApprove, doReject, doComplete, doDelCase, doUpdateRaisedAmount, setAssignModal, openNewCase, setOpenNewCase}) {
  const [q,setQ]=useState(''); const [st,setSt]=useState('all'); const [cat,setCat]=useState('all');
  const [modal,setModal]=useState(null); const [detail,setDetail]=useState(null);
  useEffect(() => {
    if (openNewCase) {
      setModal('new');
      setOpenNewCase(false);
    }
  }, [openNewCase, setOpenNewCase]);
  const filt=cases.filter(c=>{
    const mq=!q||[c.applicantName,c.title,c.location,c.city].join(' ').toLowerCase().includes(q.toLowerCase());
    return mq&&(st==='all'||c.status===st)&&(cat==='all'||c.category===cat);
  });
  const pct=c=>Math.round((c.raisedAmount||c.amountRaised||0)/(c.targetAmount||c.amountRequired||1)*100);
  const getAssignedVol = (volId) => {
    if(!volId) return null;
    return users.find(u => u.id === volId || u.uid === volId);
  };
  return (
    <div>
      {modal&&<CaseModal init={modal==='new'?null:modal} onClose={()=>setModal(null)} />}
      {detail&&(
        <Modal title="تفاصيل الحالة" icon="bi-journal-medical" onClose={()=>setDetail(null)}
          footer={<><button className="btn btn-outline" onClick={()=>setDetail(null)}>إغلاق</button>{detail.status==='pending'&&<><button className="btn btn-reject" onClick={()=>{doReject(detail.id,detail.title);setDetail(null)}}><i className="bi bi-x-lg"></i>رفض</button><button className="btn btn-approve" onClick={()=>{doApprove(detail.id,detail.title);setDetail(null)}}><i className="bi bi-check-lg"></i>موافقة</button></>}</>}>
          <div className="row g-3">
            <div className="col-md-6"><div className="modal-label">مقدم الطلب</div><div className="bold">{detail.applicantName||'—'}</div></div>
            <div className="col-md-6"><div className="modal-label">الموقع</div><div>{detail.location||detail.city||'—'}</div></div>
            <div className="col-md-6"><div className="modal-label">الفئة</div><span className={catBadge(detail.category)}>{detail.category}</span></div>
            <div className="col-md-6"><div className="modal-label">الحالة</div><span className={(STATUS[detail.status]||STATUS.pending).c}>{(STATUS[detail.status]||STATUS.pending).l}</span></div>
            <div className="col-md-6"><div className="modal-label">المبلغ المطلوب</div><div className="bold" style={{color:'var(--gold)'}}>{Number(detail.targetAmount||detail.amountRequired||0).toLocaleString('ar')} ج.س</div></div>
            <div className="col-md-6"><div className="modal-label">تم جمعه</div><div className="bold" style={{color:'var(--primary-light)'}}>{Number(detail.raisedAmount||detail.amountRaised||0).toLocaleString('ar')} ج.س</div></div>
            <div className="col-12">
              <div className="modal-label">التقدم ({pct(detail)}%)</div>
              <div className="progress-bar" style={{height:12,marginTop:6,borderRadius:10,boxShadow:'inset 0 2px 4px rgba(0,0,0,0.2)'}}>
                <div className="progress-fill" style={{width:`${Math.min(pct(detail), 100)}%`, background:'linear-gradient(90deg, #43A047, #66BB6A)', position:'relative', overflow:'hidden'}}>
                  <div style={{position:'absolute', top:0, left:0, bottom:0, right:0, background:'linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent)', transform:'skewX(-20deg)', animation:'shimmer 2s infinite'}} />
                </div>
              </div>
            </div>
            <div className="col-12">
              <div className="modal-label">المتطوع المعين</div>
              <div className="form-input" style={{background:'rgba(255,255,255,0.03)'}}>
                {getAssignedVol(detail.assignedVolunteerId) ? (
                  <span>
                    <i className="bi bi-person-check-fill me-1" style={{color:'var(--primary-light)'}}></i>
                    {getAssignedVol(detail.assignedVolunteerId).name} ({getAssignedVol(detail.assignedVolunteerId).email})

            </div>
            {(detail.volunteerReport || detail.volunteerNotes) && (
              <div className="col-12">
                <div className="modal-label">تقرير الملاحظات من المتطوع</div>

                  <i className="bi bi-chat-left-text-fill me-2"></i>
                  {detail.volunteerNotes || detail.volunteerReport}
                </div>
              </div>
            )}
            {detail.proofUrl && (
              <div className="col-12">
                <div className="modal-label">صورة الإثبات المرفقة من المتطوع</div>

                  <img src={detail.proofUrl} alt="إثبات التسليم" style={{maxWidth:'100%', maxHeight:'300px', objectFit:'cover', borderRadius:12, border:'2px solid #66BB6A', padding:2, cursor:'pointer', boxShadow:'0 4px 12px rgba(102,187,106,0.2)'}} onClick={() => window.open(detail.proofUrl, '_blank')} />
                </div>
              </div>

            )}
            {(!detail.imageUrls || detail.imageUrls.length === 0) && (detail.imageUrl||detail.documentUrl) && (
              <div className="col-12">
                <div className="modal-label">المرفقات</div>
                <div style={{marginTop:8}}>
                  {String(detail.imageUrl||detail.documentUrl).match(/\.(jpeg|jpg|gif|png|webp|bmp)(?:\?.*)?$/i) ? (
                    <img src={detail.imageUrl||detail.documentUrl} alt="صورة الحالة" style={{maxWidth:'100%', borderRadius:12, border:'1px solid var(--border)'}} />
                  ) : (
                    <a href={detail.imageUrl||detail.documentUrl} target="_blank" className="btn btn-outline" style={{display:'inline-flex', width:'auto'}}><i className="bi bi-file-earmark-text"></i>عرض المستند</a>
                  )}
                </div>
              </div>
            )}
            <div className="col-12"><div className="modal-label">التفاصيل وقصة المستفيد</div><div style={{fontSize:'.82rem',lineHeight:1.7,marginTop:4,padding:12,borderRadius:9,background:'var(--bg-input)',border:'1px solid var(--border)'}}>{detail.description||detail.story||'—'}</div></div>
          </div>
        </Modal>

      <div className="d-flex gap-2 mb-4 flex-wrap align-items-center justify-content-between">

            <option value="all">كل الحالات</option><option value="pending">معلق</option>
            <option value="approved">معتمد</option><option value="rejected">مرفوض</option><option value="completed">مكتمل</option>
          </select>
          <select className="form-input" style={{width:'auto',padding:'10px 14px'}} value={cat} onChange={e=>setCat(e.target.value)}>
            <option value="all">كل الفئات</option><option value="مالي">مالي</option><option value="عيني">عيني</option><option value="طبي">طبي</option>
          </select>
        </div>
        <button
          className="d-flex align-items-center"
          onClick={()=>setModal('new')}
          style={{display:'flex',alignItems:'center',gap:7,padding:'9px 18px',borderRadius:'50px',background:'linear-gradient(135deg,var(--primary-dark),var(--primary))',color:'#fff',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:700,boxShadow:'0 4px 16px rgba(232,80,10,0.35)',transition:'all 0.2s ease',whiteSpace:'nowrap'}}
          onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-1px)';e.currentTarget.style.boxShadow='0 8px 24px rgba(232,80,10,0.5)'}}
          onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 4px 16px rgba(232,80,10,0.35)'}}
        ><i className="bi bi-plus-circle-fill"></i>إضافة حالة</button>
      </div>
      {filt.length===0
        ?<div className="card"><Empty icon="bi-inbox" title="لا توجد نتائج" sub="جرّب تعديل معايير البحث" /></div>
        :<div className="cases-grid">
          {filt.map(c=>{
            const sc=STATUS[c.status]||STATUS.pending;
            const assignedVol = getAssignedVol(c.assignedVolunteerId);
            return(
              <div className={`case-card ${c.status}`} key={c.id}>
                <div className="case-card-header">
                  <div className="d-flex align-items-center gap-2">
                    <div style={{width:7,height:7,borderRadius:'50%',background:sc.dot,boxShadow:`0 0 6px ${sc.dot}`}}></div>

                  <span className={catBadge(c.category)}>{c.category}</span>

                  <span className="case-meta-item"><i className="bi bi-person"></i>{c.applicantName}</span>
                  <span className="case-meta-item"><i className="bi bi-geo-alt"></i>{c.location||c.city||'—'}</span>

                <div className="case-story">{c.description||c.story}</div>

      }
    </div>
  );
}

// DONATION FORM MODAL
// ══════════════════════════════════════════
function DonationModal({init, cases, onClose}) {
  const isEdit=!!init?.id;
  const [f,setF]=useState({
    donorName:init?.donorName||'', caseTitle:init?.caseTitle||'', caseId:init?.caseId||'',
    amountOrItem:init?.amountOrItem||'', paymentMethod:init?.paymentMethod||'تحويل بنكي',
    category:init?.category||'مالي', status:init?.status||'قيد الجمع', notes:init?.notes||'',
  });
  const [saving,setSaving]=useState(false);
  const up=k=>e=>setF(p=>({...p,[k]:e.target.value}));

  const handleCaseChange = (e) => {
    const selectedId = e.target.value;
    if (selectedId === '') {
      setF(p => ({...p, caseId: '', caseTitle: 'تبرع عام'}));
    } else {
      const selectedCase = cases.find(c => c.id === selectedId);
      setF(p => ({...p, caseId: selectedId, caseTitle: selectedCase ? selectedCase.title : ''}));
    }
  };

  const approvedCases = cases ? cases.filter(c => c.status === 'approved' || c.status === 'active') : [];
  if (f.caseId && cases && !approvedCases.some(c => c.id === f.caseId)) {
    const currentCase = cases.find(c => c.id === f.caseId);
    if (currentCase) approvedCases.push(currentCase);
  }

  const save=async()=>{
    if(!f.amountOrItem.trim()){showToast('error','بيانات ناقصة','المبلغ أو العطاء مطلوب');return}
    setSaving(true);
    try{
      const data={...f,updatedAt:serverTimestamp()};
      if(isEdit){await updateDoc(doc(db,'donations',init.id),data);showToast('success','تم التعديل','تم تحديث التبرع')}
      else{await addDoc(collection(db,'donations'),{...data,createdAt:serverTimestamp()});showToast('success','تمت الإضافة','تم تسجيل التبرع')}
      onClose();
    }catch(e){showToast('error','خطأ',e.message)}finally{setSaving(false)}
  };
  return (
    <Modal title={isEdit?'تعديل التبرع':'تسجيل تبرع جديد'} icon={isEdit?'bi-pencil-fill':'bi-plus-circle-fill'} onClose={onClose}
      footer={<><button className="btn btn-outline" onClick={onClose}>إلغاء</button><button className="btn btn-primary" onClick={save} disabled={saving}>{saving?<><div className="spinner-border spinner-border-sm me-1"></div>جارٍ الحفظ...</>:<><i className="bi bi-check-lg"></i>{isEdit?'حفظ التعديلات':'تسجيل التبرع'}</>}</button></>}>
      <div className="row g-3">
        <div className="col-md-6"><Field label="اسم المتبرع"><input className="form-input" value={f.donorName} onChange={up('donorName')} placeholder="الاسم الكامل أو مجهول" /></Field></div>
        <div className="col-md-6">
          <Field label="الحالة المستفيدة">
            <select className="form-input" value={f.caseId} onChange={handleCaseChange}>
              <option value="">تبرع عام</option>
              {approvedCases.map(c => (
                <option key={c.id} value={c.id}>{c.title}</option>
              ))}
            </select>
          </Field>
        </div>
        <div className="col-md-6"><Field label="المبلغ / العطاء *"><input className="form-input" value={f.amountOrItem} onChange={up('amountOrItem')} placeholder="مثال: 500 ج.س أو ملابس" /></Field></div>
        <div className="col-md-6"><Field label="طريقة الدفع"><select className="form-input" value={f.paymentMethod} onChange={up('paymentMethod')}><option>تحويل بنكي</option><option>نقداً</option><option>بطاقة ائتمانية</option><option>عيني</option></select></Field></div>
        <div className="col-md-6"><Field label="الفئة"><select className="form-input" value={f.category} onChange={up('category')}><option>مالي</option><option>عيني</option><option>طبي</option></select></Field></div>
        <div className="col-md-6"><Field label="الحالة"><select className="form-input" value={f.status} onChange={up('status')}><option>قيد الجمع</option><option>تم الاستلام</option><option>تم التوزيع</option></select></Field></div>
        <div className="col-12"><Field label="ملاحظات"><textarea className="form-input" rows={3} value={f.notes} onChange={up('notes')} placeholder="أي ملاحظات إضافية..." style={{resize:'vertical'}} /></Field></div>
      </div>
    </Modal>
  );
}

// DONATIONS VIEW
// ══════════════════════════════════════════
function DonationsView({donations, cases, users, doDonStat, doDelDon, doConfirmReceived, doConfirmDistributed}) {
  const [q,setQ]=useState(''); const [st,setSt]=useState('all');
  const [modal,setModal]=useState(null);

  const filtered=donations.filter(d=>{
    const mq=!q||[d.donorName,d.caseTitle,d.amountOrItem,d.paymentMethod].join(' ').toLowerCase().includes(q.toLowerCase());
    return mq&&(st==='all'||d.status===st);
  });

  const DON_STATUSES=['قيد الجمع','تم الاستلام','تم التوزيع','قيد المراجعة','مقبول (خصم تلقائي)','مرفوض'];

  // Summary stats
  const total    = donations.length;
  const totalAmt = donations.reduce((s,d)=>s+(parseFloat((d.amountOrItem||'').replace(/[^0-9.]/g,''))||0),0);
  const distrib  = donations.filter(d=>d.status==='تم التوزيع').length;
  const pending  = donations.filter(d=>d.status==='قيد الجمع').length;

  return (
    <div>
      {modal&&<DonationModal init={modal==='new'?null:modal} cases={cases} onClose={()=>setModal(null)} />}

      {/* Mini stats */}
      <div className="stats-grid">
        {[
          {l:'إجمالي التبرعات',v:total,     icon:'bi-heart-fill',    c:'stat-red'},
          {l:'إجمالي المبالغ', v:`${totalAmt.toLocaleString('ar')} ج.س`,icon:'bi-cash-stack',c:'stat-green'},
          {l:'تم التوزيع',     v:distrib,   icon:'bi-check-circle-fill',c:'stat-blue'},
          {l:'قيد الجمع',      v:pending,   icon:'bi-hourglass-split',c:'stat-gold'},
        ].map((s,i)=>(
          <div className={`stat-card ${s.c}`} key={i}>
            <div className="stat-icon"><i className={`bi ${s.icon}`}></i></div>
            <div><div className="stat-value">{s.v}</div><div className="stat-label">{s.l}</div></div>
          </div>
        ))}
      </div>

      {/* Filters + Add */}
      <div className="d-flex gap-2 mb-3 flex-wrap align-items-center justify-content-between">
        <div className="d-flex gap-2 flex-wrap flex-fill">
          <div className="search-wrap flex-fill" style={{maxWidth:300}}>
            <i className="bi bi-search search-icon"></i>
            <input className="search-input" type="text" placeholder="بحث في التبرعات..." value={q} onChange={e=>setQ(e.target.value)} />
          </div>
          <select className="form-input" style={{width:'auto',padding:'10px 14px'}} value={st} onChange={e=>setSt(e.target.value)}>
            <option value="all">كل الحالات</option>
            {DON_STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
        </div>
        <button
          onClick={()=>setModal('new')}
          style={{display:'flex',alignItems:'center',gap:7,padding:'9px 18px',borderRadius:'50px',background:'linear-gradient(135deg,var(--primary-dark),var(--primary))',color:'#fff',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:700,boxShadow:'0 4px 16px rgba(232,80,10,0.35)',transition:'all 0.2s ease',whiteSpace:'nowrap'}}
          onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-1px)';e.currentTarget.style.boxShadow='0 8px 24px rgba(232,80,10,0.5)'}}
          onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 4px 16px rgba(232,80,10,0.35)'}}
        ><i className="bi bi-plus-circle-fill"></i>تسجيل تبرع</button>
      </div>

      <div className="card">
        <div className="table-wrapper">
          <table className="table">
            <thead>
              <tr>
                <th>المتبرع</th>
                <th>الحالة المستفيدة</th>
                <th>المبلغ / العطاء</th>
                <th>طريقة الدفع</th>
                <th>الفئة</th>
                <th>تاريخ التبرع</th>
                <th>الحالة</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody>
              {filtered.length===0
                ?<tr><td colSpan={8}><Empty icon="bi-heart" title="لا توجد تبرعات" sub="ابدأ بتسجيل أول تبرع" /></td></tr>
                :filtered.map(d=>{
                  return(
                    <tr key={d.id}>
                      <td>
                        <div className="d-flex align-items-center gap-2">
                          {(() => {
                            const dUser = users && users.find(u => (d.uid && u.uid === d.uid) || (d.donorId && u.uid === d.donorId) || (d.userId && u.uid === d.userId) || (d.email && u.email === d.email) || (d.donorName && u.name === d.donorName));
                            const pUrl = d.photoURL || d.donorPhotoURL || (dUser ? dUser.photoURL : null);
                            return pUrl 
                              ? <img src={pUrl} alt={d.donorName||'مجهول'} style={{width:30,height:30,borderRadius:'50%',objectFit:'cover',border:'1px solid var(--border)'}} />

                          })()}
                          <span className="bold" style={{fontSize:'.77rem'}}>{d.donorName||'مجهول'}</span>
                        </div>
                      </td>
                      <td style={{fontSize:'.74rem',color:'var(--text-secondary)',maxWidth:140,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{d.caseTitle||'تبرع عام'}</td>
                      <td><span className="badge badge-approved" style={{fontVariantNumeric:'tabular-nums'}}>{d.amountOrItem||'—'}</span></td>
                      <td style={{fontSize:'.72rem',color:'var(--text-secondary)'}}>
                        <div>
                          {d.paymentMethod||'—'}

                        </div>
                        {d.transactionId && <div style={{marginTop:4, color:'var(--brand-500)', fontWeight:600}}><i className="bi bi-hash"></i> {d.transactionId}</div>}
                        {d.cardNumber && <div style={{marginTop:4, fontSize:'0.65rem'}}><i className="bi bi-credit-card"></i> المنتهية بـ {d.cardNumber}</div>}
                        {d.receiptUrl && (
                          <div style={{marginTop:4}}>
                            {String(d.receiptUrl).match(/\.(jpeg|jpg|gif|png|webp|bmp)(?:\?.*)?$/i) ? (
                              <a href={d.receiptUrl} target="_blank" rel="noopener noreferrer" title="عرض الإيصال الكامل">
                                <img src={d.receiptUrl} alt="إيصال" style={{width:52,height:40,objectFit:'cover',borderRadius:6,border:d.aiSuspicionFlag?'2px solid #ef4444':'1px solid var(--border)',cursor:'zoom-in',display:'block'}} />
                              </a>
                            ) : (
                              <a href={d.receiptUrl} target="_blank" rel="noopener noreferrer" className="badge badge-completed text-decoration-none" style={{fontSize:'0.6rem',display:'inline-flex',alignItems:'center',gap:3}}>
                                <i className="bi bi-receipt"></i>إيصال تحويل

                        {d.aiSuspicionFlag && (
                          <div style={{fontSize:'0.65rem',color:'#ef4444',marginTop:6,background:'rgba(239,68,68,0.1)',padding:'4px 6px',borderRadius:4}}>
                            <i className="bi bi-robot me-1"></i>
                            تحليل ذكي: احتمال تباين في الإشعار أو البيانات
                          </div>
                        )}
                        {d.donorMessage && <div style={{fontSize:'0.65rem',color:'var(--gold)',marginTop:4}}><i className="bi bi-chat-quote-fill me-1"></i>"{d.donorMessage}"</div>}
                      </td>
                      <td><span className={catBadge(d.category)}>{d.category||'—'}</span></td>
                      <td style={{fontSize:'.7rem',color:'var(--text-secondary)',whiteSpace:'nowrap'}}>
                        <div>مضاف: {d.createdAt?.toDate ? formatDate(d.createdAt) : (typeof d.createdAt === 'number' ? formatDate(d.createdAt) : '—')}</div>
                        {d.receivedAt && <div style={{color:'var(--blue-light)'}}>استلم: {d.receivedAt?.toDate ? formatDate(d.receivedAt) : formatDate(d.receivedAt)}</div>}
                        {d.distributedAt && <div style={{color:'var(--primary-light)'}}>وزّع: {d.distributedAt?.toDate ? formatDate(d.distributedAt) : formatDate(d.distributedAt)}</div>}
                      </td>
                      <td>
                        <select className="form-input" style={{width:'auto',padding:'4px 10px',fontSize:'12px'}}
                          value={d.status||'قيد الجمع'} onChange={e=>doDonStat(d.id,e.target.value)}>
                          {DON_STATUSES.map(s=><option key={s}>{s}</option>)}
                        </select>
                      </td>
                      <td>
                        <div className="d-flex gap-1">
                          {d.status === 'قيد الجمع' && (
                            <button className="btn btn-outline btn-icon btn-sm" style={{borderColor:'var(--primary-light)',color:'var(--primary-light)'}} onClick={()=>doConfirmReceived(d.id, d.donorName)} title="تأكيد الاستلام">
                              <i className="bi bi-heart-fill"></i>
                            </button>
                          )}
                          {d.status === 'تم الاستلام' && (
                            <button className="btn btn-approve btn-icon btn-sm" onClick={()=>doConfirmDistributed(d)} title="تأكيد التوزيع">
                              <i className="bi bi-check-lg"></i>
                            </button>
                          )}
                          {d.status === 'قيد المراجعة' && (
                            <>
                              <button className="btn btn-approve btn-icon btn-sm" onClick={()=>doDonStat(d.id, 'مقبول (خصم تلقائي)')} title="موافقة (خصم)"><i className="bi bi-check-circle-fill"></i></button>
                              <button className="btn btn-reject btn-icon btn-sm" onClick={()=>doDonStat(d.id, 'مرفوض')} title="رفض الدفع"><i className="bi bi-x-circle-fill"></i></button>
                            </>
                          )}
                          <button className="btn btn-outline btn-icon btn-sm" onClick={()=>setModal(d)} title="تعديل"><i className="bi bi-pencil"></i></button>
                          <button className="btn btn-reject btn-icon btn-sm" onClick={()=>doDelDon(d)} title="حذف"><i className="bi bi-trash3"></i></button>

                      </td>
                    </tr>
                  );
                })
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// USER FORM MODAL
// ══════════════════════════════════════════
function UserModal({init, onClose}) {
  const isEdit=!!init?.id;
  const [f,setF]=useState({
    name:init?.name||'',email:init?.email||'',
    phone:init?.phone||'',role:init?.role||'member',
    status:init?.status||'active',address:init?.address||'',
  });
  const [photoFile, setPhotoFile] = useState(null);
  const [saving,setSaving]=useState(false);
  const up=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const save=async()=>{
    if(!f.name.trim()){showToast('error','بيانات ناقصة','الاسم مطلوب');return}
    setSaving(true);
    try{
      const data={
        ...f,
        accountType: f.role,
        updatedAt: serverTimestamp()
      };
      if (photoFile) {
        const urls = await uploadMultipleToSupabase([photoFile], 'profile_images');
        if (urls && urls.length > 0) {
          data.photoURL = urls[0];
        }
      }
      if(isEdit){await updateDoc(doc(db,'users',init.id),data);showToast('success','تم التعديل','تم تحديث بيانات المستخدم')}
      else{await addDoc(collection(db,'users'),{...data,isActive:true,createdAt:serverTimestamp()});showToast('success','تمت الإضافة','تم تسجيل المستخدم')}
      onClose();
    }catch(e){showToast('error','خطأ',e.message)}finally{setSaving(false)}
  };
  return (
    <Modal title={isEdit?'تعديل مستخدم':'إضافة مستخدم جديد'} icon={isEdit?'bi-pencil-fill':'bi-person-plus-fill'} onClose={onClose}
      footer={<><button className="btn btn-outline" onClick={onClose}>إلغاء</button><button className="btn btn-primary" onClick={save} disabled={saving}>{saving?<><div className="spinner-border spinner-border-sm me-1"></div>جارٍ الحفظ...</>:<><i className="bi bi-check-lg"></i>{isEdit?'حفظ التعديلات':'إضافة المستخدم'}</>}</button></>}>
      <div className="row g-3">
        <div className="col-md-12">
          <Field label="الصورة الشخصية">
            {init?.photoURL && (
              <div style={{marginBottom: 10, display: 'flex', alignItems: 'center', gap: 12}}>
                <img src={init.photoURL} alt="Current profile" style={{width: 50, height: 50, borderRadius: 8, objectFit: 'cover', border: '1px solid var(--border)'}} />
                <span style={{fontSize: '.75rem', color: 'var(--text-secondary)'}}>الصورة الحالية</span>
              </div>
            )}
            <input className="form-input" type="file" accept="image/*" onChange={e=>setPhotoFile(e.target.files[0])} />
            <div style={{fontSize:'.65rem',color:'var(--text-secondary)',marginTop:'4px'}}>اختر صورة جديدة لتحديث الصورة الحالية للمستخدم (اتركه فارغاً للاحتفاظ بالصورة الحالية)</div>
          </Field>
        </div>
        <div className="col-md-6"><Field label="الاسم الكامل *"><input className="form-input" value={f.name} onChange={up('name')} placeholder="الاسم الكامل" /></Field></div>
        <div className="col-md-6"><Field label="البريد الإلكتروني"><input className="form-input" type="email" value={f.email} onChange={up('email')} placeholder="example@email.com" /></Field></div>
        <div className="col-md-6"><Field label="رقم الهاتف"><input className="form-input" type="tel" value={f.phone} onChange={up('phone')} placeholder="05xxxxxxxx" /></Field></div>
        <div className="col-md-6"><Field label="نوع الحساب / الدور"><select className="form-input" value={f.role} onChange={up('role')} disabled={init?.role==='admin'}><option value="donor">متبرع (donor)</option><option value="beneficiary">مستفيد (beneficiary)</option><option value="volunteer">متطوع (volunteer)</option>{init?.role==='admin' && <option value="admin">مدير (admin)</option>}</select></Field></div>
        <div className="col-md-6"><Field label="الحالة"><select className="form-input" value={f.status} onChange={up('status')}><option value="active">نشط</option><option value="suspended">موقوف</option></select></Field></div>
        <div className="col-md-6"><Field label="العنوان"><input className="form-input" value={f.address} onChange={up('address')} placeholder="المدينة / المنطقة" /></Field></div>
      </div>
    </Modal>
  );
}

// USERS VIEW

function UsersView({users, doToggle, doDelUser, doChangeRole}) {

    admin:       {c:'badge badge-supervisor',i:'bi-shield-fill',       l:'مدير'},
    donor:       {c:'badge badge-donor',     i:'bi-heart-fill',        l:'متبرع'},
    beneficiary: {c:'badge badge-rejected',  i:'bi-person-hearts',     l:'مستفيد'},

          <select className="form-input" style={{width:'auto',padding:'10px 14px'}} value={role} onChange={e=>setRole(e.target.value)}>
            <option value="all">كل الأدوار</option>
            <option value="admin">مدير</option>
            <option value="donor">متبرع</option>
            <option value="beneficiary">مستفيد</option>
            <option value="volunteer">متطوع</option>
          </select>
        </div>
        <button
          onClick={()=>setModal('new')}
          style={{display:'flex',alignItems:'center',gap:7,padding:'9px 18px',borderRadius:'50px',background:'linear-gradient(135deg,var(--primary-dark),var(--primary))',color:'#fff',border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:700,boxShadow:'0 4px 16px rgba(232,80,10,0.35)',transition:'all 0.2s ease',whiteSpace:'nowrap'}}
          onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-1px)';e.currentTarget.style.boxShadow='0 8px 24px rgba(232,80,10,0.5)'}}
          onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 4px 16px rgba(232,80,10,0.35)'}}

                  const userRole = u.role || u.accountType || 'member';

                  const active=u.status!=='suspended'&&u.isActive!==false;
                  return(

                            <div style={{fontSize:'.63rem',color:'var(--text-secondary)'}}>{u.email}</div>
                          </div>
                        </div>
                      </td>
                      <td>
                        {userRole === 'admin' ? (
                          <span className={rc.c} style={{padding:'6px 12px',fontSize:'12px',fontWeight:'bold',display:'inline-block'}}>{rc.l}</span>

                          <select 
                            className={rc.c} 
                            style={{width:'auto',padding:'4px 20px 4px 10px',fontSize:'12px', border:'none', outline:'none', cursor:'pointer', fontWeight: 'bold'}}
                            value={userRole} 
                            onChange={(e) => doChangeRole(u.id, u.name, e.target.value)}

                            <option value="donor" style={{color:'#000'}}>متبرع</option>
                            <option value="beneficiary" style={{color:'#000'}}>مستفيد</option>
                            <option value="volunteer" style={{color:'#000'}}>متطوع</option>

                        )}

                      <td style={{fontSize:'.73rem',color:'var(--text-secondary)'}}>{u.phone||'—'}</td>
                      <td>
                        <span className={`badge ${active?'badge-active':'badge-suspended'}`}>

                          {active?'نشط':'موقوف'}
                        </span>
                      </td>
                      <td style={{fontSize:'.7rem',color:'var(--text-secondary)',whiteSpace:'nowrap'}}>{u.createdAt?.toDate?timeAgo(u.createdAt):'—'}</td>

                          <button className={`btn btn-icon btn-sm ${active?'btn-outline':'btn-approve'}`}
                            onClick={()=>doToggle(u.id,active?'active':'suspended',u.name,userRole)} title={active?'تعليق':'تفعيل'} disabled={userRole==='admin'}>
                            <i className={`bi ${active?'bi-lock-fill':'bi-unlock-fill'}`} style={{color:active?'#ef4444':''}}></i>
                          </button>
                          <button className="btn btn-reject btn-icon btn-sm" onClick={()=>doDelUser(u.id,u.name,userRole)} title="حذف" disabled={userRole==='admin'}><i className="bi bi-trash3"></i></button>
                        </div>
                      </td>
                    </tr>
                  );
                })
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function ChatsView({chats,msgs,activeChatId,setChat,sendMsg,msgIn,setMsgIn,userInfo,users,doDelMsg,doEditMsg,doDelChat}) {
  const endRef=useRef(null);
  const [editingMsg, setEditingMsg] = useState(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'})},[msgs]);
  
  // Find current chat name and user
  const currentChat = chats.find(c => c.id === activeChatId);
  const chatUser = currentChat ? users.find(u => u.uid === currentChat.userId) : null;
  const ROLE_LABELS = { beneficiary: 'مستفيد', volunteer: 'متطوع', donor: 'متبرع' };
  const roleLabel = chatUser ? (ROLE_LABELS[chatUser.role||chatUser.accountType] || 'مستخدم') : 'مستخدم';
  const chatPhoto = chatUser?.photoURL || currentChat?.photoURL;

  return (

                   style={{borderRadius:0,margin:0,width:'100%',borderLeft:'none',borderRight:'none',borderTop:'none',borderBottom:'none',padding:'12px 16px',textAlign:'right',background:activeChatId===ch.id?'rgba(46,125,50,0.15)':'transparent', paddingLeft:40}}
                   onClick={()=>setChat(ch.id)}>
                   {pUrl ? <img src={pUrl} alt="صورة" style={{width:34,height:34,borderRadius:'50%',objectFit:'cover',border:`2px solid ${roleColor}`}} /> : <Av name={ch.userName} size={34} />}
                   <div style={{flex:1,minWidth:0,marginRight:10}}>
                     <div style={{fontSize:'.8rem',fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',color:'var(--text-primary)'}}>
                       {ch.userName||'مستخدم'}
                       <span style={{fontSize:'10px', color:roleColor, marginRight:6, padding:'2px 6px', background:`${roleColor}22`, borderRadius:10}}>{rLabel}</span>

                     <div style={{fontSize:'.68rem',color:'var(--text-secondary)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',marginTop:4}}>{ch.lastMessage||'لا رسائل'}</div>
