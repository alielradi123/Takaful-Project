// CHATS VIEW
// ══════════════════════════════════════════
function ChatsView({chats,msgs,activeChatId,setChat,sendMsg,msgIn,setMsgIn,userInfo,users,doDelMsg,doEditMsg,doDelChat,isAr}) {
  const endRef=useRef(null);
  const [editingMsg, setEditingMsg] = useState(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'})},[msgs]);
  
  // Find current chat name and user
  const currentChat = chats.find(c => c.id === activeChatId);
  const chatUser = currentChat ? users.find(u => u.uid === currentChat.userId) : null;
  const ROLE_LABELS = isAr 
    ? { beneficiary: 'مستفيد', volunteer: 'متطوع', donor: 'متبرع' }
    : { beneficiary: 'Beneficiary', volunteer: 'Volunteer', donor: 'Donor' };
  const roleLabel = chatUser ? (ROLE_LABELS[chatUser.role||chatUser.accountType] || (isAr ? 'مستخدم' : 'User')) : (isAr ? 'مستخدم' : 'User');
  const chatPhoto = chatUser?.photoURL || currentChat?.photoURL;

  return (
    <div className="page active">
      <div className="card" style={{height:'calc(100dvh - 142px)',display:'flex',flexDirection:'row',overflow:'hidden'}}>
        {/* Sidebar chat list */}
        <div style={{width:300,minWidth:300,borderLeft:isAr?'1px solid var(--border)':'none',borderRight:!isAr?'1px solid var(--border)':'none',overflowY:'auto',flexShrink:0,background:'rgba(255,255,255,0.01)'}}>
          <div className="card-header" style={{borderBottom:'1px solid var(--border)',paddingBottom:11}}>
            <div style={{fontSize:'.9rem',fontWeight:800}}>{isAr ? 'المحادثات' : 'Conversations'}</div>
            <div style={{fontSize:'.7rem',color:'var(--text-secondary)'}}>{isAr ? `${chats.length} محادثة` : `${chats.length} conversations`}</div>
          </div>
          {chats.length===0?<Empty icon="bi-chat-dots" title={isAr ? "لا توجد محادثات" : "No conversations"} />
           :chats.map(ch=>{
             const u = users.find(usr => usr.uid === ch.userId);
             const pUrl = u?.photoURL || ch?.photoURL;
             const rLabel = u ? (ROLE_LABELS[u.role||u.accountType] || (isAr ? 'مستخدم' : 'User')) : (isAr ? 'مستخدم' : 'User');
             const roleColor = (u?.role||u?.accountType) === 'volunteer' ? 'var(--gold)' : (u?.role||u?.accountType) === 'donor' ? 'var(--primary-light)' : 'var(--blue-light)';
             return (
               <div key={ch.id} style={{position:'relative',borderBottom:'1px solid var(--border)'}}>
                 <button className={`nav-item ${activeChatId===ch.id?'active':''}`}
                   style={{borderRadius:0,margin:0,width:'100%',borderLeft:'none',borderRight:'none',borderTop:'none',borderBottom:'none',padding:'12px 16px',textAlign:isAr?'right':'left',background:activeChatId===ch.id?'rgba(46,125,50,0.15)':'transparent', paddingLeft:isAr?40:16, paddingRight:!isAr?40:16}}
                   onClick={()=>setChat(ch.id)}>
                   {pUrl ? <img src={pUrl} alt="صورة" style={{width:34,height:34,borderRadius:'50%',objectFit:'cover',border:`2px solid ${roleColor}`}} /> : <Av name={ch.userName} size={34} />}
                   <div style={{flex:1,minWidth:0,marginRight:isAr?10:0,marginLeft:!isAr?10:0}}>
                     <div style={{fontSize:'.8rem',fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',color:'var(--text-primary)'}}>
                       {ch.userName||(isAr ? 'مستخدم' : 'User')}
                       <span style={{fontSize:'10px', color:roleColor, marginRight:isAr?6:0, marginLeft:!isAr?6:0, padding:'2px 6px', background:`${roleColor}22`, borderRadius:10}}>{rLabel}</span>
                     </div>
                     <div style={{fontSize:'.68rem',color:'var(--text-secondary)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',marginTop:4}}>{ch.lastMessage||(isAr ? 'لا رسائل' : 'No messages')}</div>
                   </div>
                   {ch.unreadCount>0&&<span className="nav-badge" style={{marginRight:isAr?'auto':0,marginLeft:!isAr?'auto':0}}>{ch.unreadCount}</span>}
                 </button>
                 {/* Delete chat button */}
                 <button
                   title={isAr ? "حذف المحادثة" : "Delete Conversation"}
                   onClick={(e)=>{e.stopPropagation(); doDelChat(ch.id, ch.userName);}}
                   style={{position:'absolute',top:'50%',left:isAr?8:'auto',right:!isAr?8:'auto',transform:'translateY(-50%)',background:'transparent',border:'none',cursor:'pointer',color:'var(--red,#ef4444)',fontSize:14,opacity:0.5,padding:'4px',borderRadius:4,transition:'opacity 0.2s'}}
                   onMouseEnter={e=>e.currentTarget.style.opacity='1'}
                   onMouseLeave={e=>e.currentTarget.style.opacity='0.5'}
                 ><i className="bi bi-trash3"></i></button>
               </div>
             );
           })}
        </div>
        
        {/* Messaging window */}
        <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
          {!activeChatId
            ?<div className="h-100 d-flex align-items-center justify-content-center"><Empty icon="bi-chat-square-dots" title={isAr ? "اختر محادثة" : "Select a conversation"} sub={isAr ? "من القائمة للبدء بالدردشة" : "From the list to start chatting"} /></div>
            :<>
              <div className="card-header" style={{borderBottom:'1px solid var(--border)'}}>
                <div className="d-flex align-items-center gap-2">
                  {chatPhoto ? <img src={chatPhoto} alt="صورة" style={{width:32,height:32,borderRadius:'50%',objectFit:'cover',border:'1px solid var(--border)'}} /> : <Av name={currentChat?.userName||'م'} size={32} />}
                  <div style={{display:'flex', flexDirection:'column'}}>
                    <span className="bold">{currentChat?.userName||(isAr ? 'مستخدم' : 'User')}</span>
                    <span style={{fontSize:'11px', color:'var(--primary-light)'}}>{roleLabel}</span>
                  </div>
                </div>
              </div>
              <div style={{flex:1,overflowY:'auto',padding:16,display:'flex',flexDirection:'column',gap:9}}>
                {msgs.map(m=>{
                  const isAdmin = m.sender==='admin';
                  return (
                    <div key={m.id} className={`d-flex gap-2 mb-2 align-items-end ${isAdmin?'justify-content-start':'justify-content-end'}`} style={{flexDirection: isAdmin?'row':'row-reverse'}}>
                      {/* Avatar */}
                      {m.senderPhotoUrl 
                        ? <img src={m.senderPhotoUrl} alt="صورة" style={{width:28,height:28,borderRadius:'50%',objectFit:'cover',border:'1px solid var(--border)'}} /> 
                        : <Av name={isAdmin?userInfo.fullName:(m.senderName||currentChat?.userName||'م')} size={28} />
                      }
                      
                      <div className="p-3" style={{
                        maxWidth:'70%',
                        background: isAdmin?'var(--primary-glow)':'var(--bg-glass)',
                        border: isAdmin?'1px solid var(--primary-light)':'1px solid var(--border)',
                        borderRadius: isAdmin?'14px 14px 0 14px':'14px 14px 14px 0',
                        color:'var(--text-primary)',
                        position:'relative'
                      }}>
                        <div style={{fontSize:'.62rem',fontWeight:700,color:'var(--text-muted)',marginBottom:3}}>{isAdmin?userInfo.fullName:(m.senderName||currentChat?.userName||(isAr ? 'المستخدم' : 'User'))}</div>
                        
                        {editingMsg?.id === m.id ? (
                          <div className="d-flex flex-column gap-2 mt-2">
                            <input className="form-input" style={{fontSize:'.85rem', padding:'4px 8px'}} autoFocus value={editingMsg.text} onChange={e=>setEditingMsg({...editingMsg, text:e.target.value})} onKeyDown={e=>{if(e.key==='Enter') { doEditMsg(activeChatId, m.id, editingMsg.text); setEditingMsg(null); }}} />
                            <div className="d-flex gap-2 justify-content-end">
                              <button type="button" className="btn btn-sm" style={{padding:'2px 8px', fontSize:'11px'}} onClick={()=>setEditingMsg(null)}>{isAr ? 'إلغاء' : 'Cancel'}</button>
                              <button type="button" className="btn btn-sm btn-primary" style={{padding:'2px 8px', fontSize:'11px'}} onClick={()=>{doEditMsg(activeChatId, m.id, editingMsg.text); setEditingMsg(null);}}>{isAr ? 'حفظ' : 'Save'}</button>
                            </div>
                          </div>
                        ) : (
                          <div style={{fontSize:'.85rem',lineHeight:1.5}}>{m.text} {m.updatedAt && <span style={{fontSize:'10px',opacity:0.6}}>{isAr ? '(معدل)' : '(edited)'}</span>}</div>
                        )}
                        
                        {isAdmin && !editingMsg && (
                          <div style={{position:'absolute', top:5, left: isAdmin?5:'auto', right: !isAdmin?5:'auto', display:'flex', gap:6, opacity:0.6}}>
                            <button type="button" onClick={()=>setEditingMsg({id: m.id, text: m.text})} style={{background:'transparent',border:'none',color:'var(--text-muted)',padding:0,cursor:'pointer',fontSize:'11px'}} title={isAr ? "تعديل" : "Edit"}><i className="bi bi-pencil"></i></button>
                            <button type="button" onClick={()=>doDelMsg(activeChatId, m.id)} style={{background:'transparent',border:'none',color:'var(--red)',padding:0,cursor:'pointer',fontSize:'11px'}} title={isAr ? "حذف" : "Delete"}><i className="bi bi-trash"></i></button>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
                <div ref={endRef}></div>
              </div>
              <form className="d-flex gap-2 p-3" style={{borderTop:'1px solid var(--border)',background:'rgba(255,255,255,0.01)'}} onSubmit={sendMsg}>
                <input className="form-input flex-fill" type="text" placeholder={isAr ? "اكتب رسالة..." : "Type a message..."} value={msgIn} onChange={e=>setMsgIn(e.target.value)} />
                <button type="submit" className="btn btn-primary"><i className="bi bi-send-fill"></i><span className="d-none d-sm-inline ms-1">{isAr ? 'إرسال' : 'Send'}</span></button>
              </form>
            </>
          }
        </div>
      </div>
    </div>
  );
}

// REPORTS VIEW (Chart.js financial charts)
// ══════════════════════════════════════════
function ReportsView({donations, cases, users, isAr}) {
  const [dateRange, setDateRange] = useState('all'); // all, month, week
  const barRef   = React.useRef(null);
  const pieRef   = React.useRef(null);
  const barChart = React.useRef(null);
  const pieChart = React.useRef(null);

  // Filter Data
  const now = new Date();
  const filteredDonations = React.useMemo(() => {
    return donations.filter(d => {
      if (dateRange === 'all') return true;
      const ts = d.timestamp || d.createdAt;
      if (!ts) return false;
      const dDate = ts.toDate ? ts.toDate() : new Date(ts);
      const diffTime = Math.abs(now - dDate);

                <div style={{fontSize:'.75rem',color:'var(--text-secondary)'}}>{isAr ? 'التوزيع المالي حسب تصنيف الحالات' : 'Financial distribution by case category'}</div>
              </div>
              <div style={{width:40,height:40,borderRadius:'50%',background:'rgba(245,158,11,0.1)',color:'#f59e0b',display:'flex',alignItems:'center',justifyContent:'center'}}><i className="bi bi-pie-chart"></i></div>

            <div className="card-body d-flex flex-column align-items-center justify-content-center" style={{padding:'20px'}}>
              <div style={{position:'relative', height:'250px', width:'100%'}}>
                <canvas ref={pieRef}></canvas>
              </div>

      {/* Top donors */}
      <div className="card" style={{border:'none', boxShadow:'0 10px 30px rgba(0,0,0,0.05)', borderRadius:'16px'}}>
        <div className="card-header border-0 pb-3 pt-4 px-4 d-flex justify-content-between align-items-center bg-transparent">
          <div>
            <div style={{fontWeight:800,fontSize:'1.1rem'}}>{isAr ? 'سجل الشرف (أبرز المتبرعين)' : 'Honor Roll (Top Donors)'}</div>
            <div style={{fontSize:'.8rem',color:'var(--text-secondary)'}}>{isAr ? `خلال الفترة المحددة (${dateRange==='all'?'الكل':dateRange==='year'?'سنة':dateRange==='month'?'30 يوم':'7 أيام'})` : `During selected period (${dateRange==='all'?'All':dateRange==='year'?'Year':dateRange==='month'?'30 Days':'7 Days'})`}</div>
          </div>
          <div style={{background:'rgba(245,158,11,0.1)', color:'#f59e0b', width:48, height:48, borderRadius:'12px', display:'flex', alignItems:'center', justifyContent:'center'}}>
            <i className="bi bi-award-fill fs-4"></i>
          </div>
        </div>
        <div className="card-body px-4 pb-4 pt-0">
          {topDonorsList.length===0
            ?<Empty icon="bi-heart" title={isAr ? "لا توجد بيانات متبرعين" : "No donor data available"} sub={isAr ? "قم بتغيير نطاق التاريخ أو انتظار تسجيل تبرعات" : "Change date range or await new donations"} />
            :<div className="d-flex flex-column gap-3 mt-3">
              {topDonorsList.map(([name, data],i)=>(
                <div key={i} className="d-flex align-items-center justify-content-between p-3 rounded-4" style={{background:'var(--bg-input)', border:'1px solid var(--border)', transition:'all 0.3s ease', cursor:'default'}} onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-3px)';e.currentTarget.style.boxShadow='0 8px 20px rgba(0,0,0,0.08)'}} onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='none'}}>
                  <div className="d-flex align-items-center gap-3">
                    <div style={{position:'relative'}}>
                      {data.photoURL ? (
                        <img src={data.photoURL} alt={name} style={{width:44,height:44,borderRadius:'50%',objectFit:'cover',border:'2px solid var(--primary-light)'}} />
                      ) : (
                        <Av name={name} size={44} />
                      )}
                      <div style={{position:'absolute', bottom:-5, right:-5, width:20,height:20,borderRadius:'50%',fontSize:'.7rem',fontWeight:'bold',display:'flex',alignItems:'center',justifyContent:'center', background: i===0?'linear-gradient(135deg, #F59E0B, #FBBF24)':i===1?'linear-gradient(135deg, #9CA3AF, #D1D5DB)':i===2?'linear-gradient(135deg, #B45309, #D97706)':'var(--bg-dark)', color:i<3?'#fff':'var(--text-primary)', boxShadow:'0 2px 5px rgba(0,0,0,0.2)', border:'2px solid var(--bg-input)'}}>{i+1}</div>
                    </div>
                    <div>
                      <div style={{fontSize:'.85rem',fontWeight:800}}>{name}</div>
                      <div className="text-xs text-muted">{isAr ? 'متبرع مميز' : 'Top Donor'}</div>
                    </div>
                  </div>
                  <div className="text-end">
                    <div style={{fontWeight:800, color:'var(--primary-light)', fontSize:'1rem'}}>{data.amt.toLocaleString(isAr?'ar':'en')} {isAr ? 'ج.س' : 'SDG'}</div>
                    <div className="text-xs text-muted">{isAr ? 'إجمالي المساهمات' : 'Total Contributions'}</div>
                  </div>
                </div>
              ))}
            </div>
          }
        </div>
      </div>
    </div>
  );
}

// SHARES VIEW

function SharesView({shares, cases, isAr}) {
  const [q,setQ]=useState('');
  const filt=shares.filter(s=>!q||[s.caseTitle,s.platform,s.userId].join(' ').toLowerCase().includes(q.toLowerCase()));

  const platformStats=shares.reduce((acc,s)=>{acc[s.platform]=(acc[s.platform]||0)+1;return acc},{});
  const PLATFORM_ICONS={'WhatsApp':'bi-whatsapp','Twitter/X':'bi-twitter-x','Facebook':'bi-facebook',
    'تيليغرام':'bi-telegram','نسخ الرابط':'bi-link-45deg'};

  return(
    <div className="page active">
      {/* Platform stats */}
      <div className="stats-grid">
        {Object.entries(platformStats).map(([p,c],i)=>(
          <div className="stat-card stat-blue" key={i}>
            <div className="stat-icon"><i className={`bi ${PLATFORM_ICONS[p]||'bi-share'}`}></i></div>
            <div>
              <div className="stat-value">{c}</div>
              <div className="stat-label">{p}</div>
            </div>
          </div>
        ))}
        <div className="stat-card stat-red">
          <div className="stat-icon"><i className="bi bi-share-fill"></i></div>
          <div>
            <div className="stat-value">{shares.length}</div>
            <div className="stat-label">{isAr ? 'إجمالي المشاركات' : 'Total Shares'}</div>
          </div>
        </div>
      </div>

      <div className="d-flex gap-2 mb-3">
        <div className="search-wrap flex-fill" style={{maxWidth:340}}>
          <i className="bi bi-search search-icon"></i>
          <input className="search-input" placeholder={isAr ? "بحث في المشاركات..." : "Search shares..."} value={q} onChange={e=>setQ(e.target.value)} />
        </div>
      </div>

      <div className="card">
        <div className="table-wrapper">
          <table className="table">
            <thead><tr><th>{isAr ? 'الحملة' : 'Campaign'}</th><th>{isAr ? 'المنصة' : 'Platform'}</th><th>{isAr ? 'المستخدم' : 'User'}</th><th>{isAr ? 'الوقت' : 'Time'}</th></tr></thead>
            <tbody>
              {filt.length===0
                ?<tr><td colSpan={4}><Empty icon="bi-share" title={isAr ? "لا توجد مشاركات بعد" : "No shares yet"} sub={isAr ? "ستظهر هنا مشاركات الحملات من التطبيق" : "Campaign shares from app will appear here"} /></td></tr>
                :filt.map(s=>(
                  <tr key={s.id}>
                    <td style={{fontWeight:600,fontSize:'.78rem'}}>{s.caseTitle||s.caseId||'—'}</td>
                    <td>
                      <span className="badge badge-pending" style={{display:'inline-flex',alignItems:'center',gap:5}}>
                        <i className={`bi ${PLATFORM_ICONS[s.platform]||'bi-share'}`}></i>{s.platform}
                      </span>
                    </td>
                    <td style={{fontSize:'.71rem',color:'var(--text-secondary)'}}>{s.userId?.slice(0,8)}...</td>
                    <td style={{fontSize:'.7rem',color:'var(--text-secondary)',whiteSpace:'nowrap'}}>
                      {s.timestamp?new Date(s.timestamp).toLocaleDateString(isAr?'ar-SA':'en-US'):'—'}
                    </td>
                  </tr>
                ))
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// VOLUNTEER ASSIGNMENT MODAL
// ══════════════════════════════════════════
function AssignVolunteerModal({caseItem, users, onClose, isAr}) {
  const volunteers = users.filter(u => u.role === 'volunteer' && u.status !== 'suspended');
  const [selectedVolId, setSelectedVolId] = useState(caseItem.volunteerId || '');
  const [saving, setSaving] = useState(false);

  const save = async () => {
    setSaving(true);
    try {
      await updateDoc(doc(db, 'cases', caseItem.id), {
        assignedVolunteerId: selectedVolId || null,
        volunteerId: selectedVolId || null,
        status: selectedVolId ? 'assigned' : (caseItem.status === 'assigned' ? 'approved' : caseItem.status),
        assignedAt: selectedVolId ? serverTimestamp() : null,
        updatedAt: serverTimestamp()
      });
      showToast('success', isAr ? 'تم التعيين' : 'Assigned', isAr ? 'تم تحديث المتطوع المعين للحالة' : 'Volunteer assigned successfully');
      onClose();
    } catch(e) {
      showToast('error', isAr ? 'خطأ' : 'Error', e.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <Modal title={isAr ? "تعيين متطوع للحالة" : "Assign Volunteer to Case"} icon="bi-person-check-fill" onClose={onClose}
      footer={<>
        <button className="btn btn-outline" onClick={onClose}>{isAr ? 'إلغاء' : 'Cancel'}</button>
        <button className="btn btn-primary" onClick={save} disabled={saving}>
          {saving ? (isAr ? 'جاري الحفظ...' : 'Saving...') : (isAr ? 'حفظ التعيين' : 'Save Assignment')}
        </button>
      </>}>
      <div className="mb-3">
        <label className="form-label">{isAr ? "الحالة المستهدفة" : "Target Case"}</label>
        <div className="form-input" style={{background:'rgba(255,255,255,0.03)'}}>{caseItem.title}</div>
      </div>
      <div className="mb-3">
        <label className="form-label">{isAr ? "اختر متطوعاً" : "Select Volunteer"}</label>
        <select className="form-input" value={selectedVolId} onChange={e => setSelectedVolId(e.target.value)}>
          <option value="">-- {isAr ? 'إلغاء تعيين المتطوع' : 'Unassign Volunteer'} --</option>
          {volunteers.map(v => (
            <option key={v.id} value={v.id || v.uid}>{v.name} ({v.email})</option>
          ))}
        </select>
      </div>
      {volunteers.length === 0 && (
        <div style={{color:'var(--gold)', fontSize:'0.8rem', marginTop:'8px'}}>
          <i className="bi bi-exclamation-triangle-fill me-1"></i>
          {isAr ? 'لا يوجد متطوعين نشطين مسجلين في النظام حالياً.' : 'No active volunteers registered in the system currently.'}
        </div>
      )}
    </Modal>
  );
}

// VERIFICATIONS VIEW — Admin: Review identity docs
// ══════════════════════════════════════════

// VERIFICATIONS VIEW — Admin: Review identity docs
// ══════════════════════════════════════════
function VerificationsView({verifications, doDelVerification, isAr}) {
  const [filter,setFilter] = useState('pending');
  const [selected,setSelected] = useState(null);
  const [adminNote,setAdminNote] = useState('');
  const [saving,setSaving] = useState(false);

  const DOC_LABELS = isAr ? {
    national_id: 'بطاقة وطنية',
    passport: 'جواز سفر',
    driving_license: 'رخصة قيادة',
    birth_cert: 'شهادة ميلاد',
  } : {
    national_id: 'National ID',
    passport: 'Passport',
    driving_license: 'Driving License',
    birth_cert: 'Birth Certificate',
  };
  const ROLE_LABELS = isAr 
    ? { beneficiary: 'مستفيد', volunteer: 'متطوع' }
    : { beneficiary: 'Beneficiary', volunteer: 'Volunteer' };

  const filtered = verifications.filter(v => filter === 'all' || v.verificationStatus === filter);

  const doVerify = async (v, decision) => {
    const label = decision === 'approved' ? (isAr ? 'قبول' : 'Accept') : (isAr ? 'رفض' : 'Reject');
    if (!await showConfirm(isAr ? `${label} الهوية` : `${label} Identity`, isAr ? `${label} طلب التحقق من هوية "${v.name}"؟` : `${label} verification request for "${v.name}"?`, decision === 'approved' ? '✅' : '❌')) return;
    setSaving(true);
    try {
      await updateDoc(doc(db, 'identity_verifications', v.id), {
        verificationStatus: decision,
        adminNote: adminNote,
        reviewedAt: serverTimestamp(),
      });
      const newUserStatus = decision === 'approved' ? 'active' : 'rejected';
      await updateDoc(doc(db, 'users', v.uid), {
        status: newUserStatus,
        verificationStatus: decision,
      });
      showToast('success', isAr ? `تم ${label} طلب التحقق من هوية "${v.name}"` : `Verification request for "${v.name}" was ${label.toLowerCase()}ed`);
      setSelected(null);
      setAdminNote('');
    } catch(e) { showToast('error', isAr ? 'خطأ' : 'Error', e.message); }
    finally { setSaving(false); }
  };

  return (
    <div>
      {/* Stats */}
      <div className="stats-grid" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
        {[
          {l:isAr?'في الانتظار':'Pending', v:verifications.filter(v=>v.verificationStatus==='pending').length, c:'stat-gold', i:'bi-hourglass-split'},
          {l:isAr?'مقبولة':'Approved',      v:verifications.filter(v=>v.verificationStatus==='approved').length, c:'stat-green', i:'bi-shield-check'},
          {l:isAr?'مرفوضة':'Rejected',     v:verifications.filter(v=>v.verificationStatus==='rejected').length, c:'stat-red',  i:'bi-shield-x'},
        ].map((s,i) => (
          <div className={`stat-card ${s.c}`} key={i}>
            <div className="stat-icon"><i className={`bi ${s.i}`}></i></div>
            <div><div className="stat-value">{s.v}</div><div className="stat-label">{s.l}</div></div>
          </div>
        ))}
      </div>

      {/* Filter tabs */}
      <div className="d-flex gap-2 mb-4 flex-wrap">
        {[['all',isAr?'الكل':'All'],['pending',isAr?'معلق':'Pending'],['approved',isAr?'مقبول':'Approved'],['rejected',isAr?'مرفوض':'Rejected']].map(([v,l])=>(
          <button key={v} className={`btn btn-sm ${filter===v?'btn-primary':'btn-outline'}`} onClick={()=>setFilter(v)}>{l}</button>
        ))}
      </div>

      {/* List */}
      {filtered.length === 0
        ? <div className="card"><Empty icon="bi-shield-check" title={isAr ? "لا توجد طلبات" : "No requests"} sub={isAr ? "لا توجد طلبات تحقق بهذه الحالة" : "No verification requests under this status"} /></div>
        : <div className="row g-3">
            {filtered.map(v => {
              const statusMap = {
                pending:  {c:'badge-pending',  l:isAr?'معلق':'Pending',   i:'bi-hourglass-split'},
                approved: {c:'badge-approved', l:isAr?'مقبول':'Approved',  i:'bi-check-circle-fill'},
                rejected: {c:'badge-rejected', l:isAr?'مرفوض':'Rejected', i:'bi-x-circle-fill'},
              };
              const st = statusMap[v.verificationStatus] || statusMap.pending;
              return (
                <div className="col-lg-6" key={v.id}>
                  <div className="card" style={{cursor:'pointer'}} onClick={()=>{setSelected(v);setAdminNote(v.adminNote||'');}}>
                    <div className="card-body">
                      <div className="d-flex align-items-center gap-3 mb-3">
                        {v.docFrontURL
                          ? <img src={v.docFrontURL} alt="وثيقة" style={{width:48,height:48,borderRadius:10,objectFit:'cover',border:'1px solid var(--border)'}} />
                          : <div className="avatar" style={{width:48,height:48,borderRadius:10}}>{ini(v.name)}</div>
                        }
                        <div style={{flex:1}}>
                          <div className="bold">{v.name}</div>
                          <div className="text-sm text-muted">{v.email}</div>
                        </div>
                        <div className="d-flex flex-column align-items-end gap-1">
                          <span className={`badge badge-supervisor`}>{ROLE_LABELS[v.role]||v.role}</span>
                          <span className={`badge ${st.c}`}><i className={`bi ${st.i}`} style={{fontSize:'.6rem'}}></i> {st.l}</span>
                        </div>
                      </div>
                      <div className="d-flex gap-3 text-sm text-muted">
                        <span><i className="bi bi-credit-card me-1"></i>{DOC_LABELS[v.docType]||v.docType}</span>
                        <span><i className="bi bi-hash me-1"></i>{v.docNumber}</span>
                        {v.docCountry && <span><i className="bi bi-geo-alt me-1"></i>{v.docCountry}</span>}
                      </div>
                      {v.reason && <div className="mt-2 text-sm" style={{color:'var(--text-secondary)',fontStyle:'italic'}}>"{v.reason}"</div>}
                      <div className="d-flex align-items-center justify-content-between mt-3 pt-3" style={{borderTop:'1px solid var(--border)'}}>
                        <div className="text-xs text-muted">{timeAgo(v.submittedAt)}</div>
                        <div className="d-flex gap-2" onClick={e=>e.stopPropagation()}>
                          <button className="btn btn-outline btn-icon btn-sm" onClick={()=>{setSelected(v);setAdminNote(v.adminNote||'');}} title={isAr ? "معاينة وتعديل" : "Preview & Edit"}><i className="bi bi-pencil"></i></button>
                          <button className="btn btn-outline btn-icon btn-sm" style={{color:'var(--red)',borderColor:'transparent'}} onClick={()=>doDelVerification(v.id, v.name)} title={isAr ? "حذف الطلب" : "Delete Request"}><i className="bi bi-trash"></i></button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
      }

      {/* Detail Modal */}
      {selected && (
        <Modal title={isAr ? "تفاصيل طلب التحقق" : "Verification Request Details"} icon="bi-shield-check" onClose={()=>{setSelected(null);setAdminNote('');}}
          footer={
            <>
              <button className="btn btn-outline" onClick={()=>{setSelected(null);setAdminNote('');}}>{isAr ? 'إغلاق' : 'Close'}</button>
              <button className="btn btn-reject" onClick={()=>doVerify(selected,'rejected')} disabled={saving || selected.verificationStatus==='rejected'}><i className="bi bi-x-lg"></i>{isAr ? 'رفض الطلب' : 'Reject Request'}</button>
              <button className="btn btn-approve" onClick={()=>doVerify(selected,'approved')} disabled={saving || selected.verificationStatus==='approved'}><i className="bi bi-check-lg"></i>{isAr ? 'تأكيد وموافقة' : 'Approve Request'}</button>
              <button className="btn btn-outline" style={{color:'var(--red)',borderColor:'var(--red)'}} onClick={()=>{doDelVerification(selected.id, selected.name);setSelected(null);setAdminNote('');}}><i className="bi bi-trash"></i>{isAr ? 'حذف الطلب' : 'Delete Request'}</button>
            </>
          }
        >
          <div className="row g-3">
            <div className="col-md-6"><div className="modal-label">{isAr ? 'الاسم' : 'Name'}</div><div className="bold">{selected.name}</div></div>
            <div className="col-md-6"><div className="modal-label">{isAr ? 'البريد' : 'Email'}</div><div>{selected.email}</div></div>
            <div className="col-md-6"><div className="modal-label">{isAr ? 'الدور' : 'Role'}</div><span className="badge badge-supervisor">{ROLE_LABELS[selected.role]||selected.role}</span></div>
            <div className="col-md-6"><div className="modal-label">{isAr ? 'نوع الوثيقة' : 'Document Type'}</div><div>{DOC_LABELS[selected.docType]||selected.docType}</div></div>
            <div className="col-md-6"><div className="modal-label">{isAr ? 'رقم الوثيقة' : 'Document Number'}</div><div className="bold">{selected.docNumber}</div></div>
            <div className="col-md-6"><div className="modal-label">{isAr ? 'البلد' : 'Country'}</div><div>{selected.docCountry||'—'}</div></div>
            {selected.docExpiry && <div className="col-md-6"><div className="modal-label">{isAr ? 'تاريخ الانتهاء' : 'Expiry Date'}</div><div>{selected.docExpiry}</div></div>}
            {selected.reason && <div className="col-12"><div className="modal-label">{isAr ? 'السبب / المهارات' : 'Reason / Skills'}</div><div style={{lineHeight:1.7}}>{selected.reason}</div></div>}

            {/* Document Images */}
            {selected.docFrontURL && (
              <div className="col-md-6">
                <div className="modal-label">{isAr ? 'صورة الوجه الأمامي' : 'Front Image'}</div>
                <a href={selected.docFrontURL} target="_blank" rel="noopener noreferrer">
                  <img src={selected.docFrontURL} alt="الوجه الأمامي" style={{width:'100%',borderRadius:8,border:'1px solid var(--border)',marginTop:4,cursor:'zoom-in'}} />
                </a>
              </div>
            )}
            {selected.docBackURL && (
              <div className="col-md-6">
                <div className="modal-label">{isAr ? 'صورة الوجه الخلفي' : 'Back Image'}</div>
                <a href={selected.docBackURL} target="_blank" rel="noopener noreferrer">
                  <img src={selected.docBackURL} alt="الوجه الخلفي" style={{width:'100%',borderRadius:8,border:'1px solid var(--border)',marginTop:4,cursor:'zoom-in'}} />
                </a>
              </div>
            )}

            {selected.verificationStatus === 'pending' || true ? (
              <div className="col-12">
                <div className="modal-label">{isAr ? 'ملاحظة المدير / سبب القبول أو الرفض (اختياري)' : 'Admin Notes / Reason (Optional)'}</div>
                <textarea className="form-input" rows={2} value={adminNote} onChange={e=>setAdminNote(e.target.value)}
                  placeholder={isAr ? "سبب القبول أو الرفض..." : "Approval or rejection note..."} style={{resize:'vertical'}} />
              </div>
            ) : null}
          </div>
        </Modal>
      )}
    </div>
  );
}

// ACTIVITY VIEW
// ══════════════════════════════════════════
function ActivityView({logs, doDelLog, doClearLogs, isAr}) {
  return (
    <div>
      <div className="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
        <div className="d-flex align-items-center gap-3">
          <div className="stat-icon" style={{background:'rgba(102,187,106,0.15)',color:'var(--primary)',width:40,height:40,borderRadius:12,fontSize:'1.1rem'}}><i className="bi bi-clock-history"></i></div>
          <div>
            <div className="bold" style={{fontSize:'.87rem'}}>{isAr ? 'سجل العمليات' : 'Activity Log'}</div>
            <div style={{fontSize:'.65rem',color:'var(--text-secondary)'}}>{isAr ? 'تتبع حركات ومسؤوليات النظام' : 'Track system actions and audit trail'}</div>
          </div>
        </div>
        {logs.length > 0 && (
          <button className="btn btn-outline" style={{borderColor:'rgba(239,83,80,0.5)',color:'var(--red)'}} onClick={doClearLogs}>
            <i className="bi bi-trash-fill me-1"></i>{isAr ? 'مسح السجل بالكامل' : 'Clear All Logs'}
          </button>
        )}
      </div>
      <div className="card p-0">
        <div className="card-body p-0">
          {logs.length===0 ? <Empty icon="bi-clock" title={isAr ? "لا توجد عمليات مسجلة" : "No activity logged"} sub={isAr ? "لم يتم إجراء أي نشاطات بعد" : "No activities performed yet"} /> : (
            <div className="table-responsive">
              <table className="table table-hover align-middle mb-0" style={{fontSize:'.8rem'}}>
                <thead>
                  <tr>
                    <th>{isAr ? 'المسؤول' : 'Admin'}</th>
                    <th>{isAr ? 'العملية' : 'Action'}</th>
                    <th>{isAr ? 'التفاصيل' : 'Details'}</th>
                    <th>{isAr ? 'التاريخ والوقت' : 'Date & Time'}</th>
                    <th style={{width:60}}>{isAr ? 'إجراء' : 'Action'}</th>
                  </tr>
                </thead>
                <tbody>
                  {logs.map(log => (
                    <tr key={log.id}>
                      <td><div className="d-flex align-items-center gap-2"><Av name={log.adminName} size={24} />{log.adminName}</div></td>
                      <td><span className="badge badge-approved">{log.action}</span></td>
                      <td style={{maxWidth:250,whiteSpace:'normal'}}>{log.details}</td>
                      <td className="text-muted" style={{minWidth:120}}>{log.timestamp ? formatDate(log.timestamp.toDate(),true) : '—'}</td>
                      <td>
                        <button className="btn btn-outline btn-icon btn-sm" style={{color:'var(--red)',borderColor:'transparent'}} onClick={()=>doDelLog(log.id)} title={isAr ? "حذف السجل" : "Delete Log"}>
                          <i className="bi bi-trash"></i>
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// TRACKING VIEW (Live Volunteer GPS)
// ══════════════════════════════════════════
function TrackingView({users, cases, isAr}) {
  const mapRef = useRef(null);
  const leafletMap = useRef(null);
  const markersRef = useRef({});
  const [locations, setLocations] = useState([]);
  
  // Listen to volunteer locations
  useEffect(() => {
    const unsub = onSnapshot(collection(db, 'volunteerLocations'), (snapshot) => {
      const locs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      setLocations(locs);
    });
    return () => unsub();
  }, []);

  // Initialize Map
  useEffect(() => {
    if (!mapRef.current) return;
    if (!leafletMap.current) {
      leafletMap.current = L.map(mapRef.current).setView([15.5007, 32.5599], 12); // Default to Khartoum, Sudan
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(leafletMap.current);
    }
  }, []);

  // Update Markers
  useEffect(() => {
    if (!leafletMap.current) return;
    const map = leafletMap.current;

    locations.forEach(loc => {
      const { id, latitude, longitude, timestamp } = loc;
      const user = users.find(u => u.uid === id || u.id === id);
      const name = user ? user.name : (isAr ? 'متطوع غير معروف' : 'Unknown Volunteer');
      
      const timeStr = timestamp ? new Date(timestamp).toLocaleTimeString(isAr?'ar-SA':'en-US') : (isAr ? 'غير معروف' : 'Unknown');

      if (markersRef.current[id]) {
        markersRef.current[id].setLatLng([latitude, longitude]);
        markersRef.current[id].setPopupContent(`<b>${name}</b><br/>${isAr?'آخر تحديث:':'Last update:'} ${timeStr}`);
      } else {
        const customIcon = L.divIcon({
          html: `<div style="font-size: 24px; color: var(--primary);"><i class="bi bi-car-front-fill"></i></div>`,
          className: 'custom-leaflet-icon',
          iconSize: [30, 30],
          iconAnchor: [15, 30]
        });
        const marker = L.marker([latitude, longitude], {icon: customIcon}).addTo(map);
        marker.bindPopup(`<b>${name}</b><br/>${isAr?'آخر تحديث:':'Last update:'} ${timeStr}`);
        markersRef.current[id] = marker;
      }
    });

    if (locations.length > 0 && leafletMap.current.getZoom() === 12) {
       leafletMap.current.panTo([locations[0].latitude, locations[0].longitude]);
    }

  }, [locations, users, isAr]);

  return (
    <div style={{display: 'flex', flexDirection: 'column', height: 'calc(100vh - 120px)'}}>
      <div className="card h-100" style={{flex: 1, display: 'flex', flexDirection: 'column'}}>
        <div className="card-header d-flex justify-content-between align-items-center">
          <div className="bold"><i className="bi bi-geo-alt-fill me-2 text-primary"></i>{isAr ? 'الخريطة المباشرة للمتطوعين النشطين' : 'Live Active Volunteers Map'}</div>
          <span className="badge bg-primary rounded-pill">{locations.length} {isAr ? 'متطوع ميداني' : 'field volunteers'}</span>
        </div>
        <div className="card-body p-0" style={{flex: 1, position: 'relative'}}>
          <div ref={mapRef} style={{width: '100%', height: '100%', minHeight: '400px', borderRadius: '0 0 var(--radius) var(--radius)'}}></div>
          {locations.length === 0 && (
            <div style={{position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.5)', zIndex: 1000}}>
              <div className="text-center" style={{background: 'var(--bg-glass)', padding: '20px', borderRadius: 'var(--radius)', backdropFilter: 'blur(10px)'}}>
                <i className="bi bi-car-front" style={{fontSize: '3rem', color: 'var(--text-secondary)'}}></i>
                <h4 className="mt-3">{isAr ? 'لا يوجد متطوعون نشطون حالياً' : 'No Active Volunteers Currently'}</h4>
                <p className="text-muted">{isAr ? 'تظهر مواقع المتطوعين هنا عند قبولهم لمهام ميدانية.' : 'Volunteer locations will appear here during active field tasks.'}</p>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
